<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Песнь Августа</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: 'Georgia', serif;
  background: #0a0a14;
  color: #eee;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#bg {
  position: fixed; inset: 0;
  background-size: cover;
  background-position: center;
  background-color: #0a0a14;
  z-index: 1;
  transition: opacity 0.6s ease;
}
#bg::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 30%, transparent 60%, rgba(0,0,0,0.8) 100%);
}
#dialogue {
  position: fixed;
  left: 50%; bottom: 3vh;
  transform: translateX(-50%);
  width: min(900px, 94vw);
  min-height: 22vh;
  background: linear-gradient(180deg, rgba(28,22,14,0.95), rgba(14,10,6,0.98));
  border: 1px solid rgba(244,197,66,0.6);
  border-radius: 6px;
  padding: 34px 30px 26px;
  z-index: 10;
  cursor: pointer;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(255,200,80,0.1);
}
#speaker {
  position: absolute;
  top: -18px; left: 24px;
  padding: 8px 22px;
  background: linear-gradient(180deg, #d97706, #a04b0a);
  color: #FFF8E7;
  font-size: 15px;
  font-weight: bold;
  border-radius: 4px;
  border: 1px solid rgba(244,197,66,0.9);
  letter-spacing: 1.5px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.6);
  display: none;
}
#speaker.show { display: block; }
#text {
  font-size: clamp(15px, 1.3vw, 19px);
  line-height: 1.75;
  color: #f5ecd7;
  text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  min-height: 12vh;
}
#text b { color: #FFE9A8; }
#text i { color: #d8c9a8; }
.cursor {
  display: inline-block;
  color: #FFD700;
  animation: blink 0.8s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
#choices {
  position: fixed;
  left: 50%; bottom: 32vh;
  transform: translateX(-50%);
  width: min(700px, 90vw);
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 11;
}
#choices button {
  padding: 14px 22px;
  background: linear-gradient(180deg, rgba(28,22,14,0.95), rgba(14,10,6,0.98));
  color: #F5ECD7;
  border: 1px solid rgba(244,197,66,0.5);
  border-radius: 4px;
  font-family: inherit;
  font-size: clamp(13px, 1.1vw, 16px);
  text-align: left;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  padding-left: 50px;
}
#choices button::before {
  content: '▸';
  position: absolute;
  left: 20px; top: 50%;
  transform: translateY(-50%);
  color: #FBBF24;
  font-size: 18px;
}
#choices button:hover {
  background: linear-gradient(180deg, rgba(244,197,66,0.2), rgba(180,120,20,0.15));
  border-color: #FBBF24;
  transform: translateX(6px);
  color: #FFF8E7;
}
#hint {
  position: absolute;
  right: 20px; bottom: 12px;
  color: #FFD700;
  font-size: 20px;
  animation: bounce 1.4s infinite;
  opacity: 0.8;
}
@keyframes bounce {
  0%,100% { transform: translateY(0); opacity: 0.4; }
  50% { transform: translateY(6px); opacity: 1; }
}
#menu {
  position: fixed;
  top: 16px; right: 16px;
  display: flex; gap: 10px;
  z-index: 20;
}
#menu button {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: rgba(28,22,14,0.9);
  border: 1px solid rgba(244,197,66,0.7);
  color: #FBBF24;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.25s;
}
#menu button:hover {
  background: rgba(244,197,66,0.2);
  transform: scale(1.1);
}
#title-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 30px;
  z-index: 30;
  background: linear-gradient(180deg, rgba(0,0,0,0.85), rgba(0,0,0,0.5), rgba(0,0,0,0.9));
  text-align: center;
  padding: 20px;

#title-screen h1 {
  font-size: clamp(36px, 7vw, 72px);
  color: #FFF8E7;
  letter-spacing: 6px;
  text-shadow:

    -3px 3px 0 #8B4513, 3px 3px 0 #8B4513,
    0 0 50px rgba(255,220,100,0.9);
}
#title-screen .sub {
  color: #FFF3C4;
  font-style: italic;
  letter-spacing: 4px;
  font-size: 14px;
  text-transform: uppercase;
  margin-top: -20px;
}
#title-screen .menu {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: min(300px, 80vw);
}
#title-screen .menu button {
  padding: 14px 24px;
  background: linear-gradient(180deg, rgba(28,22,14,0.95), rgba(14,10,6,0.98));
  color: #FFE9A8;
  border: 1px solid rgba(244,197,66,0.6);

}
#title-screen .menu button:disabled {

#title-screen .footer {

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
const SAVE_KEY = 'pesn_augusta_simple';
const state = {
  current: 'start',
  isTyping: false,
  typeTimer: null
};

const $ = id => document.getElementById(id);
const bgEl = $('bg');
const dialogueEl = $('dialogue');
const speakerEl = $('speaker');
const textEl = $('text');
const choicesEl = $('choices');
const hintEl = $('hint');
const titleEl = $('title-screen');
const menuEl = $('menu');

/* ============================================================
   ФОН
   ============================================================ */
function setBg(url) {
  if (!url) return;
  if (bgEl.style.backgroundImage.includes(url)) return;
  bgEl.style.opacity = '0';
  setTimeout(() => {
    bgEl.style.backgroundImage = `url("${url}")`;
    bgEl.style.opacity = '1';
  }, 300);
}

/* ============================================================
   ПЕЧАТАЮЩИЙСЯ ТЕКСТ
   ============================================================ */
function typeText(html, callback) {
  // Разбиваем на токены: теги и символы
  const tokens = [];
  let i = 0;
  while (i < html.length) {
    if (html[i] === '<') {
      const end = html.indexOf('>', i);
      if (end === -1) { tokens.push(html[i]); i++; continue; }
      tokens.push(html.slice(i, end + 1));
      i = end + 1;
    } else {
      tokens.push(html[i]);
      i++;
    }
  }

  textEl.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  cursor.textContent = '▍';
  textEl.appendChild(cursor);

  let idx = 0;
  function step() {
    if (idx >= tokens.length) {
      cursor.remove();
      textEl.innerHTML = html;
      state.isTyping = false;
      if (callback) callback();
      return;
    }
    const t = tokens[idx++];
    cursor.insertAdjacentHTML('beforebegin', t);
    if (t.startsWith('<')) step();
    else state.typeTimer = setTimeout(step, 30);
  }
  step();
}

/* ============================================================
   ПОКАЗ ПАССАЖА
   ============================================================ */
function showPassage(id) {
  const p = STORY[id];
  if (!p) { console.error('Нет пассажа:', id); return; }

  if (state.typeTimer) { clearTimeout(state.typeTimer); state.typeTimer = null; }
  state.isTyping = false;
  state.current = id;

  setBg(p.bg);

  // Спикер
  if (p.speaker) {
    speakerEl.textContent = p.speaker;
    speakerEl.classList.add('show');
  } else {
    speakerEl.classList.remove('show');
  }

  // Выборы
  choicesEl.innerHTML = '';
  if (p.choices && p.choices.length > 0) {
    choicesEl.classList.remove('hidden');
    hintEl.style.display = 'none';
    p.choices.forEach(c => {
      const btn = document.createElement('button');
      btn.textContent = c.text;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        showPassage(c.to);
      });
      choicesEl.appendChild(btn);
    });
  } else {
    choicesEl.classList.add('hidden');
    if (p.ending) {
      hintEl.style.display = 'none';
    } else {
      hintEl.style.display = 'block';
    }
  }

  // Текст
  state.isTyping = true;
  typeText(p.text, () => { state.isTyping = false; });

  // Сохраняем
  saveGame();
}

/* ============================================================
   ПРОДВИЖЕНИЕ
   ============================================================ */
function advance() {
  const p = STORY[state.current];
  if (!p) return;

  // Если печатается — показать сразу
  if (state.isTyping) {
    if (state.typeTimer) { clearTimeout(state.typeTimer); state.typeTimer = null; }
    textEl.innerHTML = p.text;
    state.isTyping = false;
    return;
  }

  // Если есть выборы — не идём дальше
  if (p.choices && p.choices.length > 0) return;

  // Если есть next — идём
  if (p.next) {
    showPassage(p.next);
    return;
  }

  // Если концовка — вернуться в меню
  if (p.ending) {
    setTimeout(goHome, 500);
  }
}

/* ============================================================
   СОХРАНЕНИЕ
   ============================================================ */
function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ current: state.current, time: Date.now() }));
  } catch (e) {}
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data.current || !STORY[data.current]) return false;
    return data.current;
  } catch (e) { return false; }
}
function hasSave() {
  try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
}
function resetGame() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}

/* ============================================================
   ЭКРАНЫ
   ============================================================ */
function showTitle() {
  titleEl.classList.remove('hidden');
  dialogueEl.classList.add('hidden');
  choicesEl.classList.add('hidden');
  menuEl.classList.add('hidden');
  $('btn-continue').disabled = !hasSave();
}

function startGame() {
  titleEl.classList.add('hidden');
  dialogueEl.classList.remove('hidden');
  menuEl.classList.remove('hidden');
  showPassage('start');
}

function continueGame() {
  const saved = loadGame();
  if (!saved) { alert('Сохранение не найдено'); return; }
  titleEl.classList.add('hidden');
  dialogueEl.classList.remove('hidden');
  menuEl.classList.remove('hidden');
  showPassage(saved);
}

function goHome() {
  showTitle();
}

/* ============================================================
   СОБЫТИЯ
   ============================================================ */
$('btn-start').addEventListener('click', startGame);
$('btn-continue').addEventListener('click', continueGame);
$('btn-reset').addEventListener('click', () => {
  if (confirm('Сбросить весь прогресс?')) {
    resetGame();
    showTitle();
  }
});

dialogueEl.addEventListener('click', advance);

$('btn-save').addEventListener('click', (e) => {
  e.stopPropagation();
  saveGame();
  const btn = e.currentTarget;
  btn.textContent = '✅';
  setTimeout(() => { btn.textContent = '💾'; }, 1000);
});

$('btn-home').addEventListener('click', (e) => {
  e.stopPropagation();
  if (confirm('Вернуться в главное меню? Прогресс сохранён.')) {
    goHome();
  }
});

document.addEventListener('keydown', (e) => {
  if (titleEl.classList.contains('hidden')) {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      advance();
    }
  } else {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (hasSave()) continueGame();
      else startGame();
    }
  }
});

/* ============================================================
   СТАРТ
   ============================================================ */
showTitle();
</script>
</body>
</html>
