<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Песнь Августа</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f4ecd8; --dim:#c9c0a6;
  --bg1:#0e1330; --bg2:#1c2350; --panel:#171c3d;
  --gold:#f2c14e; --amber:#e08a4c; --moss:#8bab7a; --line:rgba(242,193,78,.25);
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --ink:#2c2412; --dim:#5b503a; }}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
*{box-sizing:inherit;}
body{
  margin:0;min-height:100%;font-family:'Lora',Georgia,serif;color:var(--ink);
  background:
    radial-gradient(ellipse at 20% 0%, #2a2f66 0%, transparent 55%),
    radial-gradient(ellipse at 85% 15%, #3a2a5c 0%, transparent 50%),
    linear-gradient(180deg,var(--bg1),var(--bg2) 60%,#0a0d24);
  overflow-x:hidden;position:relative;
}
.fireflies{position:fixed;inset:0;pointer-events:none;z-index:0;}
.firefly{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 6px 2px var(--gold);opacity:.7;animation:drift linear infinite;}
@keyframes drift{
  0%{transform:translate(0,0);opacity:.2;}
  50%{opacity:.9;}
  100%{transform:translate(var(--dx),var(--dy));opacity:.2;}
}
@media (prefers-reduced-motion: reduce){ .firefly{animation:none;opacity:.5;} .fade{animation:none !important;} }

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;
  justify-content:space-between;padding:.7rem 1.1rem;background:rgba(10,13,36,.75);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);gap:.6rem;flex-wrap:wrap;}
header h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.25rem;margin:0;letter-spacing:.02em;color:var(--gold);}
.header-right{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;}
.inv{display:flex;gap:.45rem;font-size:1.15rem;min-height:1.6rem;}
.inv span{opacity:.25;transition:opacity .4s,transform .4s;cursor:help;}
.inv span.got{opacity:1;transform:scale(1.1);filter:drop-shadow(0 0 6px var(--gold));}
.iconbtn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;
  padding:.3rem .7rem;font-size:.85rem;cursor:pointer;font-family:'Lora',serif;transition:all .2s;}
.iconbtn:hover{color:var(--gold);border-color:var(--gold);}
.iconbtn.active{color:var(--gold);border-color:var(--gold);background:rgba(242,193,78,.1);}

main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:1.6rem 1.2rem 4rem;}
.card{background:linear-gradient(180deg,rgba(23,28,61,.9),rgba(14,19,48,.92));
  border:1px solid var(--line);border-radius:14px;padding:1.8rem 1.6rem;
  box-shadow:0 0 40px rgba(242,193,78,.06), inset 0 0 60px rgba(242,193,78,.03);}
.fade{animation:fadein .5s ease both;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
h2.title{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.5rem;color:var(--amber);
  margin:0 0 .9rem;}
h2.title.gold{color:var(--gold);}
h2.title.moss{color:var(--moss);}
.scene{width:100%;border-radius:10px;overflow:hidden;margin-bottom:1.1rem;border:1px solid var(--line);
  background:#0a0d24;aspect-ratio:16/8;}
.scene svg{width:100%;height:100%;display:block;}
.glow{animation:glowpulse 3s ease-in-out infinite;}
@keyframes glowpulse{0%,100%{opacity:.55;}50%{opacity:1;}}
@media (prefers-reduced-motion: reduce){ .glow{animation:none;opacity:.85;} }
.passage p{line-height:1.75;margin:0 0 .95rem;color:var(--ink);}
.passage em{color:var(--gold);font-style:italic;}
.passage strong{color:var(--gold);font-weight:600;}
blockquote{border-left:2px solid var(--amber);margin:1rem 0;padding:.2rem 0 .2rem 1rem;
  color:var(--dim);font-style:italic;}
.choices{display:flex;flex-direction:column;gap:.6rem;margin-top:1.3rem;}
.choice{text-align:left;background:rgba(242,193,78,.06);border:1px solid var(--line);
  color:var(--ink);padding:.7rem 1rem;border-radius:9px;font-family:'Lora',serif;font-size:1rem;
  cursor:pointer;transition:background .2s,border-color .2s,transform .15s;position:relative;}
.choice:hover:not(.disabled){background:rgba(242,193,78,.14);border-color:var(--gold);transform:translateX(3px);}
.choice:active:not(.disabled){transform:translateX(1px) scale(.99);}
.choice .tag{color:var(--moss);font-size:.85em;}
.choice.disabled{opacity:.45;cursor:not-allowed;border-style:dashed;}
.choice.disabled::before{content:'🔒 ';color:var(--dim);}
.choice .need{color:#e07b39;font-size:.85em;font-style:italic;margin-left:.3em;}
.ending{border-color:var(--gold);}
.restart{margin-top:1.4rem;width:100%;background:linear-gradient(90deg,var(--amber),var(--gold));
  border:none;color:#241a06;font-weight:600;padding:.75rem;border-radius:9px;cursor:pointer;font-size:1rem;
  font-family:'Cormorant Garamond',serif;letter-spacing:.02em;transition:transform .15s;}
.restart:hover{transform:translateY(-1px);}
.beetle{display:inline-block;filter:drop-shadow(0 0 6px var(--gold));animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.6;transform:scale(1);}50%{opacity:1;transform:scale(1.15);}}
footer{text-align:center;color:var(--dim);font-size:.8rem;padding:1rem;opacity:.6;position:relative;z-index:1;
  padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px));}

/* === Модальные окна === */
.modal-overlay{position:fixed;inset:0;background:rgba(5,7,20,.85);backdrop-filter:blur(6px);
  z-index:100;display:none;align-items:center;justify-content:center;padding:1rem;
  animation:fadein .3s ease;}
.modal-overlay.show{display:flex;}
.modal{background:linear-gradient(180deg,rgba(23,28,61,.98),rgba(14,19,48,.99));
  border:1px solid var(--line);border-radius:14px;padding:1.6rem;
  max-width:560px;width:100%;max-height:80vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.7);animation:fadein .4s ease;}
.modal h2{font-family:'Cormorant Garamond',serif;color:var(--gold);margin:0 0 1rem;
  font-size:1.4rem;letter-spacing:.03em;border-bottom:1px solid var(--line);padding-bottom:.7rem;}
.modal h3{color:var(--amber);font-size:.9rem;text-transform:uppercase;letter-spacing:.15em;
  margin:1.2rem 0 .6rem;font-family:'Lora',serif;font-weight:500;}
.modal .item-row{display:flex;gap:.7rem;align-items:flex-start;padding:.55rem 0;
  border-bottom:1px solid rgba(242,193,78,.1);}
.modal .item-row:last-child{border-bottom:none;}
.modal .item-icon{font-size:1.5rem;line-height:1;flex-shrink:0;}
.modal .item-icon.locked{opacity:.25;filter:grayscale(1);}
.modal .item-info{flex:1;}
.modal .item-name{color:var(--ink);font-weight:500;}
.modal .item-name.locked{color:var(--dim);}
.modal .item-hint{color:var(--dim);font-size:.82rem;font-style:italic;margin-top:.15rem;}
.modal .ending-status{padding:.6rem .8rem;border-radius:8px;margin-bottom:.5rem;
  display:flex;justify-content:space-between;align-items:center;font-size:.9rem;}
.modal .ending-status.ready{background:rgba(139,171,122,.12);border:1px solid rgba(139,171,122,.4);color:var(--moss);}
.modal .ending-status.locked{background:rgba(224,138,76,.08);border:1px solid rgba(224,138,76,.3);color:var(--dim);}
.modal .ending-status .status-need{font-size:.78rem;color:#e07b39;margin-top:.2rem;}
.modal .ach-row{display:flex;gap:.7rem;align-items:center;padding:.6rem .3rem;border-radius:6px;transition:background .2s;}
.modal .ach-row:hover{background:rgba(242,193,78,.06);}
.modal .ach-row.locked{opacity:.35;filter:grayscale(.8);}
.modal .ach-icon{font-size:1.6rem;}
.modal .ach-title{color:var(--gold);font-weight:500;}
.modal .ach-desc{color:var(--dim);font-size:.8rem;}
.modal .settings-row{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;
  border-bottom:1px solid rgba(242,193,78,.1);gap:1rem;flex-wrap:wrap;}
.modal .settings-row:last-child{border-bottom:none;}
.modal .settings-row label{color:var(--ink);font-size:.9rem;}
.modal select,.modal input[type=range]{background:#0e1330;color:var(--ink);border:1px solid var(--line);
  padding:.4rem .6rem;border-radius:6px;font-family:'Lora',serif;font-size:.85rem;cursor:pointer;}
.modal .btn-close{margin-top:1.2rem;width:100%;background:linear-gradient(90deg,var(--amber),var(--gold));
  border:none;color:#241a06;font-weight:600;padding:.7rem;border-radius:9px;cursor:pointer;
  font-size:1rem;font-family:'Cormorant Garamond',serif;letter-spacing:.02em;}

/* === Карточка предмета === */
.item-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);
  z-index:200;background:linear-gradient(180deg,rgba(23,28,61,.98),rgba(14,19,48,.99));
  border:2px solid var(--gold);border-radius:14px;padding:1.4rem 2rem;text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.85),0 0 60px rgba(242,193,78,.5);
  opacity:0;pointer-events:none;transition:opacity .5s,transform .5s cubic-bezier(.22,1,.36,1);}
.item-popup.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.item-popup .popup-icon{font-size:3rem;margin-bottom:.5rem;filter:drop-shadow(0 0 20px var(--gold));}
.item-popup .popup-label{color:var(--gold);font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;margin-bottom:.4rem;}
.item-popup .popup-name{color:var(--ink);font-size:1.2rem;font-weight:600;font-family:'Cormorant Garamond',serif;letter-spacing:.03em;}
.item-popup .popup-hint{color:var(--dim);font-size:.82rem;font-style:italic;margin-top:.5rem;}

/* === Уведомления === */
.notification{position:fixed;top:80px;right:20px;background:linear-gradient(180deg,rgba(224,138,76,.97),rgba(160,75,10,.97));
  color:#fff8e7;padding:.8rem 1.3rem;border:1px solid var(--gold);border-left:4px solid var(--gold);
  border-radius:8px;font-size:.85rem;z-index:150;opacity:0;transform:translateX(80px);
  transition:all .4s cubic-bezier(.22,1,.36,1);pointer-events:none;max-width:300px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);}
.notification.show{opacity:1;transform:translateX(0);}
.notification.warn{background:linear-gradient(180deg,rgba(180,60,30,.97),rgba(120,30,10,.97));
  border-color:#f87171;border-left-color:#f87171;}
.notification b{display:block;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;margin-bottom:.25rem;color:#ffe9a8;}

/* === Экран концовки === */
.ending-screen{text-align:center;padding:1rem 0;}
.ending-screen .big-title{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:700;
  margin:0 0 .5rem;letter-spacing:.04em;}
.ending-screen .big-title.harmony{color:var(--gold);text-shadow:0 0 30px rgba(242,193,78,.6);}
.ending-screen .big-title.mastery{color:var(--moss);text-shadow:0 0 30px rgba(139,171,122,.6);}
.ending-screen .sub{color:var(--dim);font-style:italic;margin-bottom:1.5rem;font-size:.95rem;}
.ending-screen .btn-row{display:flex;flex-direction:column;gap:.6rem;margin-top:1.5rem;}
.ending-screen .btn-row button{padding:.7rem 1rem;border-radius:9px;border:1px solid var(--line);
  background:rgba(242,193,78,.06);color:var(--ink);font-family:'Lora',serif;font-size:.95rem;cursor:pointer;
  transition:all .2s;}
.ending-screen .btn-row button:hover{background:rgba(242,193,78,.14);border-color:var(--gold);}
.ending-screen .btn-row button.primary{background:linear-gradient(90deg,var(--amber),var(--gold));
  border:none;color:#241a06;font-weight:600;font-family:'Cormorant Garamond',serif;font-size:1rem;}
</style>
</head>
<body>
<div class="fireflies" id="fireflies"></div>
<header>
  <h1><span class="beetle">✨</span> Песнь Августа</h1>
  <div class="header-right">
    <div class="inv" id="inv">
      <span data-k="feather" title="Перо Лазурной Сойки">🪶</span>
      <span data-k="crystal" title="Кристалл Горного Кварца">💎</span>
      <span data-k="drops" title="Капли Селесты">🧪</span>
      <span data-k="key" title="Латунный ключ Тик-Така">🗝️</span>
      <span data-k="scheme" title="Схема Олвена">📜</span>
    </div>
    <button class="iconbtn" id="journalBtn" title="Журнал">📖</button>
    <button class="iconbtn" id="achBtn" title="Достижения">🏆</button>
    <button class="iconbtn" id="setBtn" title="Настройки">⚙</button>
    <button class="iconbtn" id="soundBtn">🔈 звук</button>
  </div>
</header>
<main><div class="card" id="card"></div></main>
<footer>Интерактивная сказка · выборы и предметы определяют финал</footer>

<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>

<div class="item-popup" id="itemPopup">
  <div class="popup-icon" id="popupIcon">✨</div>
  <div class="popup-label">Получен предмет</div>
  <div class="popup-name" id="popupName"></div>
  <div class="popup-hint" id="popupHint"></div>
</div>

<div class="notification" id="notification"></div>

<script>
/* ============================================================
   ПЕСНЬ АВГУСТА — объединённая версия
   Визуал/звук: SVG + Web Audio (без внешних файлов)
   2 финала, проверка предметов, сохранения, журнал, достижения
   ============================================================ */

/* ---------- AUDIO (synthesised) ---------- */
let actx=null, droneOn=false, gainNode=null, osc1=null, osc2=null;
function ensureAudio(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } }
function toggleDrone(){
  ensureAudio(); if(!actx) return;
  if(!droneOn){
    gainNode=actx.createGain(); gainNode.gain.value=0;
    osc1=actx.createOscillator(); osc1.type='sine'; osc1.frequency.value=110;
    osc2=actx.createOscillator(); osc2.type='sine'; osc2.frequency.value=165;
    const lfo=actx.createOscillator(); lfo.type='sine'; lfo.frequency.value=.12;
    const lfoGain=actx.createGain(); lfoGain.gain.value=.015;
    lfo.connect(lfoGain); lfoGain.connect(gainNode.gain);
    osc1.connect(gainNode); osc2.connect(gainNode); gainNode.connect(actx.destination);
    osc1.start(); osc2.start(); lfo.start();
    gainNode.gain.linearRampToValueAtTime(.05*(state.settings.volume||1), actx.currentTime+1.2);
    droneOn=true; document.getElementById('soundBtn').textContent='🔊 звук';
    document.getElementById('soundBtn').classList.add('active');
  } else {
    gainNode.gain.linearRampToValueAtTime(0, actx.currentTime+.6);
    setTimeout(()=>{ try{osc1.stop();osc2.stop();}catch(e){} },700);
    droneOn=false; document.getElementById('soundBtn').textContent='🔈 звук';
    document.getElementById('soundBtn').classList.remove('active');
  }
}
function tick(freq){
  if(!state.settings.sfx) return;
  ensureAudio(); if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='triangle'; o.frequency.value=freq||740;
  g.gain.value=.04*(state.settings.volume||1); o.connect(g); g.connect(actx.destination);
  o.start(); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+.18); o.stop(actx.currentTime+.2);
}
function chime(){
  if(!state.settings.sfx) return;
  ensureAudio(); if(!actx) return;
  [660, 880, 1320].forEach((f,i)=>{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.value=0; o.connect(g); g.connect(actx.destination);
    o.start(); 
    const t=actx.currentTime+i*0.1;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.06,t+.05);
    g.gain.exponentialRampToValueAtTime(.0001,t+.8);
    o.stop(t+.9);
  });
}

/* ---------- FIREFLIES ---------- */
const fc=document.getElementById('fireflies');
for(let i=0;i<22;i++){
  const f=document.createElement('div'); f.className='firefly';
  f.style.left=Math.random()*100+'vw'; f.style.top=Math.random()*100+'vh';
  f.style.setProperty('--dx',(Math.random()*160-80)+'px'); f.style.setProperty('--dy',(Math.random()*160-80)+'px');
  f.style.animationDuration=(6+Math.random()*8)+'s'; f.style.animationDelay=(-Math.random()*8)+'s';
  fc.appendChild(f);
}

/* ---------- STATE + SAVE ---------- */
const SAVE_KEY='pesn_augusta_v1';
const state={
  scene:'start',
  items:{feather:false,crystal:false,drops:false,key:false,scheme:false},
  endings:{harmony:false, mastery:false},
  achievements:{},
  settings:{volume:1, sfx:true}
};
function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({
    scene:state.scene, items:state.items, endings:state.endings,
    achievements:state.achievements, settings:state.settings
  })); }catch(e){}
}
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY); if(!raw) return false;
    const d=JSON.parse(raw);
    if(d.scene) state.scene=d.scene;
    if(d.items) Object.assign(state.items, d.items);
    if(d.endings) Object.assign(state.endings, d.endings);
    if(d.achievements) state.achievements=d.achievements;
    if(d.settings) Object.assign(state.settings, d.settings);
    return true;
  }catch(e){ return false; }
}
function resetAll(){
  state.scene='start';
  Object.keys(state.items).forEach(k=>state.items[k]=false);
  state.endings={harmony:false, mastery:false};
  state.achievements={};
  save();
}

/* ---------- INVENTORY ---------- */
function give(items){ items.forEach(k=>state.items[k]=true); renderInv(); }
function renderInv(){ document.querySelectorAll('#inv span').forEach(s=>{
  s.classList.toggle('got', !!state.items[s.dataset.k]); }); }
function has(k){ return !!state.items[k]; }

/* ---------- ACHIEVEMENTS ---------- */
const ACH={
  feather:{icon:'🪶',title:'Перо Лазурной Сойки',desc:'Отгадать загадку Бруно'},
  crystal:{icon:'💎',title:'Кристалл Кварца',desc:'Угостить Бруно яблоком'},
  drops:{icon:'🧪',title:'Капли Селесты',desc:'Заглянуть к травнице'},
  key:{icon:'🗝️',title:'Латунный ключ',desc:'Взять ключ у Тик-Така'},
  scheme:{icon:'📜',title:'Схема Олвена',desc:'Показать письмо Корнелиусу'},
  harmony:{icon:'✨',title:'Финал Гармонии',desc:'Пройти путь единства'},
  mastery:{icon:'⚙',title:'Финал Мастерства',desc:'Пройти путь инженерии'},
  allEndings:{icon:'👑',title:'Обе концовки',desc:'Открыть оба финала'}
};
function unlockAch(key){
  if(state.achievements[key]) return;
  state.achievements[key]=true; save();
  const a=ACH[key]; if(a){
    showNotification('🏆 Достижение', `${a.icon} ${a.title}`);
    chime();
  }
  if(state.endings.harmony && state.endings.mastery) unlockAch('allEndings');
}

/* ---------- UI HELPERS ---------- */
let notifyTimer=null;
function showNotification(title, text, type){
  const el=document.getElementById('notification');
  el.innerHTML=`<b>${title}</b>${text}`;
  el.classList.toggle('warn', type==='warn');
  el.classList.add('show');
  if(notifyTimer) clearTimeout(notifyTimer);
  notifyTimer=setTimeout(()=>el.classList.remove('show'), 3200);
}
let popupTimer=null;
function showItemPopup(key){
  const data=ITEMS[key]; if(!data) return;
  document.getElementById('popupIcon').textContent=data.icon;
  document.getElementById('popupName').textContent=data.name;
  document.getElementById('popupHint').textContent=data.hint;
  const p=document.getElementById('itemPopup');
  p.classList.add('show');
  if(popupTimer) clearTimeout(popupTimer);
  popupTimer=setTimeout(()=>p.classList.remove('show'), 2500);
}

/* ---------- ITEM DATA ---------- */
const ITEMS={
  feather:{icon:'🪶',name:'Перо Лазурной Сойки',hint:'Сметает пыль веков с колоколов'},
  crystal:{icon:'💎',name:'Кристалл Горного Кварца',hint:'Фокусирует оптику маяка'},
  drops:{icon:'🧪',name:'Капли Селесты',hint:'Возвращают Августу бодрость духа'},
  key:{icon:'🗝️',name:'Латунный ключ Тик-Така',hint:'Калибрует призмы механизма'},
  scheme:{icon:'📜',name:'Схема Олвена',hint:'Угол 45° к центральной линзе'}
};

/* ---------- FINAL CHECK ---------- */
function canDoHarmony(){ return has('drops') && has('scheme'); }
function canDoMastery(){ return has('key') || has('crystal'); }
function missingHarmony(){
  const m=[]; if(!has('drops'))m.push('🧪 Капли Селесты'); if(!has('scheme'))m.push('📜 Схема Олвена'); return m;
}
function missingMastery(){
  const m=[]; if(!has('key') && !has('crystal'))m.push('🗝️ Ключ или 💎 Кристалл'); return m;
}

/* ---------- STORY ---------- */
const P={

/* ---------- RENDER ---------- */
const card=document.getElementById('card');
function go(id, skipSave){
  const p=P[id];
  if(!p) return;
  if(p.give){
    const newItems=p.give.filter(k=>!state.items[k]);
    give(p.give);
    newItems.forEach((k,i)=>setTimeout(()=>{
      showItemPopup(k);
      unlockAch(k);
    }, 500 + i*1400));
  }
  tick();
  state.scene=id;
  if(!skipSave) save();

  const isEnd=!!p.end;
  const sceneKey=SCENE_MAP[id]||'home';

  card.classList.remove('fade'); void card.offsetWidth; card.classList.add('fade');

  // Если это финал — показываем экран концовки вместо обычной сцены
  if(isEnd){
    const isHarmony=p.ending==='harmony';
    if(p.ending) { state.endings[p.ending]=true; save(); unlockAch(p.ending); }
    card.innerHTML = `
      <div class="scene">${SCENES[sceneKey]}</div>
      <div class="ending-screen">
        <h2 class="big-title ${isHarmony?'harmony':'mastery'}">${isHarmony?'✨ Финал Гармонии':'⚙ Финал Мастерства'}</h2>
        <p class="sub">${isHarmony?'Природа, наука и тепло сердец — вместе':'Точный расчёт и крепкая дружба'}</p>
        <div class="passage">${p.t}</div>
        <div class="btn-row">
          <button class="primary" id="againBtn">🔄 Пройти заново</button>
          <button id="otherBtn">🎭 Другая концовка</button>
          <button id="menuBtn">📜 К началу</button>
        </div>
      </div>`;
    document.getElementById('againBtn').onclick=()=>{ resetAll(); renderInv(); go('start'); };
    document.getElementById('otherBtn').onclick=()=>{
      // Оставляем предметы, но возвращаемся к башне
      go('tower_in', true);
    };
    document.getElementById('menuBtn').onclick=()=>{ resetAll(); renderInv(); go('start'); };
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }

  // Обычная сцена
  const choicesHTML=(p.c||[]).map(ch=>{
    let cls='choice', extra='';
    if(ch.t==='end_harmony' && !canDoHarmony()){
      cls+=' disabled';
      extra=`<span class="need">(нужно: ${missingHarmony().join(', ')})</span>`;
    }
    if(ch.t==='end_mastery' && !canDoMastery()){
      cls+=' disabled';
      extra=`<span class="need">(нужно: ${missingMastery().join(', ')})</span>`;
    }
    return `<button class="${cls}" data-t="${ch.t}">${ch.l}${extra}</button>`;
  }).join('');

  card.innerHTML = `
    <div class="scene">${SCENES[sceneKey]}</div>
    <div class="passage"><p>${p.t}</p></div>
    <div class="choices">${choicesHTML}</div>`;

  card.querySelectorAll('.choice').forEach(b=>{
    b.onclick=()=>{
      if(b.classList.contains('disabled')){
        const isH=b.dataset.t==='end_harmony';
        const missing=isH?missingHarmony():missingMastery();
        showNotification('⚠ Не хватает предметов', `Соберите: ${missing.join(', ')}`, 'warn');
        tick(400);
        return;
      }
      go(b.dataset.t);
    };
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

const modalContent=document.getElementById('modalContent');
function closeModal(){ overlay.classList.remove('show'); }
overlay.onclick=(e)=>{ if(e.target===overlay) closeModal(); };

function openJournal(){
  let html='<h2>📖 Журнал</h2>';
  html+='<h3>Предметы</h3>';
  const allKeys=['feather','crystal','drops','key','scheme'];
  const owned=allKeys.filter(k=>state.items[k]);
  if(owned.length===0){
    html+='<p style="color:var(--dim);font-style:italic;font-size:.85rem;">Пока ничего не найдено</p>';
  } else {
    owned.forEach(k=>{
      const it=ITEMS[k];
      html+=`<div class="item-row">
        <div class="item-icon">${it.icon}</div>
        <div class="item-info">
          <div class="item-name">${it.name}</div>
          <div class="item-hint">${it.hint}</div>
        </div>
      </div>`;
    });
  }
  html+='<h3>Доступные финалы</h3>';
  const hReady=canDoHarmony(), mReady=canDoMastery();
  html+=`<div class="ending-status ${hReady?'ready':'locked'}">
    <div>
      <div>${hReady?'✅':'🔒'} ✨ Финал Гармонии</div>
      ${hReady?'':'<div class="status-need">Нужно: '+missingHarmony().join(', ')+'</div>'}
    </div>
  </div>`;
  html+=`<div class="ending-status ${mReady?'ready':'locked'}">
    <div>
      <div>${mReady?'✅':'🔒'} ⚙ Финал Мастерства</div>
      ${mReady?'':'<div class="status-need">Нужно: '+missingMastery().join(', ')+'</div>'}
    </div>
  </div>`;
  html+='<button class="btn-close" onclick="closeModal()">Закрыть</button>';
  modalContent.innerHTML=html;
  overlay.classList.add('show');
}

function openAchievements(){
  let html='<h2>🏆 Достижения</h2>';
  Object.entries(ACH).forEach(([k,a])=>{
    const got=!!state.achievements[k];
    html+=`<div class="ach-row ${got?'':'locked'}">
      <div class="ach-icon">${got?a.icon:'🔒'}</div>
      <div>
        <div class="ach-title">${a.title}</div>
        <div class="ach-desc">${a.desc}</div>
      </div>
    </div>`;
  });
  html+='<button class="btn-close" onclick="closeModal()">Закрыть</button>';
  modalContent.innerHTML=html;
  overlay.classList.add('show');
}

function openSettings(){
  const s=state.settings;
  let html='<h2>⚙ Настройки</h2>';
  html+=`<div class="settings-row">
    <label>Звуковые эффекты</label>
    <select id="sfxSel">
      <option value="1" ${s.sfx?'selected':''}>Включены</option>
      <option value="0" ${!s.sfx?'selected':''}>Выключены</option>
    </select>
  </div>`;
  html+=`<div class="settings-row">
    <label>Громкость: <span id="volLabel">${Math.round((s.volume||1)*100)}%</span></label>
    <input type="range" id="volRange" min="0" max="1" step="0.05" value="${s.volume||1}" style="width:140px;">
  </div>`;
  html+='<button class="btn-close" id="resetBtn" style="background:linear-gradient(90deg,#8b2020,#c04040);color:#fff;margin-bottom:.5rem;">🗑 Сбросить весь прогресс</button>';
  html+='<button class="btn-close" onclick="closeModal()">Закрыть</button>';
  modalContent.innerHTML=html;
  overlay.classList.add('show');

  document.getElementById('sfxSel').onchange=(e)=>{
    state.settings.sfx=e.target.value==='1'; save();
  };
  document.getElementById('volRange').oninput=(e)=>{
    state.settings.volume=parseFloat(e.target.value);
    document.getElementById('volLabel').textContent=Math.round(state.settings.volume*100)+'%';
    if(droneOn && gainNode) gainNode.gain.value=.05*state.settings.volume;
    save();
  };
  document.getElementById('resetBtn').onclick=()=>{
    if(confirm('Сбросить весь прогресс: предметы, концовки, достижения?')){
      resetAll(); renderInv(); closeModal(); go('start');
    }
  };
}

/* ---------- EVENT LISTENERS ---------- */
document.getElementById('soundBtn').onclick=toggleDrone;
document.getElementById('journalBtn').onclick=openJournal;
document.getElementById('achBtn').onclick=openAchievements;
document.getElementById('setBtn').onclick=openSettings;

// Клик по иконке предмета в шапке — показать подсказку
document.querySelectorAll('#inv span').forEach(s=>{
  s.onclick=()=>{
    const k=s.dataset.k;
    if(state.items[k]) showItemPopup(k);
    else showNotification('🔒 Ещё не найдено', ITEMS[k].name+' — ищите в долине', 'warn');
  };
});

// ESC — закрыть модалку
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape') closeModal();
});

/* ---------- INIT ---------- */
function init(){
  load();
  renderInv();
  go(state.scene || 'start', true);
  // Автозапуск звука при первом клике
  const kick=()=>{ if(!droneOn) toggleDrone(); document.removeEventListener('click',kick); };
  document.addEventListener('click', kick, {once:true});
}
init();
</script>
</body>
</html>
