<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Песнь Августа</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: 'Georgia', 'Times New Roman', serif;
  background: #0a0a14; color: #eee;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.bg-layer {
  position: fixed; inset: 0;
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-color: #0a0a14;
  z-index: 1; pointer-events: none;
  opacity: 1;
  transition: opacity 0.8s ease-in-out;
  will-change: opacity, transform;
  animation: kenBurns 28s ease-in-out infinite alternate;
}
@keyframes kenBurns {
  0%   { transform: scale(1)    translate(0, 0); }
  100% { transform: scale(1.08) translate(-1.2%, -1%); }
}
.particles-layer {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 3;
  overflow: hidden;
}
.particle {
  position: absolute;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,220,120,1) 0%, rgba(255,180,50,0.6) 40%, transparent 70%);
  box-shadow: 0 0 8px rgba(255,200,80,0.9), 0 0 16px rgba(255,180,50,0.5);
  opacity: 0;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0%   { transform: translateY(0) translateX(0) scale(0.6); opacity: 0; }
  10%  { opacity: 0.85; }
  90%  { opacity: 0.65; }
  100% { transform: translateY(-110vh) translateX(40px) scale(1.1); opacity: 0; }
}
.insert-layer {
  position: fixed; inset: 0;
  z-index: 80;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.7s ease, visibility 0.7s ease;
  background-color: #000;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  transform: scale(1);
}
.insert-layer.active {
  opacity: 1;
  visibility: visible;
  animation: insertZoom 6s ease-out forwards;
}
@keyframes insertZoom {
  from { transform: scale(1); }
  to   { transform: scale(1.06); }
}
.vignette-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 4;
  background:
    radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,0.7) 100%),
    linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 25%, transparent 65%, rgba(0,0,0,0.7) 100%);
}
.loading-screen {
  position: fixed; inset: 0; z-index: 5000;
  background: radial-gradient(ellipse at center, #14101e 0%, #0a0a14 100%);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 24px;
  transition: opacity 0.8s ease;
}
.loading-screen.hidden { opacity: 0; pointer-events: none; }
.loading-spinner {
  width: 72px; height: 72px;
  border: 3px solid rgba(251,191,36,0.12);
  border-top-color: #FBBF24;
  border-right-color: rgba(251,191,36,0.5);
  border-radius: 50%;
  animation: spin 1.1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
  box-shadow: 0 0 40px rgba(251,191,36,0.35), inset 0 0 20px rgba(251,191,36,0.15);
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  color: #FBBF24; font-size: 14px;
  letter-spacing: 6px; text-transform: uppercase;
  animation: pulse 1.8s ease-in-out infinite;
  text-shadow: 0 0 16px rgba(251,191,36,0.7);
}
@keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

.click-layer {
  position: fixed; inset: 0; z-index: 90;
  background: transparent; cursor: pointer; display: none;
}
.click-layer.enabled { display: block; }

.dialogue-box {
  position: fixed; left: 50%; bottom: 3vh;
  transform: translateX(-50%);
  width: min(1240px, 94vw);
  max-height: 34vh;
  background: linear-gradient(180deg, rgba(28,22,14,0.92) 0%, rgba(14,10,6,0.97) 100%);
  border: 1px solid rgba(244,197,66,0.6);
  border-radius: 4px;
  box-shadow:
    0 -40px 80px rgba(0,0,0,0.7),
    0 24px 70px rgba(0,0,0,0.8),
    0 0 0 1px rgba(0,0,0,0.7),
    0 0 60px rgba(255,200,80,0.1),
    inset 0 1px 0 rgba(255,255,255,0.08),
    inset 0 0 80px rgba(255,180,50,0.04);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  z-index: 100;
  display: flex; flex-direction: column;
  animation: dialogueIn 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  overflow: visible; cursor: pointer;
}
.dialogue-box::before, .dialogue-box::after {
  content: ''; position: absolute;
  width: 28px; height: 28px;
  border: 2px solid rgba(244,197,66,0.85);
  pointer-events: none; z-index: 3;
}
.dialogue-box::before {
  top: -2px; left: -2px;
  border-right: none; border-bottom: none;
  border-radius: 4px 0 0 0;
  box-shadow: -2px -2px 12px rgba(255,200,80,0.3);
}
.dialogue-box::after {
  bottom: -2px; right: -2px;
  border-left: none; border-top: none;
  border-radius: 0 0 4px 0;
  box-shadow: 2px 2px 12px rgba(255,200,80,0.3);
}
.dialogue-box .top-line {
  position: absolute; top: -1px; left: 15%; right: 15%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,220,120,0.9), transparent);
  pointer-events: none; z-index: 3;
}
@keyframes dialogueIn {
  from { opacity: 0; transform: translateX(-50%) translateY(40px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.speaker-name {
  position: absolute; top: -26px; left: 34px;
  min-width: 150px; max-width: 360px;
  padding: 10px 26px 9px;
  background: linear-gradient(180deg, rgba(217,119,6,1) 0%, rgba(160,75,10,1) 100%);
  color: #FFF8E7;
  font-size: clamp(14px, 1.2vw, 18px);
  font-weight: bold; border-radius: 3px;
  border: 1px solid rgba(244,197,66,0.95);
  box-shadow:
    0 10px 28px rgba(0,0,0,0.7),
    0 0 24px rgba(255,180,50,0.35),
    inset 0 1px 0 rgba(255,255,255,0.3),
    inset 0 -6px 12px rgba(0,0,0,0.25);
  text-shadow: 1px 1px 4px rgba(0,0,0,0.85);
  letter-spacing: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  z-index: 4;
}
.speaker-name::after {
  content: ''; position: absolute;
  bottom: -6px; left: 22px;
  width: 0; height: 0;
  border-left: 7px solid transparent;
  border-right: 7px solid transparent;
  border-top: 7px solid rgba(160,75,10,1);
  filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
}
.dialogue-text {
  width: 100%; flex: 1;
  min-height: 13vh; max-height: 26vh;
  color: #f5ecd7;
  font-size: clamp(15px, 1.2vw, 19px);
  line-height: 1.85;
  text-shadow: 0 1px 3px rgba(0,0,0,0.95);
  padding: 34px 44px 30px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #FBBF24 rgba(255,243,196,0.1);
  letter-spacing: 0.2px;
}
.dialogue-text b { color: #FFE9A8; font-weight: bold; }
.dialogue-text i { color: #d8c9a8; font-style: italic; }
.type-cursor {
  display: inline-block; color: #FFD700;
  animation: cursorBlink 0.8s steps(2, start) infinite;
  font-weight: bold; margin-left: 2px;
  text-shadow: 0 0 10px rgba(255,215,0,0.95);
}
@keyframes cursorBlink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
.next-hint {
  position: absolute; right: 26px; bottom: 16px;
  color: #FFD700;
  font-size: clamp(18px, 1.5vw, 24px);
  opacity: 0.85;
  animation: nextPulse 1.5s ease-in-out infinite;
  pointer-events: none;
  text-shadow: 0 0 14px rgba(255,215,0,0.9);
}
@keyframes nextPulse {
  0%,100% { transform: translateY(0); opacity: 0.4; }
  50%     { transform: translateY(6px); opacity: 1; }
}
.dialogue-box.narrator { border-color: rgba(200,160,80,0.55); }
.dialogue-box.narrator .speaker-name { background: linear-gradient(180deg, rgba(180,130,40,1) 0%, rgba(130,90,25,1) 100%); }
.dialogue-box.narrator .speaker-name::after { border-top-color: rgba(130,90,25,1); }
.dialogue-box.mira { border-color: rgba(230,126,34,0.85); box-shadow: 0 -40px 80px rgba(0,0,0,0.7), 0 24px 70px rgba(0,0,0,0.8), 0 0 60px rgba(230,126,34,0.2), inset 0 1px 0 rgba(255,255,255,0.08); }
.dialogue-box.mira .speaker-name { background: linear-gradient(180deg, rgba(230,126,34,1) 0%, rgba(190,90,15,1) 100%); }
.dialogue-box.mira .speaker-name::after { border-top-color: rgba(190,90,15,1); }
.dialogue-box.bruno { border-color: rgba(170,170,170,0.8); }
.dialogue-box.bruno .speaker-name { background: linear-gradient(180deg, rgba(120,120,120,1) 0%, rgba(70,70,70,1) 100%); color: #F5F5F5; }
.dialogue-box.bruno .speaker-name::after { border-top-color: rgba(70,70,70,1); }
.dialogue-box.shustik { border-color: rgba(80,200,100,0.85); }
.dialogue-box.shustik .speaker-name { background: linear-gradient(180deg, rgba(60,160,80,1) 0%, rgba(35,110,55,1) 100%); }
.dialogue-box.shustik .speaker-name::after { border-top-color: rgba(35,110,55,1); }
.dialogue-box.selesta { border-color: rgba(160,120,210,0.85); }
.dialogue-box.selesta .speaker-name { background: linear-gradient(180deg, rgba(130,90,180,1) 0%, rgba(95,65,135,1) 100%); }
.dialogue-box.selesta .speaker-name::after { border-top-color: rgba(95,65,135,1); }
.dialogue-box.cornelius { border-color: rgba(80,120,210,0.85); }
.dialogue-box.cornelius .speaker-name { background: linear-gradient(180deg, rgba(60,100,180,1) 0%, rgba(35,65,135,1) 100%); }
.dialogue-box.cornelius .speaker-name::after { border-top-color: rgba(35,65,135,1); }
.dialogue-box.august {
  border-color: rgba(255,210,70,1);
  box-shadow:
    0 -40px 80px rgba(0,0,0,0.7),
    0 24px 70px rgba(0,0,0,0.8),
    0 0 70px rgba(255,200,50,0.45),
    inset 0 1px 0 rgba(255,220,100,0.4);
}
.dialogue-box.august .speaker-name { background: linear-gradient(180deg, rgba(255,210,70,1) 0%, rgba(220,160,20,1) 100%); color: #2A1500; }
.dialogue-box.august .speaker-name::after { border-top-color: rgba(220,160,20,1); }
.dialogue-box.olven { border-style: dashed; border-color: rgba(170,130,70,0.9); background: linear-gradient(180deg, rgba(50,38,22,0.94) 0%, rgba(28,20,10,0.97) 100%); }
.dialogue-box.olven .speaker-name { background: linear-gradient(180deg, rgba(150,110,55,1) 0%, rgba(100,70,30,1) 100%); }
.dialogue-box.olven .speaker-name::after { border-top-color: rgba(100,70,30,1); }
.dialogue-box.olven .dialogue-text { font-style: italic; color: #f0e3c8; }
.dialogue-box.final-box {
  border-color: rgba(255,215,0,1);
  box-shadow:
    0 -40px 80px rgba(0,0,0,0.7),
    0 24px 70px rgba(0,0,0,0.8),
    0 0 80px rgba(255,215,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.15);
}
.dialogue-box.final-box .speaker-name { background: linear-gradient(180deg, rgba(255,215,0,1) 0%, rgba(200,150,20,1) 100%); color: #2A1500; }
.dialogue-box.final-box .speaker-name::after { border-top-color: rgba(200,150,20,1); }

/* === КЛАССЫ ДЛЯ ТИК-ТАКА И ИГРОКА === */
.dialogue-box.tik_tak { border-color: rgba(200,180,100,0.85); }
.dialogue-box.tik_tak .speaker-name { background: linear-gradient(180deg, rgba(180,160,80,1) 0%, rgba(130,110,50,1) 100%); color: #FFF8E7; }
.dialogue-box.tik_tak .speaker-name::after { border-top-color: rgba(130,110,50,1); }
.dialogue-box.player { border-color: rgba(100,200,255,0.85); }
.dialogue-box.player .speaker-name { background: linear-gradient(180deg, rgba(60,140,200,1) 0%, rgba(35,90,150,1) 100%); color: #F0F8FF; }
.dialogue-box.player .speaker-name::after { border-top-color: rgba(35,90,150,1); }

.choice-box {
  position: fixed; left: 50%; bottom: 40vh;
  transform: translateX(-50%); z-index: 101;
  display: flex; flex-direction: column; gap: 14px;
  width: min(780px, 88vw);
  animation: choicesIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.2s backwards;
}
@keyframes choicesIn {
  from { opacity: 0; transform: translateX(-50%) translateY(24px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.choice-box a {
  position: relative;
  width: 100%; display: block; text-align: left;
  padding: 16px 26px 16px 60px;
  background: linear-gradient(180deg, rgba(28,22,14,0.94) 0%, rgba(14,10,6,0.97) 100%);
  color: #F5ECD7;
  border: 1px solid rgba(244,197,66,0.5);
  border-radius: 4px;
  text-decoration: none;
  font-size: clamp(13px, 1.05vw, 16px);
  font-weight: normal;
  line-height: 1.4;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 8px 24px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
  letter-spacing: 0.4px; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.choice-box a::before {
  content: '▸'; position: absolute;
  left: 22px; top: 50%;
  transform: translateY(-50%);
  color: #FBBF24; font-size: 18px;
  transition: all 0.3s ease;
  text-shadow: 0 0 10px rgba(255,200,80,0.7);
}
.choice-box a::after {
  content: ''; position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,200,80,0.15), transparent);
  transition: left 0.6s ease;
  pointer-events: none;
}
.choice-box a:hover::after { left: 100%; }
.choice-box a > span { position: relative; z-index: 1; }
.choice-box a:hover {
  background: linear-gradient(180deg, rgba(244,197,66,0.18) 0%, rgba(180,120,20,0.12) 100%);
  border-color: rgba(244,197,66,0.95);
  color: #FFF8E7;
  transform: translateX(6px);
  box-shadow:
    0 14px 38px rgba(0,0,0,0.7),
    0 0 30px rgba(255,200,80,0.3),
    inset 0 1px 0 rgba(255,255,255,0.12);
}
.choice-box a:hover::before { color: #FFD700; transform: translateY(-50%) translateX(4px); text-shadow: 0 0 16px rgba(255,215,0,1); }
.choice-box a:active { transform: translateX(6px) scale(0.995); }

.history-controls {
  position: fixed; top: 18px; left: 18px;
  display: flex; gap: 12px; z-index: 300;
  pointer-events: auto;
}
.history-btn {
  width: 50px; height: 50px;
  border-radius: 50%;
  border: 1px solid rgba(244,197,66,0.7);
  background: linear-gradient(180deg, rgba(28,22,14,0.9) 0%, rgba(14,10,6,0.95) 100%);
  color: #FBBF24;
  font-size: 22px; font-weight: bold;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 6px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
  user-select: none;
  font-family: 'Georgia', serif;
  padding: 0;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  -webkit-tap-highlight-color: transparent;
}
.history-btn:hover:not(:disabled) {
  transform: translateY(-3px) scale(1.08);
  box-shadow: 0 12px 30px rgba(0,0,0,0.7), 0 0 24px rgba(255,200,80,0.5);
  border-color: rgba(244,197,66,1);
  color: #FFD700;
}
.history-btn:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(0.8); }

.game-menu {
  position: fixed; top: 18px; right: 18px;
  display: flex; gap: 12px; z-index: 300;
}
.game-menu button {
  position: relative;
  width: 50px; height: 50px;
  border-radius: 50%;
  border: 1px solid rgba(244,197,66,0.7);
  background: linear-gradient(180deg, rgba(28,22,14,0.9) 0%, rgba(14,10,6,0.95) 100%);
  color: #FBBF24;
  font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 6px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
  padding: 0; overflow: hidden;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  -webkit-tap-highlight-color: transparent;
}
.game-menu button:hover {
  transform: translateY(-3px) scale(1.08);
  box-shadow: 0 12px 30px rgba(0,0,0,0.7), 0 0 24px rgba(255,200,80,0.5);
  border-color: rgba(244,197,66,1);
  color: #FFD700;
}

.notification {
  position: fixed; top: 90px; right: 24px;
  background: linear-gradient(180deg, rgba(217,119,6,0.97) 0%, rgba(160,75,10,0.97) 100%);
  color: #FFF8E7;
  padding: 16px 26px 16px 30px;
  border: 1px solid rgba(244,197,66,0.9);
  border-left: 4px solid #FBBF24;
  border-radius: 6px;
  box-shadow:
    0 14px 40px rgba(0,0,0,0.7),
    0 0 30px rgba(255,180,50,0.4),
    inset 0 1px 0 rgba(255,255,255,0.25);
  font-size: 14px;
  z-index: 400;
  opacity: 0;
  transform: translateX(80px);
  transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
  max-width: 340px;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.notification.show { opacity: 1; transform: translateX(0); }
.notification b {
  color: #FFE9A8; display: block; margin-bottom: 5px;
  font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
}

.title-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: space-between;
  padding: 8vh 20px 6vh; z-index: 200;
  background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.15) 30%, rgba(0,0,0,0.3) 65%, rgba(0,0,0,0.85) 100%);
}
.title-logo { text-align: center; animation: titleFadeIn 1.3s ease-out; }
@keyframes titleFadeIn {
  from { opacity: 0; transform: translateY(-30px); }
  to   { opacity: 1; transform: translateY(0); }
}
.title-main {
  font-size: clamp(38px, 6vw, 76px);
  color: #FFF8E7;
  text-shadow:
    -3px -3px 0 #8B4513, 3px -3px 0 #8B4513,
    -3px 3px 0 #8B4513, 3px 3px 0 #8B4513,
     0 0 40px rgba(255, 220, 100, 1),
     0 0 80px rgba(255, 180, 50, 0.7),
     6px 6px 30px rgba(0, 0, 0, 0.9);
  letter-spacing: 8px; margin: 0; font-weight: bold;
  animation: titleGlow 3.6s ease-in-out infinite;
}
@keyframes titleGlow {
  0%,100% {
    text-shadow:
      -3px -3px 0 #8B4513, 3px -3px 0 #8B4513,
      -3px 3px 0 #8B4513, 3px 3px 0 #8B4513,
      0 0 40px rgba(255,220,100,1),
      0 0 80px rgba(255,180,50,0.7),
      6px 6px 30px rgba(0,0,0,0.9);
  }
  50% {
    text-shadow:
      -3px -3px 0 #8B4513, 3px -3px 0 #8B4513,
      -3px 3px 0 #8B4513, 3px 3px 0 #8B4513,
      0 0 65px rgba(255,240,150,1),
      0 0 120px rgba(255,200,80,0.9),
      6px 6px 30px rgba(0,0,0,0.9);
  }
}
.title-sub {
  font-size: clamp(14px, 1.2vw, 19px);
  color: #FFF3C4;
  text-shadow: 2px 2px 0 #8B4513, 3px 3px 8px rgba(0,0,0,0.95);
  font-style: italic; margin-top: 14px; letter-spacing: 6px;
  text-transform: uppercase;
}
.title-menu {
  display: flex; flex-direction: column; gap: 14px;
  width: min(340px, 80vw);
  animation: titleFadeIn 1s ease-out 0.4s backwards;
}
.title-menu button {
  display: block;
  background: linear-gradient(180deg, rgba(28,22,14,0.9) 0%, rgba(14,10,6,0.95) 100%);
  color: #FFE9A8;
  padding: 15px 26px;
  border-radius: 4px;
  border: 1px solid rgba(244,197,66,0.6);
  cursor: pointer;
  font-size: clamp(13px, 1.05vw, 16px);
  font-weight: bold; font-family: inherit; text-align: center;
  letter-spacing: 2.5px; text-transform: uppercase;
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 8px 24px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);

.cutscene-layer {
  position: fixed; inset: 0;
  z-index: 95;
  background: #000;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.7s ease, visibility 0.7s ease;
  overflow: hidden;
  cursor: pointer;
}
.cutscene-layer.active { opacity: 1; visibility: visible; }
.cutscene-frame {
  position: absolute; inset: 0;
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
  background-color: #000;
  opacity: 0;
  transform: scale(1);
  transition: opacity 0.9s ease, transform 9s ease-out;
  will-change: opacity, transform;
}
.cutscene-frame.current { opacity: 1; z-index: 1; }
.cutscene-frame.next    { opacity: 0; z-index: 2; }
.cutscene-frame.visible { opacity: 1; }
.cutscene-frame.effect-fade.next { opacity: 0; transition: opacity 1s ease; }
.cutscene-frame.effect-fade.next.visible { opacity: 1; }
.cutscene-frame.effect-zoom-in.next.visible { transform: scale(1.08); }
.cutscene-frame.effect-zoom-out.next.visible { transform: scale(0.94); }
.cutscene-frame.effect-slide-left.next {
  transform: translateX(100%);
  transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
}
.cutscene-frame.effect-slide-left.next.visible { transform: translateX(0); }
.cutscene-frame.effect-slide-right.next {
  transform: translateX(-100%);
  transition: transform 1s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
}
.cutscene-frame.effect-slide-right.next.visible { transform: translateX(0); }
.cutscene-layer::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(0,0,0,0.75) 100%);
  pointer-events: none; z-index: 3;
}
.cutscene-progress {
  position: absolute;
  left: 0; bottom: 0;
  height: 4px; width: 0%;
  background: linear-gradient(90deg, #FBBF24, #F59E0B, #FBBF24);
  background-size: 200% 100%;
  box-shadow: 0 0 16px rgba(255,200,100,0.9);
  z-index: 4;
  transition: width 0.2s linear;
  animation: progressShine 2s linear infinite;
}
@keyframes progressShine {
  from { background-position: 200% 0; }
  to   { background-position: -200% 0; }
}
.cutscene-controls {
  position: absolute;
  top: 24px; right: 24px;
  display: flex; gap: 12px;
  z-index: 5;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.cutscene-layer.active .cutscene-controls { opacity: 1; }
.cs-btn {
  padding: 11px 22px;

.cutscene-caption {

const SAVE_KEY          = 'pesn_augusta_save';
const PROGRESS_KEY      = 'pesn_augusta_progress';
const ENDINGS_KEY       = 'pesn_augusta_endings';
const ACHIEVEMENTS_KEY  = 'pesn_augusta_achievements';
const SETTINGS_KEY      = 'pesn_augusta_settings';

const gameState = {
  currentPassage: 'title',
  history: [], historyIndex: -1,
  variables: {}, endings: {}, achievements: {},
  progress: {
    passages: {}, cutscenes: {}, choices: {}, locations: {},
    journal: [], playCount: 0, totalPlayTime: 0, lastPassage: null
  },
  settings: { textSpeed: 40, musicVolume: 0.6, typewriter: 'on', sfx: 'on' },
  isTyping: false, typewriterTimer: null, isSwitching: false,
  sessionStart: Date.now()
};

function createEmptyProgress() {
  return { passages: {}, cutscenes: {}, choices: {}, locations: {}, journal: [], playCount: 0, totalPlayTime: 0, lastPassage: null };
}
function loadProgress() {
  try {
    const raw = localStorage.getItem(PROGRESS_KEY);
    if (!raw) return createEmptyProgress();
    return Object.assign(createEmptyProgress(), JSON.parse(raw));
  } catch (e) { return createEmptyProgress(); }
}
function saveProgress() {
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(gameState.progress)); return true; }
  catch (e) { return false; }
}
function markPassageVisited(id) {
  if (!gameState.progress.passages[id]) {
    gameState.progress.passages[id] = true;
    gameState.progress.lastPassage = id;
    saveProgress();
  }
}
function markCutsceneWatched(key) {
  if (!gameState.progress.cutscenes[key]) {
    gameState.progress.cutscenes[key] = true;
    saveProgress();
  }
}
function markLocationVisited(key) {
  if (key && !gameState.progress.locations[key]) {
    gameState.progress.locations[key] = true;
    saveProgress();
  }
}
function markChoice(id, to) { gameState.progress.choices[id] = to; saveProgress(); }
function isPassageVisited(id) { return !!gameState.progress.passages[id]; }
function isCutsceneWatched(key) { return !!gameState.progress.cutscenes[key]; }
function countVisitedPassages() { return Object.keys(gameState.progress.passages).length; }
function countTotalPassages() { return Object.keys(PASSAGES).filter(k => !PASSAGES[k].isTitle).length; }
function countWatchedCutscenes() { return Object.keys(gameState.progress.cutscenes).length; }
function countVisitedLocations() { return Object.keys(gameState.progress.locations).length; }
function getCompletionPercent() {
  const total = countTotalPassages();
  return total === 0 ? 0 : Math.round((countVisitedPassages() / total) * 100);
}
function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      version: 13, timestamp: Date.now(),
      currentPassage: gameState.currentPassage,
      history: gameState.history, historyIndex: gameState.historyIndex,
      variables: gameState.variables,
      endings: gameState.endings,
      achievements: gameState.achievements
    }));
    saveProgress();
    return true;
  } catch (e) { return false; }
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || !s.currentPassage) return false;
    gameState.currentPassage = s.currentPassage;
    gameState.history = s.history || [];
    gameState.historyIndex = (typeof s.historyIndex === 'number') ? s.historyIndex : gameState.history.length - 1;
    gameState.variables = s.variables || {};
    gameState.endings = Object.assign({}, gameState.endings, s.endings || {});
    gameState.achievements = Object.assign({}, gameState.achievements, s.achievements || {});
    return true;
  } catch (e) { return false; }
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function loadEndingsFromStorage() {
  try { const s = localStorage.getItem(ENDINGS_KEY); if (s) gameState.endings = Object.assign({}, JSON.parse(s), gameState.endings); } catch (e) {}
}
function saveEndingsToStorage() {
  try { localStorage.setItem(ENDINGS_KEY, JSON.stringify(gameState.endings)); } catch (e) {}
}
function countEndings() { return ['harmony','mastery','science','unity'].filter(k => gameState.endings[k]).length; }
function loadAchievementsFromStorage() {
  try { const s = localStorage.getItem(ACHIEVEMENTS_KEY); if (s) gameState.achievements = Object.assign({}, JSON.parse(s), gameState.achievements); } catch (e) {}
}
function saveAchievementsToStorage() {
  try { localStorage.setItem(ACHIEVEMENTS_KEY, JSON.stringify(gameState.achievements)); } catch (e) {}
}
function unlockAchievement(key) {
  if (gameState.achievements[key]) return;
  gameState.achievements[key] = true;
  saveAchievementsToStorage();
  const a = ACHIEVEMENTS[key];
  if (a) { showNotification('🏆 Достижение', `${a.icon} ${a.title}`); playSfx('achievement'); }
}
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(gameState.settings)); } catch (e) {} }
function loadSettings() {
  try { const s = localStorage.getItem(SETTINGS_KEY); if (s) Object.assign(gameState.settings, JSON.parse(s)); } catch (e) {}
}
function resetProgress() {
  gameState.progress = createEmptyProgress();
  gameState.endings = {};
  gameState.achievements = {};
  gameState.variables = {};
  gameState.history = [];
  gameState.historyIndex = -1;
  try {
    localStorage.removeItem(PROGRESS_KEY);
    localStorage.removeItem(ENDINGS_KEY);
    localStorage.removeItem(ACHIEVEMENTS_KEY);
    localStorage.removeItem(SAVE_KEY);
  } catch (e) {}
}
function resetPassagesOnly() {
  gameState.progress.passages = {};
  gameState.progress.choices = {};
  gameState.progress.locations = {};
  gameState.progress.cutscenes = {};
  saveProgress();
}

const bgMusic = document.getElementById('bgMusic');
let musicStarted = false;

function playSfx(type) {
  if (gameState.settings.sfx !== 'on') return;
  const src = SFX_MAP[type];
  if (!src) return;
  if (!sfxCache[type]) {
    const a = new Audio(src);
    a.preload = 'auto'; a.volume = SFX_VOLUME;
    a.onerror = () => console.warn('SFX не найден:', src);
    sfxCache[type] = a;
  }
  const s = sfxCache[type].cloneNode();
  s.volume = SFX_VOLUME;
  s.play().catch(() => {});
}
function startMusic() {
  if (musicStarted || !bgMusic) return;
  bgMusic.volume = gameState.settings.musicVolume;
  const p = bgMusic.play();
  if (p && p.catch) {
    p.then(() => { musicStarted = true; }).catch(() => {
      const kick = () => {
        bgMusic.play().then(() => {
          musicStarted = true;
          document.removeEventListener('click', kick);
          document.removeEventListener('keydown', kick);
        }).catch(() => {});
      };
      document.addEventListener('click', kick);
      document.addEventListener('keydown', kick);
    });
  } else { musicStarted = true; }
}
function setMusicVolume(v) {
  gameState.settings.musicVolume = v;
  if (bgMusic) bgMusic.volume = v;
}

/* ============================================================
   ПЕЧАТАЮЩИЙСЯ ТЕКСТ
   ============================================================ */
function typeText(element, html, speed, callback) {
  const tokens = [];
  let i = 0;
  while (i < html.length) {
    if (html[i] === '<') {
      const end = html.indexOf('>', i);
      if (end === -1) { tokens.push(html[i]); i++; continue; }
      tokens.push(html.slice(i, end + 1));
      i = end + 1;
    } else { tokens.push(html[i]); i++; }
  }
  element.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'type-cursor';
  cursor.textContent = '▍';
  element.appendChild(cursor);

  let idx = 0;
  function step() {
    if (idx >= tokens.length) {
      cursor.remove();
      element.innerHTML = html;
      gameState.isTyping = false;
      if (callback) callback();
      return;
    }
    const t = tokens[idx++];
    cursor.insertAdjacentHTML('beforebegin', t);
    if (t.startsWith('<')) step();
    else gameState.typewriterTimer = setTimeout(step, speed);
  }
  step();
}

const CutscenePlayer = {
  current: null, frameIndex: 0, timer: null, paused: false, onFinish: null,

  play(sceneKey, onFinish) {
    const scene = CUTSCENES[sceneKey];
    if (!scene || !scene.frames || scene.frames.length === 0) {
      if (onFinish) onFinish();
      return;
    }
    this.current = scene;
    this.frameIndex = 0;
    this.paused = false;
    this.onFinish = onFinish;
    markCutsceneWatched(sceneKey);

    const layer = document.getElementById('cutsceneLayer');
    document.body.classList.add('cutscene-active');
    layer.classList.add('active');

    scene.frames.forEach(f => { const img = new Image(); img.src = f.img; });

    const firstFrame = scene.frames[0];
    const currentEl = document.getElementById('csFrameCurrent');
    const nextEl = document.getElementById('csFrameNext');
    currentEl.style.backgroundImage = `url("${firstFrame.img}")`;
    currentEl.className = 'cutscene-frame current';
    nextEl.className = 'cutscene-frame next';
    nextEl.style.backgroundImage = '';
    nextEl.style.transform = '';

    const progress = document.getElementById('csProgress');
    progress.style.transition = 'none';
    progress.style.width = '0%';

    setTimeout(() => this.showFrame(1), firstFrame.duration);
  },

  showFrame(index) {
    if (!this.current || index >= this.current.frames.length) { this.finish(); return; }
    this.frameIndex = index;
    const frame = this.current.frames[index];
    const currentEl = document.getElementById('csFrameCurrent');
    const nextEl    = document.getElementById('csFrameNext');
    const effect = frame.effect || 'fade';

    nextEl.className = 'cutscene-frame next effect-' + effect;
    nextEl.style.backgroundImage = `url("${frame.img}")`;
    nextEl.style.transform = '';

    requestAnimationFrame(() => {
      requestAnimationFrame(() => { nextEl.classList.add('visible'); });
    });

    let captionEl = document.querySelector('.cutscene-caption');
    if (captionEl) captionEl.remove();
    if (frame.text) {
      captionEl = document.createElement('div');
      captionEl.className = 'cutscene-caption';
      captionEl.textContent = frame.text;
      document.getElementById('cutsceneLayer').appendChild(captionEl);
    }

    if (frame.sfx) playSfx(frame.sfx);

    const progress = document.getElementById('csProgress');
    progress.style.transition = 'none';
    const basePercent = (index / this.current.frames.length) * 100;
    const targetPercent = ((index + 1) / this.current.frames.length) * 100;
    progress.style.width = basePercent + '%';
    requestAnimationFrame(() => {
      progress.style.transition = `width ${frame.duration}ms linear`;
      progress.style.width = targetPercent + '%';
    });

    this.clearTimer();
    this.timer = setTimeout(() => {
      currentEl.className = 'cutscene-frame current';
      currentEl.style.backgroundImage = `url("${frame.img}")`;
      nextEl.className = 'cutscene-frame next';
      nextEl.style.backgroundImage = '';
      nextEl.style.transform = '';
      this.showFrame(index + 1);
    }, frame.duration);
  },

  togglePause() {
    if (!this.current) return;
    if (this.paused) {
      this.paused = false;
      document.getElementById('csPause').textContent = '⏸';
      this.showFrame(this.frameIndex);
    } else {
      this.paused = true;
      document.getElementById('csPause').textContent = '▶';
      this.clearTimer();
    }
  },
  skip() { this.finish(); },
  finish() {
    this.clearTimer();
    const layer = document.getElementById('cutsceneLayer');
    layer.classList.remove('active');
    document.body.classList.remove('cutscene-active');
    const cap = document.querySelector('.cutscene-caption');
    if (cap) cap.remove();
    const cb = this.onFinish;
    this.current = null; this.onFinish = null;
    setTimeout(() => {
      document.getElementById('csFrameCurrent').style.backgroundImage = '';
      document.getElementById('csFrameNext').style.backgroundImage = '';
      if (cb) cb();
    }, 700);
  },
  clearTimer() { if (this.timer) { clearTimeout(this.timer); this.timer = null; } }
};

document.addEventListener('click', (e) => {
  if (e.target.id === 'csSkip') { e.stopPropagation(); CutscenePlayer.skip(); return; }
  if (e.target.id === 'csPause') { e.stopPropagation(); CutscenePlayer.togglePause(); return; }
  const layer = document.getElementById('cutsceneLayer');
  if (!layer.classList.contains('active')) return;
  if (e.target.closest('.cs-btn')) return;
  if (CutscenePlayer.paused) return;
  if (CutscenePlayer.current) {
    CutscenePlayer.clearTimer();
    CutscenePlayer.showFrame(CutscenePlayer.frameIndex + 1);
  }
});
document.addEventListener('keydown', (e) => {
  const layer = document.getElementById('cutsceneLayer');
  if (!layer.classList.contains('active')) return;
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (CutscenePlayer.paused) return;
    CutscenePlayer.clearTimer();
    CutscenePlayer.showFrame(CutscenePlayer.frameIndex + 1);
  }
  if (e.key === 'Escape') { e.preventDefault(); CutscenePlayer.skip(); }
});

/* ============================================================
   ПЕРЕХОДЫ
   ============================================================ */
function advance() {
  if (gameState.isSwitching) return;
  const passage = PASSAGES[gameState.currentPassage];
  if (!passage || passage.isTitle) return;

  if (gameState.isTyping) {
    if (gameState.typewriterTimer) { clearTimeout(gameState.typewriterTimer); gameState.typewriterTimer = null; }
    const textEl = document.getElementById('dialogueText');
    if (textEl) textEl.innerHTML = passage.text || '';
    gameState.isTyping = false;
    return;
  }
  if (passage.choices && passage.choices.length > 0) return;
  if (passage.next) {
    const to = passage.next;
    if (to === 'title') {
      gameState.history = []; gameState.historyIndex = -1;
      renderPassage('title', false);
    } else {
      renderPassage(to);
    }
  }
}

/* === УДАЛЕНИЕ ТИТУЛЬНИКА И СТАРОГО КОНТЕНТА === */
function clearTitleElements() {
  document.querySelectorAll('.title-screen, .title-endings').forEach(el => el.remove());
}
function clearDialogueElements() {
  document.querySelectorAll('.dialogue-box, .choice-box, .game-menu').forEach(el => el.remove());
}

function renderPassage(id, addToHistory = true) {
  const passage = PASSAGES[id];
  if (!passage) { console.error('Пассаж не найден:', id); return; }

  if (gameState.typewriterTimer) { clearTimeout(gameState.typewriterTimer); gameState.typewriterTimer = null; }
  gameState.isTyping = false;
  gameState.currentPassage = id;

  if (passage.isTitle) { renderTitleScreen(); return; }

  clearTitleElements();

  if (passage.set) {
    Object.assign(gameState.variables, passage.set);
    const itemAch = {
      has_feather: 'feather', has_crystal: 'crystal', has_pollen: 'pollen',
      has_selesta_vial: 'vial', has_key: 'key', has_secret_door: 'secret',
      has_scheme: 'scheme'
    };
    for (const [k, a] of Object.entries(itemAch)) {
      if (passage.set[k]) unlockAchievement(a);
    }
  }
  if (passage.ending) {
    gameState.endings[passage.ending] = true;
    saveEndingsToStorage();
    if (countEndings() >= 4) unlockAchievement('allEndings');
  }
  if (addToHistory) {
    gameState.history = gameState.history.slice(0, gameState.historyIndex + 1);
    gameState.history.push(id);
    gameState.historyIndex = gameState.history.length - 1;
  }
  markPassageVisited(id);
  if (passage.location) markLocationVisited(passage.location);

  if (passage.cutscene) {
    const ga = document.getElementById('gameArea');
    if (ga) ga.style.opacity = '0';
    CutscenePlayer.play(passage.cutscene, () => {
      if (ga) ga.style.opacity = '1';
      renderPassageInner(id, passage);
    });
    return;
  }
  renderPassageInner(id, passage);
}

function renderPassageInner(id, passage) {
  clearTitleElements();
  clearDialogueElements();

  setBackground(passage.location);

  if (passage.insert) {
    showInsert(passage.insert, passage.insertDuration || 2200);
  }

  let navHTML = '';
  if (passage.choices && passage.choices.length > 0) {
    navHTML = '<div class="choice-box">' + passage.choices.map(c =>
      `<a data-to="${c.to}"><span>${c.text}</span></a>`
    ).join('') + '</div>';
  }

  const gameMenuHTML = `
    <div class="game-menu">
      <button id="btnJournal" title="Журнал">📖</button>
      <button id="btnSave" title="Сохранить игру">💾</button>
      <button id="btnMenu" title="В главное меню">🏠</button>
    </div>
  `;

  const boxClass = passage.boxClass || 'narrator';
  const speaker = passage.speaker || '';

  const boxHTML = `
    <div class="dialogue-box ${boxClass}">
      <div class="top-line"></div>
      ${speaker ? `<div class="speaker-name">${speaker}</div>` : ''}
      <div class="dialogue-text" id="dialogueText"></div>
      ${(!passage.choices || passage.choices.length === 0) && passage.next ? '<div class="next-hint">▼</div>' : ''}
    </div>
  `;

  const gameArea = document.getElementById('gameArea');
  gameArea.style.opacity = '1';
  gameArea.innerHTML = boxHTML + navHTML + gameMenuHTML;

  const currentPassageId = id;

  gameArea.querySelectorAll('[data-to]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      playSfx('choice');
      const to = btn.dataset.to;
      markChoice(currentPassageId, to);
      saveGame();
      if (to === 'title') {
        gameState.history = []; gameState.historyIndex = -1;
        renderPassage('title', false);
      } else {
        renderPassage(to);
      }
    });
  });

  const dialogueBox = gameArea.querySelector('.dialogue-box');
  if (dialogueBox) {
    dialogueBox.addEventListener('click', (e) => {
      if (e.target.closest('[data-to]')) return;
      if (e.target.closest('.game-menu')) return;
      if (e.target.closest('.history-controls')) return;
      e.stopPropagation();
      playSfx('click');
      advance();
    });
  }

  const saveBtn = document.getElementById('btnSave');
  if (saveBtn) saveBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (saveGame()) {
      saveBtn.textContent = '✅';
      showNotification('💾 Сохранено', 'Игра успешно сохранена');
      setTimeout(() => { saveBtn.textContent = '💾'; }, 1000);
    } else {
      showNotification('⚠ Ошибка', 'Не удалось сохранить игру');
    }
  });

  const menuBtn = document.getElementById('btnMenu');
  if (menuBtn) menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (confirm('Вернуться в главное меню? Несохранённый прогресс будет потерян.')) {
      gameState.history = []; gameState.historyIndex = -1;
      renderPassage('title', false);
    }
  });

  const journalBtn = document.getElementById('btnJournal');
  if (journalBtn) journalBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    openJournal();
  });

  updateHistoryButtons();

  const textEl = document.getElementById('dialogueText');
  const text = passage.text || '';

  if (gameState.settings.typewriter === 'on') {
    gameState.isTyping = true;
    typeText(textEl, text, gameState.settings.textSpeed, () => { gameState.isTyping = false; });
  } else {
    textEl.innerHTML = text;
  }

  const clickLayer = document.getElementById('clickLayer');
  if (clickLayer) {
    if (passage.choices && passage.choices.length > 0) {
      clickLayer.classList.remove('enabled');
    } else {
      clickLayer.classList.add('enabled');
    }
  }
}

    if (loadGame()) {
      clearTitleElements();
      renderPassage(gameState.currentPassage, false);
    } else {
      showNotification('⚠ Ошибка', 'Сохранение не найдено');
    }
  });
  document.getElementById('btnProgress').addEventListener('click', openProgress);
  document.getElementById('btnGallery').addEventListener('click', openGallery);
  document.getElementById('btnAchievements').addEventListener('click', openAchievements);
  document.getElementById('btnSettings').addEventListener('click', openSettings);
  document.getElementById('btnResetEndings').addEventListener('click', () => {
    if (confirm('Сбросить весь прогресс: концовки, достижения и открытые пассажи?')) {
      resetProgress();
      renderTitleScreen();
    }
  });
  updateHistoryButtons();

function updateHistoryButtons() {
  const back = document.getElementById('btnBack');
  const fwd = document.getElementById('btnForward');
  const controls = document.getElementById('historyControls');
  if (gameState.currentPassage === 'title') { controls.style.display = 'none'; return; }
  controls.style.display = 'flex';
  back.disabled = gameState.historyIndex <= 0;
  fwd.disabled = gameState.historyIndex >= gameState.history.length - 1;
}
function goBack() {
  if (gameState.isSwitching) return;
  if (gameState.historyIndex <= 0) return;
  gameState.historyIndex--;
  renderPassage(gameState.history[gameState.historyIndex], false);
}
function goForward() {
  if (gameState.isSwitching) return;
  if (gameState.historyIndex >= gameState.history.length - 1) return;
  gameState.historyIndex++;
  renderPassage(gameState.history[gameState.historyIndex], false);
}

function openGallery() {
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  const allCutscenes = Object.keys(CUTSCENES);
  const cardsHTML = allCutscenes.map(key => {
    const watched = isCutsceneWatched(key);

    const thumb = watched && scene.frames[0] ? scene.frames[0].img : '';
    const title = key.replace(/_/g, ' ');
    return `
      <div class="gallery-card ${watched ? '' : 'locked'}"
           data-key="${key}"
           style="background-image:${thumb ? `url('${thumb}')` : 'none'};">
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,0.85) 100%);"></div>
        <div style="position:absolute;bottom:0;left:0;right:0;padding:8px 10px;color:${watched ? '#FFD700' : '#888'};font-size:12px;font-weight:bold;text-shadow:1px 1px 3px rgba(0,0,0,0.9);">
          ${watched ? '▶ ' : '🔒 '} ${title}

      </div>
    `;
  }).join('');

  content.innerHTML = `
    <h2>🖼 Галерея сцен</h2>
    <p style="color:#888;font-size:12px;margin-bottom:16px;">
      Просмотрено: <b style="color:#FBBF24;">${countWatchedCutscenes()} / ${allCutscenes.length}</b>
    </p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">${cardsHTML}</div>
    <div class="buttons"><button id="galClose">Закрыть</button></div>
  `;
  overlay.classList.remove('hidden');

  content.querySelectorAll('.gallery-card:not(.locked)').forEach(card => {
    card.addEventListener('click', () => {

}

let playTimeInterval = null;

function init() {
  loadEndingsFromStorage();
  loadAchievementsFromStorage();
  loadSettings();
  gameState.progress = loadProgress();
  gameState.progress.playCount = (gameState.progress.playCount || 0) + 1;
  saveProgress();

  if (bgMusic) bgMusic.volume = gameState.settings.musicVolume;
  startMusic();

  initParticles();

  if (playTimeInterval) clearInterval(playTimeInterval);
  playTimeInterval = setInterval(() => {
    gameState.progress.totalPlayTime = (gameState.progress.totalPlayTime || 0) + 1;
    if (gameState.progress.totalPlayTime % 30 === 0) saveProgress();
  }, 1000);

  window.addEventListener('beforeunload', () => {
    saveProgress();
    if (gameState.currentPassage && gameState.currentPassage !== 'title') saveGame();
  });

  document.getElementById('btnBack').addEventListener('click', goBack);
  document.getElementById('btnForward').addEventListener('click', goForward);

  const clickLayerEl = document.getElementById('clickLayer');
  if (clickLayerEl) clickLayerEl.addEventListener('click', advance);

  document.addEventListener('keydown', ev => {
    const tag = (ev.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (ev.ctrlKey || ev.altKey || ev.metaKey) return;
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); goBack(); }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); goForward(); }
    else if (ev.key === ' ' || ev.key === 'Enter') {
      const layer = document.getElementById('cutsceneLayer');
      if (layer.classList.contains('active')) return;
      ev.preventDefault();
      playSfx('click');
      advance();
    }
    else if (ev.key === 'Escape') {
      const overlay = document.getElementById('modalOverlay');
      if (!overlay.classList.contains('hidden')) overlay.classList.add('hidden');
    }
  });

  document.getElementById('modalOverlay').addEventListener('click', ev => {
    if (ev.target.id === 'modalOverlay') ev.target.classList.add('hidden');
  });

  setTimeout(() => {
    const loading = document.getElementById('loadingScreen');
    if (loading) loading.classList.add('hidden');
  }, 700);

  renderPassage('title', false);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
