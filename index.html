<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Песнь Августа</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
/* ============================================
   БАЗОВЫЕ СТИЛИ
   ============================================ */
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: 'Georgia', 'Times New Roman', serif;
  background: #0a0a14; color: #eee;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ===== ФОН ===== */
.bg-layer {
  position: fixed; inset: 0;
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-color: #0a0a14;
  z-index: 1; pointer-events: none;
  opacity: 1;
  transition: opacity 0.4s ease-in-out;
  will-change: opacity;
}
.vignette-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 2;
  background:
    radial-gradient(ellipse at 50% 40%, transparent 45%, rgba(0,0,0,0.6) 100%),
    linear-gradient(180deg, rgba(0,0,0,0.35) 0%, transparent 22%, transparent 70%, rgba(0,0,0,0.55) 100%);
}

/* ===== ЭКРАН ЗАГРУЗКИ ===== */
.loading-screen {
  position: fixed; inset: 0; z-index: 5000;
  background: radial-gradient(ellipse at center, #14101e 0%, #0a0a14 100%);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 24px;
  transition: opacity 0.6s ease;
}
.loading-screen.hidden { opacity: 0; pointer-events: none; }
.loading-spinner {
  width: 64px; height: 64px;
  border: 4px solid rgba(251,191,36,0.15);
  border-top-color: #FBBF24;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  box-shadow: 0 0 30px rgba(251,191,36,0.3);
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  color: #FBBF24; font-size: 16px;
  letter-spacing: 4px; text-transform: uppercase;
  animation: pulse 1.6s ease-in-out infinite;
  text-shadow: 0 0 12px rgba(251,191,36,0.6);
}
@keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

/* ===== СПРАЙТЫ ===== */
.sprite-stage {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 50; overflow: hidden;
}
.sprite {
  position: absolute;
  bottom: 30vh; left: 50%;
  height: 72vh;
  max-height: 880px; min-height: 280px;
  width: auto; max-width: 42vw;
  object-fit: contain;
  pointer-events: none;
  transform-origin: 50% 100%;
  transition:
    transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
    filter 0.45s ease-out,
    opacity 0.45s ease-out,
    left 0.6s ease-out,
    right 0.6s ease-out;
  filter: drop-shadow(0 14px 28px rgba(0,0,0,0.65)) contrast(1.05) brightness(1.02);
  opacity: 1;
  will-change: transform, filter, opacity;
  --tx: -50%; --sc: 1;
}
.sprite.pos-solo      { left: 50%;   right: auto; --tx: -50%; --sc: 1;    }
.sprite.pos-left      { left: 26%;   right: auto; --tx: -50%; --sc: 0.96; }
.sprite.pos-far-left  { left: 15%;   right: auto; --tx: -50%; --sc: 0.86; }
.sprite.pos-center    { left: 50%;   right: auto; --tx: -50%; --sc: 1;    }
.sprite.pos-right     { right: 26%;  left: auto;  --tx:  50%; --sc: 0.96; }
.sprite.pos-far-right { right: 15%;  left: auto;  --tx:  50%; --sc: 0.86; }
.sprite { transform: translateX(var(--tx)) scale(var(--sc)); }
.sprite.active {
  opacity: 1;
  filter:
    drop-shadow(0 0 26px rgba(255,220,110,0.85))
    drop-shadow(0 0 60px rgba(255,180,50,0.45))
    brightness(1.12) saturate(1.15);
  z-index: 10;
  animation: spriteJump 0.65s cubic-bezier(0.22, 1, 0.36, 1);
}
.sprite.inactive {
  opacity: 0.9;
  filter:
    drop-shadow(0 10px 20px rgba(0,0,0,0.7))
    brightness(0.72) saturate(0.75);
  z-index: 5;
}
.sprite.entering {
  opacity: 0;
  transform: translateX(var(--tx)) translateY(40px) scale(calc(var(--sc) * 0.98));
}
.sprite.entered {
  opacity: 1;
  transform: translateX(var(--tx)) translateY(0) scale(var(--sc));
}
.sprite.leaving {
  opacity: 0;
  transform: translateX(var(--tx)) translateY(40px) scale(calc(var(--sc) * 0.98));
  transition: all 0.45s ease-in;
}
@keyframes spriteJump {
  0%   { transform: translateX(var(--tx)) translateY(0)     scale(var(--sc)); }
  30%  { transform: translateX(var(--tx)) translateY(-18px) scale(calc(var(--sc) * 1.045)); }
  55%  { transform: translateX(var(--tx)) translateY(-7px)  scale(calc(var(--sc) * 1.02)); }
  78%  { transform: translateX(var(--tx)) translateY(-2px)  scale(var(--sc)); }
  100% { transform: translateX(var(--tx)) translateY(0)     scale(var(--sc)); }
}

/* ===== CLICK LAYER ===== */
.click-layer {
  position: fixed; inset: 0; z-index: 90;
  background: transparent; cursor: pointer; display: none;
}
.click-layer.enabled { display: block; }

/* ===== ДИАЛОГ ===== */
.dialogue-box {
  position: fixed; left: 50%; bottom: 2.5vh;
  transform: translateX(-50%);
  width: min(1180px, 94vw);
  max-height: 34vh;
  background: linear-gradient(180deg, rgba(26,20,12,0.94) 0%, rgba(12,9,6,0.97) 100%);
  border: 2px solid rgba(244,197,66,0.85);
  border-radius: 14px;
  box-shadow:
    0 -30px 60px rgba(0,0,0,0.55),
    0 22px 60px rgba(0,0,0,0.7),
    0 0 0 1px rgba(0,0,0,0.6),
    inset 0 1px 0 rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 100;
  display: flex; flex-direction: column;
  animation: dialogueIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  overflow: visible;
  cursor: pointer;
}
.dialogue-box::before {
  content: '';
  position: absolute;
  top: 0; left: 20%; right: 20%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,220,120,0.7), transparent);
  border-radius: 14px 14px 0 0;
  pointer-events: none;
}
@keyframes dialogueIn {
  from { opacity: 0; transform: translateX(-50%) translateY(24px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.speaker-name {
  position: absolute; top: -1.9vh; left: 3.5vw;
  min-width: 160px; max-width: 320px;
  padding: 0.9vh 2.2vw;
  background: linear-gradient(180deg, rgba(217,119,6,0.98) 0%, rgba(180,83,9,0.98) 100%);
  color: #FFF8E7;
  font-size: clamp(14px, 1.25vw, 19px);
  font-weight: bold;
  border-radius: 8px 8px 4px 4px;
  border: 2px solid rgba(244,197,66,0.9);
  box-shadow: 0 8px 22px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.25);
  text-shadow: 1px 1px 3px rgba(0,0,0,0.75);
  letter-spacing: 1.4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  z-index: 2;
}
.dialogue-text {
  width: 100%; flex: 1;
  min-height: 12vh; max-height: 26vh;
  color: #f2e9d5;
  font-size: clamp(14px, 1.15vw, 19px);
  line-height: 1.75;
  text-shadow: 0 1px 2px rgba(0,0,0,0.85);
  padding: 3.2vh 3.2vw 2.2vh;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #FBBF24 rgba(255,243,196,0.15);
}
.dialogue-text b { color: #FFE9A8; }
.type-cursor {
  display: inline-block; color: #FFD700;
  animation: cursorBlink 0.8s steps(2, start) infinite;
  font-weight: bold; margin-left: 2px;
  text-shadow: 0 0 8px rgba(255,215,0,0.9);
}
@keyframes cursorBlink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
.next-hint {
  position: absolute; right: 18px; bottom: 10px;
  color: #FFD700;
  font-size: clamp(16px, 1.4vw, 22px);
  opacity: 0.85;
  animation: nextPulse 1.4s ease-in-out infinite;
  pointer-events: none;
  text-shadow: 0 0 10px rgba(255,215,0,0.8);
}
@keyframes nextPulse {
  0%,100% { transform: translateY(0);   opacity: 0.5; }
  50%     { transform: translateY(4px); opacity: 1;   }
}
.dialogue-box.narrator { background: linear-gradient(180deg, rgba(30,25,15,0.94) 0%, rgba(15,12,8,0.97) 100%); border-color: rgba(200,160,80,0.7); }
.dialogue-box.narrator .speaker-name { background: linear-gradient(180deg, rgba(180,130,40,0.98) 0%, rgba(140,100,30,0.98) 100%); }
.dialogue-box.mira { border-color: rgba(230,126,34,0.9); }
.dialogue-box.mira .speaker-name { background: linear-gradient(180deg, rgba(230,126,34,0.98) 0%, rgba(200,100,20,0.98) 100%); }
.dialogue-box.bruno { border-color: rgba(170,170,170,0.85); }
.dialogue-box.bruno .speaker-name { background: linear-gradient(180deg, rgba(120,120,120,0.98) 0%, rgba(80,80,80,0.98) 100%); color: #F5F5F5; }
.dialogue-box.shustik { border-color: rgba(80,200,100,0.9); }
.dialogue-box.shustik .speaker-name { background: linear-gradient(180deg, rgba(60,160,80,0.98) 0%, rgba(40,120,60,0.98) 100%); }
.dialogue-box.selesta { border-color: rgba(160,120,210,0.9); }
.dialogue-box.selesta .speaker-name { background: linear-gradient(180deg, rgba(130,90,180,0.98) 0%, rgba(100,70,140,0.98) 100%); }
.dialogue-box.cornelius { border-color: rgba(80,120,210,0.9); }
.dialogue-box.cornelius .speaker-name { background: linear-gradient(180deg, rgba(60,100,180,0.98) 0%, rgba(40,70,140,0.98) 100%); }
.dialogue-box.august {
  border-color: rgba(255,210,70,1);
  box-shadow:
    0 -30px 60px rgba(0,0,0,0.55),
    0 22px 60px rgba(0,0,0,0.7),
    0 0 45px rgba(255,200,50,0.35),
    inset 0 1px 0 rgba(255,220,100,0.35);
}
.dialogue-box.august .speaker-name { background: linear-gradient(180deg, rgba(255,210,70,1) 0%, rgba(220,160,20,1) 100%); color: #2A1500; }
.dialogue-box.olven { border-style: dashed; border-color: rgba(170,130,70,0.95); }
.dialogue-box.olven .speaker-name { background: linear-gradient(180deg, rgba(150,110,55,0.98) 0%, rgba(110,80,40,0.98) 100%); }
.dialogue-box.final-box {
  border-color: rgba(255,215,0,1);
  box-shadow:
    0 -30px 60px rgba(0,0,0,0.55),
    0 22px 60px rgba(0,0,0,0.7),
    0 0 55px rgba(255,215,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.1);
}
.dialogue-box.final-box .speaker-name { background: linear-gradient(180deg, rgba(255,215,0,1) 0%, rgba(200,150,20,1) 100%); color: #2A1500; }

/* ===== ВЫБОР ===== */
.choice-box {
  position: fixed; left: 50%; bottom: 40vh;
  transform: translateX(-50%); z-index: 101;
  display: flex; flex-direction: column; gap: 12px;
  width: min(720px, 86vw);
  animation: choicesIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.15s backwards;
}
@keyframes choicesIn {
  from { opacity: 0; transform: translateX(-50%) translateY(18px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.choice-box a {
  position: relative;
  width: 100%; display: block; text-align: center;
  padding: 14px 22px;
  background: linear-gradient(180deg, rgba(251,191,36,0.95) 0%, rgba(217,119,6,0.95) 100%);
  color: #2A1500;
  border: 2px solid rgba(120,53,15,0.9);
  border-radius: 10px;
  text-decoration: none;
  font-size: clamp(13px, 1.05vw, 16px);
  font-weight: bold; line-height: 1.35;
  cursor: pointer;
  transition: all 0.25s ease;
  box-shadow: 0 8px 22px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.35);
  letter-spacing: 0.4px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.choice-box a::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 0; height: 0;
  background: rgba(255,255,255,0.35);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: width 0.5s ease, height 0.5s ease;
  pointer-events: none;
}
.choice-box a:hover::after { width: 400px; height: 400px; }
.choice-box a > span { position: relative; z-index: 1; }
.choice-box a:hover {
  background: linear-gradient(180deg, rgba(252,211,77,1) 0%, rgba(245,158,11,1) 100%);
  color: #1a0d00;
  transform: translateY(-2px) scale(1.015);
  box-shadow: 0 14px 34px rgba(255,200,100,0.6), inset 0 1px 0 rgba(255,255,255,0.4);
}
.choice-box a:active { transform: translateY(0) scale(0.995); }

/* ===== ИСТОРИЯ ===== */
.history-controls {
  position: fixed; top: 15px; left: 15px;
  display: flex; gap: 10px; z-index: 300;
  pointer-events: auto;
}
.history-btn {
  width: 48px; height: 48px;
  border-radius: 50%;
  border: 2px solid rgba(180,83,9,0.95);
  background: linear-gradient(180deg, rgba(251,191,36,0.95) 0%, rgba(217,119,6,0.95) 100%);
  color: #2A1500;
  font-size: 20px; font-weight: bold;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.25s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  user-select: none;
  font-family: 'Georgia', serif;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
.history-btn:hover:not(:disabled) { transform: translateY(-2px) scale(1.08); box-shadow: 0 8px 25px rgba(255,200,100,0.7); }
.history-btn:disabled { opacity: 0.35; cursor: not-allowed; filter: grayscale(0.7); }

/* ===== ИГРОВОЕ МЕНЮ ===== */
.game-menu {
  position: fixed; top: 15px; right: 15px;
  display: flex; gap: 10px; z-index: 300;
}
.game-menu button {
  position: relative;
  width: 48px; height: 48px;
  border-radius: 50%;
  border: 2px solid rgba(180,83,9,0.95);
  background: linear-gradient(180deg, rgba(251,191,36,0.95) 0%, rgba(217,119,6,0.95) 100%);
  color: #2A1500;
  font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.25s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  padding: 0;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.game-menu button::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(255,255,255,0.4), transparent 70%);
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}
.game-menu button:hover::before { opacity: 1; }
.game-menu button:hover { transform: translateY(-2px) scale(1.08); box-shadow: 0 8px 25px rgba(255,200,100,0.7); }

/* ===== УВЕДОМЛЕНИЯ ===== */
.notification {
  position: fixed; top: 80px; right: 20px;
  background: linear-gradient(180deg, rgba(217,119,6,0.98) 0%, rgba(180,83,9,0.98) 100%);
  color: #FFF8E7;
  padding: 14px 22px 14px 26px;
  border: 2px solid rgba(244,197,66,0.9);
  border-left: 5px solid #FBBF24;
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.25);
  font-size: 14px;
  z-index: 400;
  opacity: 0;
  transform: translateX(60px);
  transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
  max-width: 320px;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.75);
}
.notification::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
  border-radius: 10px 10px 0 0;
}
.notification.show { opacity: 1; transform: translateX(0); }
.notification b { color: #FFE9A8; display: block; margin-bottom: 4px; font-size: 12px; letter-spacing: 1.5px; }

/* ===== ТИТУЛЬНЫЙ ЭКРАН ===== */
.title-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: space-between;
  padding: 7vh 20px 6vh; z-index: 200;
  background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.15) 35%, rgba(0,0,0,0.65) 100%);
}
.title-logo { text-align: center; animation: titleFadeIn 1.1s ease-out; }
@keyframes titleFadeIn {
  from { opacity: 0; transform: translateY(-24px); }
  to   { opacity: 1; transform: translateY(0); }
}
.title-main {
  font-size: clamp(34px, 5.4vw, 64px);
  color: #FFF8E7;
  text-shadow:
    -2px -2px 0 #B45309, 2px -2px 0 #B45309,
    -2px  2px 0 #B45309, 2px  2px 0 #B45309,
     0 0 30px rgba(255, 220, 100, 1),
     5px 5px 25px rgba(0, 0, 0, 0.8);
  letter-spacing: 6px; margin: 0; font-weight: bold;
  animation: titleGlow 3.4s ease-in-out infinite;
}
@keyframes titleGlow {
  0%,100% { text-shadow: -2px -2px 0 #B45309, 2px -2px 0 #B45309, -2px 2px 0 #B45309, 2px 2px 0 #B45309, 0 0 30px rgba(255,220,100,1), 5px 5px 25px rgba(0,0,0,0.8); }
  50%     { text-shadow: -2px -2px 0 #B45309, 2px -2px 0 #B45309, -2px 2px 0 #B45309, 2px 2px 0 #B45309, 0 0 52px rgba(255,240,150,1), 5px 5px 25px rgba(0,0,0,0.8); }
}
.title-sub {
  font-size: clamp(13px, 1.1vw, 17px);
  color: #FFF3C4;
  text-shadow: 1px 1px 0 #B45309, 2px 2px 6px rgba(0,0,0,0.9);
  font-style: italic; margin-top: 10px; letter-spacing: 4px;
}
.title-menu {
  display: flex; flex-direction: column; gap: 12px;
  width: min(320px, 78vw);
  animation: titleFadeIn 1s ease-out 0.35s backwards;
}
.title-menu button {
  display: block;
  background: linear-gradient(180deg, rgba(251,191,36,0.95) 0%, rgba(217,119,6,0.95) 100%);
  color: #2A1500;
  padding: 13px 22px;
  border-radius: 8px;
  border: 2px solid rgba(120,53,15,0.9);
  cursor: pointer;
  font-size: clamp(13px, 1.05vw, 16px);
  font-weight: bold; font-family: inherit; text-align: center;
  letter-spacing: 1.2px; transition: all 0.25s ease;
  box-shadow: 0 8px 22px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
  -webkit-tap-highlight-color: transparent;
}
.title-menu button:hover:not(:disabled) {
  background: linear-gradient(180deg, rgba(252,211,77,1) 0%, rgba(245,158,11,1) 100%);
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 14px 30px rgba(255,200,100,0.65);
}
.title-menu button:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.6); }
.title-footer {
  font-size: clamp(11px, 0.9vw, 13px);
  color: #FFF3C4;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
  letter-spacing: 2px; font-style: italic; opacity: 0.9; margin: 0;
  animation: titleFadeIn 1s ease-out 0.7s backwards;
}
.title-endings {
  position: fixed; left: 50%; bottom: 11vh;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.78);
  color: #FFD700;
  padding: 10px 26px;
  border: 2px solid rgba(255,215,0,0.85);
  border-radius: 999px;
  font-size: clamp(12px, 1vw, 15px);
  letter-spacing: 1.2px;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
  box-shadow: 0 6px 28px rgba(255,215,0,0.28);
  z-index: 210;
  animation: titleFadeIn 1s ease-out 0.9s backwards;
}

/* ===== МОДАЛЬНОЕ ОКНО ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.82);
  z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.25s ease-out;
  padding: 20px;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-overlay.hidden { display: none; }
.modal {
  background: linear-gradient(180deg, #171310 0%, #0d0a08 100%);
  border: 2px solid rgba(244,197,66,0.6);
  max-width: 620px; width: 100%; max-height: 82vh;
  overflow-y: auto; padding: 24px;
  border-radius: 14px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
}
.modal h2 {
  margin: 0 0 16px; color: #FBBF24;
  text-transform: uppercase; font-size: 18px; letter-spacing: 2px;
  text-shadow: 0 0 12px rgba(251,191,36,0.5);
}
.modal .row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0; border-bottom: 1px solid #2a241c;
  gap: 12px; flex-wrap: wrap;
}
.modal .row:last-of-type { border-bottom: none; }
.modal label { color: #ddd; }
.modal select, .modal input[type=range] {
  background: #1c1813; color: #eee;
  border: 1px solid #4a3f2f;
  padding: 6px 10px; border-radius: 6px;
  font-family: inherit; font-size: 14px;
  cursor: pointer;
}
.modal .buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
.modal button {
  background: linear-gradient(180deg, #35a, #147);
  color: #fff; border: 2px solid #57c;
  padding: 10px 20px; border-radius: 8px;
  cursor: pointer; font-family: inherit; font-size: 14px;
  font-weight: bold; letter-spacing: 1px; transition: all 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.modal button:hover { background: linear-gradient(180deg, #57c, #258); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(80,130,220,0.4); }
.modal .ach-list { display: flex; flex-direction: column; gap: 8px; }
.modal .ach {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; border-radius: 8px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  transition: all 0.25s ease;
}
.modal .ach:not(.locked):hover {
  background: rgba(251,191,36,0.08);
  border-color: rgba(251,191,36,0.3);
  transform: translateX(4px);
}
.modal .ach.locked { opacity: 0.4; filter: grayscale(1); }
.modal .ach .icon { font-size: 22px; }
.modal .ach .info { display: flex; flex-direction: column; gap: 2px; }
.modal .ach .title { color: #FBBF24; font-weight: bold; font-size: 14px; }
.modal .ach .desc { color: #aaa; font-size: 12px; }

/* ===== КАСТСЦЕНЫ (СЛАЙД-ШОУ) ===== */
.cutscene-layer {
  position: fixed; inset: 0;
  z-index: 95;
  background: #000;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.6s ease, visibility 0.6s ease;
  overflow: hidden;
  cursor: pointer;
}
.cutscene-layer.active {
  opacity: 1;
  visibility: visible;
}
.cutscene-frame {
  position: absolute;
  inset: 0;
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
  background-color: #000;
  opacity: 0;
  transform: scale(1);
  transition: opacity 0.8s ease, transform 8s ease-out;
  will-change: opacity, transform;
}
.cutscene-frame.current { opacity: 1; z-index: 1; }
.cutscene-frame.next    { opacity: 0; z-index: 2; }
.cutscene-frame.visible { opacity: 1; }
.cutscene-frame.effect-fade.next { opacity: 0; transition: opacity 0.9s ease; }
.cutscene-frame.effect-fade.next.visible { opacity: 1; }
.cutscene-frame.effect-zoom-in.next.visible { transform: scale(1.08); }
.cutscene-frame.effect-zoom-out.next.visible { transform: scale(0.94); }
.cutscene-frame.effect-slide-left.next {
  transform: translateX(100%);
  transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
}
.cutscene-frame.effect-slide-left.next.visible { transform: translateX(0); }
.cutscene-frame.effect-slide-right.next {
  transform: translateX(-100%);
  transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
}
.cutscene-frame.effect-slide-right.next.visible { transform: translateX(0); }
.cutscene-layer::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,0.65) 100%);
  pointer-events: none;
  z-index: 3;
}
.cutscene-progress {
  position: absolute;
  left: 0; bottom: 0;
  height: 4px;
  width: 0%;
  background: linear-gradient(90deg, #FBBF24, #F59E0B, #FBBF24);
  background-size: 200% 100%;
  box-shadow: 0 0 12px rgba(255,200,100,0.8);
  z-index: 4;
  transition: width 0.2s linear;
  animation: progressShine 2s linear infinite;
}
@keyframes progressShine {
  from { background-position: 200% 0; }
  to   { background-position: -200% 0; }
}
.cutscene-controls {
  position: absolute;
  top: 20px; right: 20px;
  display: flex; gap: 10px;
  z-index: 5;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.cutscene-layer.active .cutscene-controls { opacity: 1; }
.cs-btn {
  padding: 10px 18px;
  background: rgba(0,0,0,0.7);
  border: 2px solid rgba(244,197,66,0.85);
  border-radius: 8px;
  color: #FFD700;
  font-family: inherit;
  font-size: 14px; font-weight: bold;
  letter-spacing: 1px; cursor: pointer;
  transition: all 0.25s ease;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  -webkit-tap-highlight-color: transparent;
}
.cs-btn:hover {
  background: rgba(244,197,66,0.9);
  color: #1a0d00;
  transform: scale(1.05);
}
.cutscene-caption {
  position: absolute;
  left: 50%; bottom: 8vh;
  transform: translateX(-50%);
  max-width: 80vw;
  padding: 14px 28px;
  background: rgba(0,0,0,0.75);
  border: 2px solid rgba(244,197,66,0.8);
  border-radius: 10px;
  color: #FFF8E7;
  font-size: clamp(14px, 1.2vw, 18px);
  line-height: 1.6;
  text-align: center;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
  z-index: 4;
  animation: captionIn 0.6s ease-out;
}
@keyframes captionIn {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
body.cutscene-active .game-area,
body.cutscene-active .click-layer,
body.cutscene-active .history-controls {
  pointer-events: none;
}

/* ===== ГАЛЕРЕЯ ===== */
.gallery-card {
  position: relative;
  aspect-ratio: 16/9;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid rgba(251,191,36,0.6);
  background-color: #1c1813;
  background-size: cover;
  background-position: center;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.gallery-card.locked {
  cursor: not-allowed;
  border-color: rgba(255,255,255,0.1);
  opacity: 0.5;
}
.gallery-card:not(.locked):hover {
  transform: scale(1.03);
  box-shadow: 0 8px 24px rgba(251,191,36,0.4);
}

/* ===== СКРОЛЛБАР ===== */
.dialogue-text::-webkit-scrollbar, .modal::-webkit-scrollbar { width: 6px; }
.dialogue-text::-webkit-scrollbar-track, .modal::-webkit-scrollbar-track { background: rgba(255,243,196,0.12); border-radius: 3px; }
.dialogue-text::-webkit-scrollbar-thumb, .modal::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #FBBF24, #F59E0B);
  border-radius: 3px;
}
.dialogue-text::-webkit-scrollbar-thumb:hover, .modal::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, #FCD34D, #FBBF24);
}

/* ===== АДАПТАЦИЯ ===== */
@media (max-width: 768px) {
  .dialogue-box { width: 94vw; max-height: 42vh; bottom: 2vh; }
  .speaker-name { top: -1.6vh; left: 4vw; padding: 0.7vh 4vw; font-size: 15px; min-width: 120px; }
  .dialogue-text { font-size: 15px; padding: 3.2vh 5vw 2.4vh; min-height: 14vh; max-height: 32vh; }
  .choice-box { bottom: 47vh; width: 90vw; gap: 10px; }
  .choice-box a { padding: 12px 16px; font-size: 14px; }
  .sprite { height: 62vh; max-width: 62vw; bottom: 30vh; }
  .sprite.pos-left  { left: 28%; }
  .sprite.pos-right { right: 28%; }
  .sprite.pos-far-left  { left: 14%; }
  .sprite.pos-far-right { right: 14%; }
  .history-btn, .game-menu button { width: 42px; height: 42px; font-size: 17px; }
  .title-endings { bottom: 15vh; }
  .notification { top: 70px; right: 12px; font-size: 12px; padding: 10px 16px 10px 20px; max-width: 260px; }
  .modal { padding: 18px; }
  .cs-btn { padding: 8px 14px; font-size: 12px; }
}

@media (max-width: 480px) {
  .dialogue-box { width: 96vw; max-height: 48vh; bottom: 1.5vh; border-radius: 12px; }
  .speaker-name { top: -1.4vh; left: 3vw; padding: 0.6vh 3vw; font-size: 13px; }
  .dialogue-text { font-size: 14px; padding: 2.8vh 4vw 2vh; line-height: 1.65; }
  .choice-box { bottom: 52vh; width: 94vw; gap: 8px; }
  .choice-box a { padding: 11px 14px; font-size: 13px; }
  .sprite { height: 55vh; max-width: 75vw; bottom: 32vh; }
  .history-btn, .game-menu button { width: 38px; height: 38px; font-size: 15px; }
  .title-main { font-size: 28px; letter-spacing: 3px; }
  .title-sub { font-size: 11px; letter-spacing: 2px; }
  .history-controls, .game-menu { top: 10px; }
  .history-controls { left: 10px; }
  .game-menu { right: 10px; }
}

.hidden { display: none !important; }
</style>
</head>
