<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Песнь Августа</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="data:,">
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: 'Georgia', 'Times New Roman', serif;
  background: #0a0a14; color: #eee;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ============ ФОН ЛОКАЦИИ ============ */
.bg-layer {
  position: fixed; inset: 0;
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-color: #0a0a14;
  z-index: 1; pointer-events: none;
  opacity: 1;
  transition: opacity 0.8s ease-in-out;
  will-change: opacity, transform;
  transform-origin: center center;
  animation: kenBurns 28s ease-in-out infinite alternate;
}
@keyframes kenBurns {
  0%   { transform: scale(1)    translate(0, 0); }
  100% { transform: scale(1.08) translate(-1.2%, -1%); }
}

/* ============ СЛОЙ СПРАЙТОВ ============ */
.sprites-layer {
  position: fixed;
  left: 0; right: 0;
  bottom: 22vh;
  height: 60vh;
  z-index: 5;
  pointer-events: none;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 0 2vw;
}
.sprite {
  position: relative;
  height: 100%;
  width: auto;
  max-width: 40vw;
  object-fit: contain;
  object-position: bottom center;
  filter: drop-shadow(0 8px 24px rgba(0,0,0,0.7));
  transition: filter 0.4s ease, opacity 0.4s ease, transform 0.4s ease;
  image-rendering: auto;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.sprite.hero { transform-origin: bottom left; }
.sprite.mira { transform-origin: bottom right; }
.sprite.active {
  filter: drop-shadow(0 8px 24px rgba(0,0,0,0.7)) brightness(1.05);
  opacity: 1;
}
.sprite.inactive {
  filter: drop-shadow(0 8px 24px rgba(0,0,0,0.7)) brightness(0.7) saturate(0.85);
  opacity: 0.9;
}
.sprite.hidden-sprite {
  opacity: 0;
  transform: translateY(20px);
}
.sprite.fade-in  { animation: spriteFadeIn 0.5s ease-out both; }
.sprite.fade-out { animation: spriteFadeOut 0.5s ease-in both; }
@keyframes spriteFadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes spriteFadeOut {
  from { opacity: 1; transform: translateY(0); }
  to   { opacity: 0; transform: translateY(20px); }
}

/* ============ ЧАСТИЦЫ ============ */
.particles-layer {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 3;
  overflow: hidden;
}
.particle {
  position: absolute;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,220,120,1) 0%, rgba(255,180,50,0.6) 40%, transparent 70%);
  box-shadow: 0 0 8px rgba(255,200,80,0.9), 0 0 16px rgba(255,180,50,0.5);
  opacity: 0;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0%   { transform: translateY(0) translateX(0) scale(0.6); opacity: 0; }
  10%  { opacity: 0.85; }
  90%  { opacity: 0.65; }
  100% { transform: translateY(-110vh) translateX(40px) scale(1.1); opacity: 0; }
}

/* ============ ВИНЬЕТКА ============ */
.vignette-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 4;
  background:
    radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,0.7) 100%),
    linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 25%, transparent 65%, rgba(0,0,0,0.7) 100%);
}

/* ============ ЗАГРУЗКА ============ */
.loading-screen {
  position: fixed; inset: 0; z-index: 5000;
  background: radial-gradient(ellipse at center, #14101e 0%, #0a0a14 100%);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 24px;
  transition: opacity 0.8s ease;
}
.loading-screen.hidden { opacity: 0; pointer-events: none; }
.loading-spinner {
  width: 72px; height: 72px;
  border: 3px solid rgba(251,191,36,0.12);
  border-top-color: #FBBF24;
  border-right-color: rgba(251,191,36,0.5);
  border-radius: 50%;
  animation: spin 1.1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
  box-shadow: 0 0 40px rgba(251,191,36,0.35), inset 0 0 20px rgba(251,191,36,0.15);
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  color: #FBBF24; font-size: 14px;
  letter-spacing: 6px; text-transform: uppercase;
  animation: pulse 1.8s ease-in-out infinite;
  text-shadow: 0 0 16px rgba(251,191,36,0.7);
}
@keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

/* ============ КЛИК-СЛОЙ ============ */
.click-layer {
  position: fixed; inset: 0; z-index: 90;
  background: transparent; cursor: pointer; display: none;
}
.click-layer.enabled { display: block; }

/* ============ ДИАЛОГ ============ */
.dialogue-box {
  position: fixed; left: 50%; bottom: 3vh;
  transform: translateX(-50%);
  width: min(1240px, 94vw);
  max-height: 34vh;
  background: linear-gradient(180deg, rgba(28,22,14,0.92) 0%, rgba(14,10,6,0.97) 100%);
  border: 1px solid rgba(244,197,66,0.6);
  border-radius: 4px;
  box-shadow:
    0 -40px 80px rgba(0,0,0,0.7),
    0 24px 70px rgba(0,0,0,0.8),
    0 0 0 1px rgba(0,0,0,0.7),
    0 0 60px rgba(255,200,80,0.1),
    inset 0 1px 0 rgba(255,255,255,0.08),
    inset 0 0 80px rgba(255,180,50,0.04);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  z-index: 100;
  display: flex; flex-direction: column;
  animation: dialogueIn 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  overflow: visible; cursor: pointer;
}
.dialogue-box::before, .dialogue-box::after {
  content: ''; position: absolute;
  width: 28px; height: 28px;
  border: 2px solid rgba(244,197,66,0.85);
  pointer-events: none; z-index: 3;
}
.dialogue-box::before {
  top: -2px; left: -2px;
  border-right: none; border-bottom: none;
  border-radius: 4px 0 0 0;
  box-shadow: -2px -2px 12px rgba(255,200,80,0.3);
}
.dialogue-box::after {
  bottom: -2px; right: -2px;
  border-left: none; border-top: none;
  border-radius: 0 0 4px 0;
  box-shadow: 2px 2px 12px rgba(255,200,80,0.3);
}
.dialogue-box .top-line {
  position: absolute; top: -1px; left: 15%; right: 15%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,220,120,0.9), transparent);
  pointer-events: none; z-index: 3;
}
@keyframes dialogueIn {
  from { opacity: 0; transform: translateX(-50%) translateY(40px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.speaker-name {
  position: absolute; top: -26px; left: 34px;
  min-width: 150px; max-width: 360px;
  padding: 10px 26px 9px;
  background: linear-gradient(180deg, rgba(217,119,6,1) 0%, rgba(160,75,10,1) 100%);
  color: #FFF8E7;
  font-size: clamp(14px, 1.2vw, 18px);
  font-weight: bold; border-radius: 3px;
  border: 1px solid rgba(244,197,66,0.95);
  box-shadow:
    0 10px 28px rgba(0,0,0,0.7),
    0 0 24px rgba(255,180,50,0.35),
    inset 0 1px 0 rgba(255,255,255,0.3),
    inset 0 -6px 12px rgba(0,0,0,0.25);
  text-shadow: 1px 1px 4px rgba(0,0,0,0.85);
  letter-spacing: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  z-index: 4;
}
.speaker-name::after {
  content: ''; position: absolute;
  bottom: -6px; left: 22px;
  width: 0; height: 0;
  border-left: 7px solid transparent;
  border-right: 7px solid transparent;
  border-top: 7px solid rgba(160,75,10,1);
  filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
}
.dialogue-text {
  width: 100%; flex: 1;
  min-height: 13vh; max-height: 26vh;
  color: #f5ecd7;
  font-size: clamp(15px, 1.2vw, 19px);
  line-height: 1.85;
  text-shadow: 0 1px 3px rgba(0,0,0,0.95);
  padding: 34px 44px 30px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #FBBF24 rgba(255,243,196,0.1);
  letter-spacing: 0.2px;
}
.dialogue-text b { color: #FFE9A8; font-weight: bold; }
.dialogue-text i { color: #d8c9a8; font-style: italic; }
.dialogue-text em { color: #FFE9A8; font-style: italic; }
.type-cursor {
  display: inline-block; color: #FFD700;
  animation: cursorBlink 0.8s steps(2, start) infinite;
  font-weight: bold; margin-left: 2px;
  text-shadow: 0 0 10px rgba(255,215,0,0.95);
}
@keyframes cursorBlink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
.next-hint {
  position: absolute; right: 26px; bottom: 16px;
  color: #FFD700;
  font-size: clamp(18px, 1.5vw, 24px);
  opacity: 0.85;
  animation: nextPulse 1.5s ease-in-out infinite;
  pointer-events: none;
  text-shadow: 0 0 14px rgba(255,215,0,0.9);
}
@keyframes nextPulse {
  0%,100% { transform: translateY(0); opacity: 0.4; }
  50%     { transform: translateY(6px); opacity: 1; }
}
.dialogue-box.narrator { border-color: rgba(200,160,80,0.55); }
.dialogue-box.narrator .speaker-name { background: linear-gradient(180deg, rgba(180,130,40,1) 0%, rgba(130,90,25,1) 100%); }
.dialogue-box.narrator .speaker-name::after { border-top-color: rgba(130,90,25,1); }
.dialogue-box.mira { border-color: rgba(230,126,34,0.85); box-shadow: 0 -40px 80px rgba(0,0,0,0.7), 0 24px 70px rgba(0,0,0,0.8), 0 0 60px rgba(230,126,34,0.2), inset 0 1px 0 rgba(255,255,255,0.08); }
.dialogue-box.mira .speaker-name { background: linear-gradient(180deg, rgba(230,126,34,1) 0%, rgba(190,90,15,1) 100%); }
.dialogue-box.mira .speaker-name::after { border-top-color: rgba(190,90,15,1); }
.dialogue-box.bruno { border-color: rgba(170,170,170,0.8); }
.dialogue-box.bruno .speaker-name { background: linear-gradient(180deg, rgba(120,120,120,1) 0%, rgba(70,70,70,1) 100%); color: #F5F5F5; }
.dialogue-box.bruno .speaker-name::after { border-top-color: rgba(70,70,70,1); }
.dialogue-box.selesta { border-color: rgba(160,120,210,0.85); }
.dialogue-box.selesta .speaker-name { background: linear-gradient(180deg, rgba(130,90,180,1) 0%, rgba(95,65,135,1) 100%); }
.dialogue-box.selesta .speaker-name::after { border-top-color: rgba(95,65,135,1); }
.dialogue-box.cornelius { border-color: rgba(80,120,210,0.85); }
.dialogue-box.cornelius .speaker-name { background: linear-gradient(180deg, rgba(60,100,180,1) 0%, rgba(35,65,135,1) 100%); }
.dialogue-box.cornelius .speaker-name::after { border-top-color: rgba(35,65,135,1); }
.dialogue-box.olven { border-style: dashed; border-color: rgba(170,130,70,0.9); background: linear-gradient(180deg, rgba(50,38,22,0.94) 0%, rgba(28,20,10,0.97) 100%); }
.dialogue-box.olven .speaker-name { background: linear-gradient(180deg, rgba(150,110,55,1) 0%, rgba(100,70,30,1) 100%); }
.dialogue-box.olven .speaker-name::after { border-top-color: rgba(100,70,30,1); }
.dialogue-box.olven .dialogue-text { font-style: italic; color: #f0e3c8; }
.dialogue-box.player { border-color: rgba(100,200,255,0.85); }
.dialogue-box.player .speaker-name { background: linear-gradient(180deg, rgba(60,140,200,1) 0%, rgba(35,90,150,1) 100%); color: #F0F8FF; }
.dialogue-box.player .speaker-name::after { border-top-color: rgba(35,90,150,1); }

/* ============ ВЫБОР ============ */
.choice-box {
  position: fixed; left: 50%; bottom: 40vh;
  transform: translateX(-50%); z-index: 101;
  display: flex; flex-direction: column; gap: 14px;
  width: min(780px, 88vw);
  animation: choicesIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.2s backwards;
}
@keyframes choicesIn {
  from { opacity: 0; transform: translateX(-50%) translateY(24px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.choice-box a {
  position: relative;
  width: 100%; display: block; text-align: left;
  padding: 16px 26px 16px 60px;
  background: linear-gradient(180deg, rgba(28,22,14,0.94) 0%, rgba(14,10,6,0.97) 100%);
  color: #F5ECD7;
  border: 1px solid rgba(244,197,66,0.5);
  border-radius: 4px;
  text-decoration: none;
  font-size: clamp(13px, 1.05vw, 16px);
  font-weight: normal;
  line-height: 1.4;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 8px 24px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
  letter-spacing: 0.4px; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.choice-box a::before {
  content: '▸'; position: absolute;
  left: 22px; top: 50%;
  transform: translateY(-50%);
  color: #FBBF24; font-size: 18px;
  transition: all 0.3s ease;
  text-shadow: 0 0 10px rgba(255,200,80,0.7);
}
.choice-box a::after {
  content: ''; position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,200,80,0.15), transparent);
  transition: left 0.6s ease;
  pointer-events: none;
}
.choice-box a:hover::after { left: 100%; }
.choice-box a > span { position: relative; z-index: 1; }
.choice-box a:hover:not(.disabled) {
  background: linear-gradient(180deg, rgba(244,197,66,0.18) 0%, rgba(180,120,20,0.12) 100%);
  border-color: rgba(244,197,66,0.95);
  color: #FFF8E7;
  transform: translateX(6px);
  box-shadow:
    0 14px 38px rgba(0,0,0,0.7),
    0 0 30px rgba(255,200,80,0.3),
    inset 0 1px 0 rgba(255,255,255,0.12);
}
.choice-box a:hover:not(.disabled)::before { color: #FFD700; transform: translateY(-50%) translateX(4px); text-shadow: 0 0 16px rgba(255,215,0,1); }
.choice-box a:active:not(.disabled) { transform: translateX(6px) scale(0.995); }
.choice-box a.disabled { opacity: 0.45; cursor: not-allowed; border-style: dashed; }
.choice-box a.disabled::before { content: '🔒'; color: #888; text-shadow: none; font-size: 16px; }
.choice-box a .need { color: #e07b39; font-size: 0.85em; font-style: italic; margin-left: 0.3em; }

/* ============ ИСТОРИЯ ============ */
.history-controls {
  position: fixed; top: 18px; left: 18px;
  display: flex; gap: 12px; z-index: 300;
  pointer-events: auto;
}
.history-btn {
  width: 50px; height: 50px;
  border-radius: 50%;
  border: 1px solid rgba(244,197,66,0.7);
  background: linear-gradient(180deg, rgba(28,22,14,0.9) 0%, rgba(14,10,6,0.95) 100%);
  color: #FBBF24;
  font-size: 22px; font-weight: bold;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 6px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
  user-select: none;
  font-family: 'Georgia', serif;
  padding: 0;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  -webkit-tap-highlight-color: transparent;
}
.history-btn:hover:not(:disabled) {
  transform: translateY(-3px) scale(1.08);
  box-shadow: 0 12px 30px rgba(0,0,0,0.7), 0 0 24px rgba(255,200,80,0.5);
  border-color: rgba(244,197,66,1);
  color: #FFD700;
}
.history-btn:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(0.8); }

/* ============ МЕНЮ ============ */
.game-menu {
  position: fixed; top: 18px; right: 18px;
  display: flex; gap: 12px; z-index: 300;
}
.game-menu button {
  position: relative;
  width: 50px; height: 50px;
  border-radius: 50%;
  border: 1px solid rgba(244,197,66,0.7);
  background: linear-gradient(180deg, rgba(28,22,14,0.9) 0%, rgba(14,10,6,0.95) 100%);
  color: #FBBF24;
  font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 6px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
  padding: 0; overflow: hidden;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  -webkit-tap-highlight-color: transparent;
}
.game-menu button:hover {
  transform: translateY(-3px) scale(1.08);
  box-shadow: 0 12px 30px rgba(0,0,0,0.7), 0 0 24px rgba(255,200,80,0.5);
  border-color: rgba(244,197,66,1);
  color: #FFD700;
}

/* ============ УВЕДОМЛЕНИЯ ============ */
.notification {
  position: fixed; top: 90px; right: 24px;
  background: linear-gradient(180deg, rgba(217,119,6,0.97) 0%, rgba(160,75,10,0.97) 100%);
  color: #FFF8E7;
  padding: 16px 26px 16px 30px;
  border: 1px solid rgba(244,197,66,0.9);
  border-left: 4px solid #FBBF24;
  border-radius: 6px;
  box-shadow:
    0 14px 40px rgba(0,0,0,0.7),
    0 0 30px rgba(255,180,50,0.4),
    inset 0 1px 0 rgba(255,255,255,0.25);
  font-size: 14px;
  z-index: 400;
  opacity: 0;
  transform: translateX(80px);
  transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
  max-width: 340px;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.notification.show { opacity: 1; transform: translateX(0); }
.notification b {
  color: #FFE9A8; display: block; margin-bottom: 5px;
  font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
}
.notification.warn {
  background: linear-gradient(180deg, rgba(180,60,30,0.97) 0%, rgba(120,30,10,0.97) 100%);
  border-left-color: #F87171;
  border-color: rgba(248,113,113,0.9);
}
.notification.warn b { color: #FECACA; }

/* ============ ПОПАП ПРЕДМЕТА ============ */
.item-popup {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.85);
  z-index: 450;
  background: linear-gradient(180deg, rgba(28,22,14,0.97) 0%, rgba(14,10,6,0.99) 100%);
  border: 2px solid rgba(244,197,66,0.95);
  border-radius: 10px;
  padding: 26px 40px;
  text-align: center;
  box-shadow:
    0 30px 80px rgba(0,0,0,0.85),
    0 0 60px rgba(255,200,80,0.5),
    inset 0 1px 0 rgba(255,255,255,0.15);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.item-popup.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.item-popup .popup-icon { font-size: 52px; margin-bottom: 10px; filter: drop-shadow(0 0 20px rgba(255,200,80,0.9)); }
.item-popup .popup-label { color: #FBBF24; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; }
.item-popup .popup-name { color: #FFF8E7; font-size: 20px; font-weight: bold; letter-spacing: 1px; text-shadow: 0 0 14px rgba(255,220,100,0.7); }
.item-popup .popup-hint { color: #d8c9a8; font-size: 13px; font-style: italic; margin-top: 10px; max-width: 320px; }

/* ============ ТИТУЛЬНЫЙ ЭКРАН ============ */
.title-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: space-between;
  padding: 8vh 20px 6vh; z-index: 200;
  background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.15) 30%, rgba(0,0,0,0.3) 65%, rgba(0,0,0,0.85) 100%);
}
.title-logo { text-align: center; animation: titleFadeIn 1.3s ease-out; }
@keyframes titleFadeIn { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
.title-main {
  font-size: clamp(38px, 6vw, 76px);
  color: #FFF8E7;
  text-shadow:
    -3px -3px 0 #8B4513, 3px -3px 0 #8B4513,
    -3px 3px 0 #8B4513, 3px 3px 0 #8B4513,
     0 0 40px rgba(255, 220, 100, 1),
     0 0 80px rgba(255, 180, 50, 0.7),
     6px 6px 30px rgba(0, 0, 0, 0.9);
  letter-spacing: 8px; margin: 0; font-weight: bold;
  animation: titleGlow 3.6s ease-in-out infinite;
}
@keyframes titleGlow {

/* ============ ЭКРАН КОНЦОВКИ ============ */
.ending-screen {
  position: fixed; inset: 0;
  z-index: 250;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  animation: endingFadeIn 0.9s ease-out;
  overflow-y: auto;
  pointer-events: auto;
}
@keyframes endingFadeIn {
  from { opacity: 0; transform: scale(1.05); }
  to   { opacity: 1; transform: scale(1); }
}
.ending-frame {
  position: relative;
  max-width: 640px; width: 100%;
  padding: 42px 48px 36px;
  background: linear-gradient(180deg, rgba(20,14,8,0.93) 0%, rgba(10,6,4,0.97) 100%);
  border: 2px solid rgba(244,197,66,0.9);
  border-radius: 6px;
  box-shadow:
    0 40px 120px rgba(0,0,0,0.95),
    0 0 80px rgba(255,200,80,0.35),
    inset 0 1px 0 rgba(255,255,255,0.12),
    inset 0 0 100px rgba(255,180,50,0.06);
  text-align: center;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.ending-frame::before, .ending-frame::after {
  content: ''; position: absolute;
  width: 40px; height: 40px;
  border: 3px solid rgba(244,197,66,0.95);
  pointer-events: none;
}
.ending-frame::before {
  top: -3px; left: -3px;
  border-right: none; border-bottom: none;
  border-radius: 6px 0 0 0;
  box-shadow: -3px -3px 20px rgba(255,200,80,0.5);
}
.ending-frame::after {
  bottom: -3px; right: -3px;
  border-left: none; border-top: none;
  border-radius: 0 0 6px 0;
  box-shadow: 3px 3px 20px rgba(255,200,80,0.5);
}
.ending-frame .ending-corner {
  position: absolute;
  width: 40px; height: 40px;
  border: 3px solid rgba(244,197,66,0.95);
  pointer-events: none;
}
.ending-frame .ending-corner.tr {
  top: -3px; right: -3px;
  border-left: none; border-bottom: none;
  border-radius: 0 6px 0 0;
  box-shadow: 3px -3px 20px rgba(255,200,80,0.5);
}
.ending-frame .ending-corner.bl {
  bottom: -3px; left: -3px;
  border-right: none; border-top: none;
  border-radius: 0 0 0 6px;
  box-shadow: -3px 3px 20px rgba(255,200,80,0.5);
}
.ending-label {
  color: #FBBF24;
  font-size: 11px;
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-bottom: 14px;

}
.ending-title {
  font-size: clamp(24px, 3.4vw, 40px);
  font-weight: bold;

}
.ending-subtitle {
  font-size: clamp(13px, 1.3vw, 17px);
  font-style: italic;
  color: #FFF3C4;
  letter-spacing: 2px;
  margin: 0 0 24px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.95);
}
.ending-divider {
  width: 60%; height: 1px;

}
.ending-desc {
  color: #e8dcc0;
  font-size: clamp(13px, 1.1vw, 15px);

}
.ending-progress {
  display: inline-block;
  padding: 10px 28px;
  border: 1px solid rgba(255,215,0,0.85);
  border-radius: 999px;
  color: #FFD700;
  font-size: clamp(12px, 1vw, 14px);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 26px;
  background: rgba(0,0,0,0.5);

  box-shadow: 0 0 24px rgba(255,215,0,0.25);
}
.ending-progress b { color: #FFF8E7; font-size: 1.15em; }
.ending-buttons {
  display: flex; flex-direction: column; gap: 10px;

}
.ending-buttons button {
  padding: 13px 22px;
  background: linear-gradient(180deg, rgba(28,22,14,0.95) 0%, rgba(14,10,6,0.98) 100%);

  border: 1px solid rgba(244,197,66,0.7);
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  font-size: clamp(12px, 1vw, 14px);

  letter-spacing: 2px;
  text-transform: uppercase;
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);

}
.ending-buttons button:hover:not(:disabled) {
  background: linear-gradient(180deg, rgba(244,197,66,0.22) 0%, rgba(180,120,20,0.15) 100%);
  color: #FFF8E7;
  transform: translateY(-2px);

  box-shadow: 0 12px 32px rgba(0,0,0,0.7), 0 0 30px rgba(255,200,80,0.5);
}
.ending-buttons button.primary {
  background: linear-gradient(180deg, rgba(217,119,6,0.95) 0%, rgba(160,75,10,0.95) 100%);
  color: #FFF8E7;
  border-color: rgba(244,197,66,1);
  box-shadow: 0 8px 26px rgba(0,0,0,0.6), 0 0 30px rgba(255,180,50,0.5), inset 0 1px 0 rgba(255,255,255,0.25);

.ending-buttons button.primary:hover:not(:disabled) {
  background: linear-gradient(180deg, rgba(244,140,20,1) 0%, rgba(190,95,15,1) 100%);

}
.ending-buttons button:disabled {
  opacity: 0.4; cursor: not-allowed; filter: grayscale(0.7);
}

@media (max-width: 600px) {
  .ending-frame { padding: 30px 22px 26px; }
  .ending-title { letter-spacing: 1.5px; }

/* ============ МОДАЛКИ ============ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.3s ease-out;
  padding: 20px;

}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-overlay.hidden { display: none; }
.modal {
  background: linear-gradient(180deg, #1a1410 0%, #0d0a08 100%);

  max-width: 660px; width: 100%; max-height: 84vh;

.modal .buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; flex-wrap: wrap; }
.modal button {
  background: linear-gradient(180deg, rgba(60,100,180,0.95) 0%, rgba(35,65,135,0.95) 100%);

  font-weight: bold; letter-spacing: 1.5px; transition: all 0.25s ease;

}
.modal button:hover {
  background: linear-gradient(180deg, rgba(80,130,220,1) 0%, rgba(45,85,165,1) 100%);

.modal .ach-list { display: flex; flex-direction: column; gap: 10px; }
.modal .ach {

.modal .ach .icon { font-size: 26px; }

.modal .ach .title { color: #FBBF24; font-weight: bold; font-size: 14px; }
.modal .ach .desc { color: #999; font-size: 12px; }
.modal .item-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid rgba(244,197,66,0.1); }

<script>
const PREFIX = "compressed-";

const LOCATION_BG = {
  "title": "images/bg/" + PREFIX + "title.png",
  "start": "images/bg/" + PREFIX + "city_panorama.png",

  "player_outside": "images/bg/" + PREFIX + "player_house.png",

  "player_table2": "images/bg/" + PREFIX + "heroes_table.png",

const PASSAGES = {
  "title": { isTitle: true },
  "Start1": { location: "start", speaker: "Рассказчик", boxClass: "narrator", text: "Верхний Шепот раскинулся на берегу тихого озера, у подножия заснеженных гор. Здесь пахнет сушёными яблоками, речной мятой и смолой — а по утрам солнце поднимается из-за маяка и заливает золотом черепичные крыши.", next: "Start2" },
  "Start2": { location: "city_holiday", speaker: "Рассказчик", boxClass: "narrator", text: "Сегодня — особенный день. Праздник Осенней Звезды. Город украшен гирляндами из яблок, трактиры пекут пироги, а ремесленники развешивают флаги. Но на рассвете случилось небывалое: погас Главный Маяк в роще Заблудших Светлячков.", next: "Start3" },
  "Start3": { location: "player_outside", speaker: "Рассказчик", boxClass: "narrator", text: "Вы — молодой травник, ученик мастера Олвена. Ваш дом стоит на краю города, среди яблоневых садов. Этим утром вы проснулись от тишины: обычно в это время над озером уже гудели пчёлы и сновали лодки. Сегодня — тихо.", next: "Start4" },
  "Start4": { location: "player_outside", speaker: "Рассказчик", boxClass: "narrator", text: "На столе в доме лежало письмо: плотный пергамент, запечатанный золотистым воском с оттиском кленового листа — личный знак вашего наставника, мастера Олвена.", next: "Start5" },
  "Start5": { location: "player_inside", speaker: "Рассказчик", boxClass: "narrator", text: "Вы вернулись в дом. За окном — знакомый вид на потухший маяк. На столе — письмо и чашка остывшего травяного чая. И тут скрипнула калитка, послышались лёгкие шаги.", next: "Start6" },
  "Start6": { location: "mira_arrive", speaker: "Мира", boxClass: "mira", text: "— Подъём, Хранитель трав и ветров! Мастер Олвен передал: в маяке не просто перегорела свеча — там заклинило рунный резонатор. Я взяла отмычки, разводной ключ на двенадцать и банку лучшей графитовой смазки. А у тебя что в письме?", choices: [{ text: "Вскрыть письмо мастера Олвена прямо сейчас", to: "ОткрытьПисьмо" }, { text: "Спрятать письмо и сразу обсудить маршрут", to: "ВыборПути" }, { text: "Пошутить над Мирой и её чехлом с инструментами", to: "РазговорСМирой1" }] },
  "ОткрытьПисьмо": { location: "letter_seal_bg", speaker: "Рассказчик", boxClass: "narrator", text: "Вы ломаете восковую печать. Внутри — не просто записка, а тщательно вычерченная схема линз с личными пометками мастера, сделанными серебряными чернилами.", next: "ПисьмоОлвена" },
  "ПисьмоОлвена": { location: "parchment", speaker: "Мастер Олвен", boxClass: "olven", text: "«Мой юный друг! Сердце маяка — живое существо, древний Звёздный Светляк по имени Август. Он не переносит грубой силы и фальшивых нот. Если механизм замер, ищите причину не в поломке металла, а в нарушении гармонии. Возьмите с собой частицу стихии и помните: свет рождается из дружбы, а не из принуждения. Корнелиус стар и суетлив — помогите ему сохранить спокойствие».", set: { "has_scheme": true }, next: "ПисьмоОлвена2" },
  "ПисьмоОлвена2": { location: "player_table2", speaker: "Мира", boxClass: "mira", text: "— «Свет рождается из дружбы»... Красиво сказано, но без шестерёнок он всё равно не закрутится! Ладно, Олвен мудр. Как пойдём к холму Светлячков?", choices: [{ text: "Пойти через Старый каменный мост", to: "СтарыйМост" }, { text: "Срезать через тенистую Грибную тропу", to: "ГрибнаяТропа" }, { text: "Сначала заглянуть в лавку травницы Селесты", to: "ЛавкаСелесты" }] },
  "ВыборПути": { location: "player_hide_letter", speaker: "Рассказчик", boxClass: "narrator", text: "Вы прячете письмо во внутренний карман.", next: "ВыборПути2" },
  "ВыборПути2": { location: "player_table2", speaker: "Вы", boxClass: "player", text: "— Разберёмся по дороге. Сначала — к маяку.", next: "ВыборПути3" },
  "ВыборПути3": { location: "mira_joke", speaker: "Мира", boxClass: "mira", text: "— Тогда решай, как пойдём. Через Старый мост — надёжнее. Грибной тропой — короче, но там свои сюрпризы. Или заглянем к бабушке Селесте — она всегда что-то подскажет.", choices: [{ text: "Пойти через Старый каменный мост", to: "СтарыйМост" }, { text: "Срезать через Грибную тропу", to: "ГрибнаяТропа" }, { text: "Заглянуть в лавку травницы Селесты", to: "ЛавкаСелесты" }] },
  "РазговорСМирой1": { location: "player_table2", speaker: "Рассказчик", boxClass: "narrator", text: "Вы с улыбкой оглядываете её внушительный багаж.", next: "РазговорСМирой2" },
  "РазговорСМирой2": { location: "player_table2", speaker: "Вы", boxClass: "player", text: "— Ты собралась чинить маяк или перестраивать всю часовую башню столицы за один присест?", next: "РазговорСМирой3" },
  "РазговорСМирой3": { location: "mira_joke", speaker: "Мира", boxClass: "mira", text: "— Настоящий механик готов ко всему! Вдруг нам по дороге попадётся застрявшая заводная стрекоза? Нет уж, инструменты лишними не бывают. Ну так что пишет Олвен?", next: "ОткрытьПисьмо" },
  "СтарыйМост": { location: "most_bridge", speaker: "Рассказчик", boxClass: "narrator", text: "Старый каменный мост вздымался над бурным горным ручьём широкой аркой из серого гранита, заросшего бархатным мхом. По бокам стояли фонари, а вдали виднелся маяк.", next: "СтарыйМост2" },
  "СтарыйМост2": { location: "bruno_block", speaker: "Рассказчик", boxClass: "narrator", text: "Прямо по центру, развалившись на нагретых полуденным солнцем камнях, дремал каменный гаргуль Бруно. Его хвост с кисточкой мирно покачивался в воздухе. Путь был перекрыт.", next: "СтарыйМост3" },
  "СтарыйМост3": { location: "bruno_awake", speaker: "Бруно", boxClass: "bruno", text: "— М-м-м... Кто это тут у нас? Ба, знакомые лица! Куда путь держите в такой важный день? Уж не к маяку ли?", next: "СтарыйМост4" },
  "СтарыйМост4": { location: "bruno_awake", speaker: "Мира", boxClass: "mira", text: "— Именно туда, Бруно. Время не ждёт, солнце перевалило за полдень. Пропустишь нас без долгих церемоний?", next: "СтарыйМост5" },
  "СтарыйМост5": { location: "bruno_riddle", speaker: "Бруно", boxClass: "bruno", text: "— Церемонии — основа порядка в долине! Но ради праздника я не стану мучить вас тремя испытаниями. Одной загадки довольно. Слушайте: «Не имеет крыльев, а летает; не имеет голоса, а воет; в стужу жалит, в зной ласкает, а сожмёшь в кулак — исчезнет без следа».", choices: [{ text: "Ответить с уверенностью: «Это горный ветер!»", to: "МостВетер" }, { text: "Попробовать поэтический ответ: «Это лесное эхо»", to: "МостЭхо" }, { text: "Достать из сумки медовое сушёное яблоко и угостить Бруно", to: "МостУгощение" }, { text: "Расспросить Бруно: не видел ли он, что стряслось с башней ночью?", to: "МостРасспросы" }] },
  "МостВетер": { location: "bruno_wind", speaker: "Бруно", boxClass: "bruno", text: "Бруно хлопнул каменными крыльями, подняв облачко безвредной пыли: — В самую точку! Кому как не ученику Хранителя ветров знать повадки воздуха. Ты заслужил свободный проход!", next: "МостВетер2" },
  "МостВетер2": { location: "bruno_feather", speaker: "Бруно", boxClass: "bruno", text: "— Вот, держи. Это Перо Лазурной Сойки-Вестницы. Оно зачаровано на лёгкое дыхание. Если в механизмах башни застрянет пыль веков — взмахни им, и сквозняк сделает всю работу чисто и без поломок!", set: { "has_feather": true }, next: "МостСвободен" },
  "МостЭхо": { location: "bruno_awake", speaker: "Бруно", boxClass: "bruno", text: "Бруно басовито захохотал, сотрясая каменные перила: — Ох, молодёжь! Поэзии в тебе хоть отбавляй, а вот физика хромает! Разве эхо может ласкать в зной или жалить в стужу? Это ветер! Но за дерзость и красивый слог я не стану вас задерживать. И вот — держи подарок: Перо Лазурной Сойки. В башне оно разгонит пыль веков!", set: { "has_feather": true }, next: "МостСвободен" },
  "МостУгощение": { location: "bruno_apple", speaker: "Бруно", boxClass: "bruno", text: "Каменные ноздри гаргуля затрепетали: — О великие горы... Это то самое? С пасеки мастера Олвена?! Боги гранита, какая сладость! Забирайте мост, проходите скорее!", next: "МостУгощение2" },
  "МостУгощение2": { location: "bruno_crystal", speaker: "Бруно", boxClass: "bruno", text: "— И погодите... вот, возьмите! На днях с карниза маяка упал чистейший Кристалл Горного Кварца. Я подобрал, чтобы не растоптали. В оптике маяка ему самое место!", set: { "has_crystal": true }, next: "МостСвободен" },
  "МостРасспросы": { location: "bruno_clue", speaker: "Бруно", boxClass: "bruno", text: "— Хм-м... Около полуночи с вершины башни сорвался лёгкий серебристый всполох. А потом: динь-дон-хрясь! Будто музыкальная шкатулка поперхнулась желудем. Ветер тогда дул с Заброшенной Обсерватории.", set: { "has_clue": true }, next: "МостРасспросы2" },
  "МостРасспросы2": { location: "bruno_awake", speaker: "Мира", boxClass: "mira", text: "— Сквозняк мог сбить настройку балансира! Спасибо, дядюшка Бруно, это важная зацепка. Ну а загадку отгадывать будете?", choices: [{ text: "Ответить: «Это горный ветер!»", to: "МостВетер" }, { text: "Угостить Бруно медовым лакомством", to: "МостУгощение" }] },
  "МостСвободен": { location: "most_empty", speaker: "Мира", boxClass: "mira", text: "— Дорога свободна — идём к маяку!", next: "БашняСнаружи" },
  "ГрибнаяТропа": { location: "grib_tropa", speaker: "Рассказчик", boxClass: "narrator", text: "Грибная тропа встретила вас мягким сумраком древних дубов и прохладой. Под ногами ковром стелился изумрудный мох, а вдоль стволов мерцали фосфорные шляпки опят-фонариков.", next: "ГрибнаяТропа2" },
  "ГрибнаяТропа2": { location: "shustik_stuck", speaker: "Шустик", boxClass: "shustik", text: "— Ой-ой-ой! Беда-кручина! Скоро вечер, фестиваль без праздничных огней останется! Дерево уснуло и колесо зажало!", choices: [{ text: "Осторожно смазать корни травяным маслом", to: "ГрибыМасло" }, { text: "Предложить Мире использовать рычаг", to: "ГрибыМеханика" }, { text: "Заговорить с деревом на языке ветров и шёпотов", to: "ГрибыМагия" }] },
  "ГрибыМагия": { location: "shustik_magic", speaker: "Рассказчик", boxClass: "narrator", text: "Вы прикладываете ладонь к тёплой коре и тихо напеваете древний распев Верхнего Шепота. Корни мягко шевельнулись, потягиваясь, и тележка Шустика плавно высвободилась сама собой.", next: "ГрибыМагия2" },

/* ============ СИСТЕМА СПРАЙТОВ ============ */
const SpriteSystem = {
  heroEl: null, miraEl: null,
  heroTimer: null, miraTimer: null,
  heroBlinkTimer: null, miraBlinkTimer: null,
  heroTalking: false, miraTalking: false,

  init() {
    this.heroEl = document.getElementById('spriteHero');
    this.miraEl = document.getElementById('spriteMira');
    if (this.heroEl) this.heroEl.src = SPRITE_FRAMES.hero.idle;
    if (this.miraEl) this.miraEl.src = SPRITE_FRAMES.mira.idle;
    this.scheduleBlink('hero');
    this.scheduleBlink('mira');
  },

  show(character) {
    const el = character === 'hero' ? this.heroEl : this.miraEl;
    if (!el) return;
    el.classList.remove('hidden-sprite');
    el.classList.add('fade-in');
    setTimeout(() => el.classList.remove('fade-in'), 600);
  },

  hide(character) {
    const el = character === 'hero' ? this.heroEl : this.miraEl;
    if (!el) return;
    el.classList.add('fade-out');
    setTimeout(() => {
      el.classList.remove('fade-out');
      el.classList.add('hidden-sprite');
    }, 500);
  },

  hideAll() {
    this.hide('hero');
    this.hide('mira');
    this.stopTalking('hero');
    this.stopTalking('mira');
  },

  setActive(character) {
    if (this.heroEl) {
      this.heroEl.classList.toggle('active', character === 'hero');
      this.heroEl.classList.toggle('inactive', character !== 'hero');
    }
    if (this.miraEl) {
      this.miraEl.classList.toggle('active', character === 'mira');
      this.miraEl.classList.toggle('inactive', character !== 'mira');
    }
  },

  startTalking(character) {
    const el = character === 'hero' ? this.heroEl : this.miraEl;
    const frames = SPRITE_FRAMES[character].talk;
    if (!el || !frames) return;
    this.stopTalking(character);
    if (character === 'hero') this.heroTalking = true;
    else this.miraTalking = true;
    let i = 0;
    const interval = setInterval(() => {
      if (!(character === 'hero' ? this.heroTalking : this.miraTalking)) {
        clearInterval(interval);
        return;
      }
      el.src = frames[i];
      i = (i + 1) % frames.length;
    }, 150);
    if (character === 'hero') this.heroTimer = interval;
    else this.miraTimer = interval;
  },

  stopTalking(character) {
    if (character === 'hero') {
      this.heroTalking = false;
      if (this.heroTimer) { clearInterval(this.heroTimer); this.heroTimer = null; }
      if (this.heroEl) this.heroEl.src = SPRITE_FRAMES.hero.idle;
    } else {
      this.miraTalking = false;
      if (this.miraTimer) { clearInterval(this.miraTimer); this.miraTimer = null; }
      if (this.miraEl) this.miraEl.src = SPRITE_FRAMES.mira.idle;
    }
  },

  scheduleBlink(character) {
    const delay = 2000 + Math.random() * 2500;
    const timer = setTimeout(() => {
      this.blink(character);
      this.scheduleBlink(character);
    }, delay);
    if (character === 'hero') this.heroBlinkTimer = timer;
    else this.miraBlinkTimer = timer;
  },

  blink(character) {
    const el = character === 'hero' ? this.heroEl : this.miraEl;
    const frames = SPRITE_FRAMES[character].blink;
    if (!el || !frames) return;
    if (character === 'hero' ? this.heroTalking : this.miraTalking) return;
    let i = 0;
    const interval = setInterval(() => {
      if (i >= frames.length) {
        clearInterval(interval);
        if (!(character === 'hero' ? this.heroTalking : this.miraTalking)) {
          el.src = SPRITE_FRAMES[character].idle;
        }
        return;
      }
      el.src = frames[i++];
    }, 60);
  },

  /* FIX: этот метод отсутствовал — из-за него была ошибка в консоли */
  syncWithSpeaker(speakerName) {
    const name = (speakerName || '').toLowerCase();
    if (name.includes('вы') || name.includes('игрок') || name.includes('герой')) {
      this.show('hero');
      this.setActive('hero');
    } else if (name.includes('мира')) {
      this.show('mira');
      this.setActive('mira');
    }
  }
};

const SAVE_KEY = 'pesn_augusta_full_v1';

const gameState = {
  currentPassage: 'title',
  history: [], historyIndex: -1,
  variables: {},
  endings: {},
  achievements: {},
  settings: { textSpeed: 40, typewriter: 'on', sfx: 'on', musicVolume: 0.6 },
  isTyping: false, typewriterTimer: null
};

function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      currentPassage: gameState.currentPassage,
      history: gameState.history,
      historyIndex: gameState.historyIndex,
      variables: gameState.variables,
      endings: gameState.endings,
      achievements: gameState.achievements,
      settings: gameState.settings
    }));
  } catch (e) {}
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    gameState.currentPassage = s.currentPassage || 'title';
    gameState.history = s.history || [];
    gameState.historyIndex = typeof s.historyIndex === 'number' ? s.historyIndex : -1;
    gameState.variables = s.variables || {};
    gameState.endings = s.endings || {};
    gameState.achievements = s.achievements || {};
    if (s.settings) Object.assign(gameState.settings, s.settings);
    return true;
  } catch (e) { return false; }
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function resetAll() {
  gameState.currentPassage = 'title';
  gameState.history = [];
  gameState.historyIndex = -1;
  gameState.variables = {};
  gameState.endings = {};
  gameState.achievements = {};
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}

function has(k) { return !!gameState.variables[k]; }
function canDoMusic() { return has('has_feather'); }
function canDoNectar() { return has('has_selesta_vial') || has('has_pollen'); }
function canDoMechanics() { return has('has_crystal') || has('has_key'); }
function canDoUnity() { return canDoMusic() && canDoNectar() && canDoMechanics(); }

function missingMusic() { return has('has_feather') ? [] : ['🪶 Перо Лазурной Сойки (Бруно)']; }
function missingNectar() { return (has('has_selesta_vial') || has('has_pollen')) ? [] : ['🧪 Флакон Селесты или ✨ Пыльца Шустика']; }
function missingMechanics() { return (has('has_crystal') || has('has_key')) ? [] : ['💎 Кристалл или 🔑 Ключ']; }
function missingUnity() {
  const m = [];
  if (!canDoMusic()) m.push('🪶 Перо');
  if (!canDoNectar()) m.push('🧪 Флакон/✨ Пыльца');
  if (!canDoMechanics()) m.push('💎 Кристалл/🔑 Ключ');
  return m;
}
const NEED_CHECK = { music: [canDoMusic, missingMusic], nectar: [canDoNectar, missingNectar], mechanics: [canDoMechanics, missingMechanics], unity: [canDoUnity, missingUnity] };

const bgMusic = document.getElementById('bgMusic');
let musicStarted = false;
function startMusic() {
  if (musicStarted || !bgMusic) return;
  bgMusic.volume = gameState.settings.musicVolume;
  bgMusic.play().then(() => { musicStarted = true; }).catch(() => {
    const kick = () => {
      bgMusic.play().then(() => { musicStarted = true; document.removeEventListener('click', kick); }).catch(() => {});
    };
    document.addEventListener('click', kick);
  });
}

function playSFX(id) {
  if (gameState.settings.sfx !== 'on') return;
  const el = document.getElementById(id);
  if (!el) return;
  try {
    el.currentTime = 0;
    el.volume = 0.5;
    el.play().catch(() => {});
  } catch (e) {}
}
function sfxClick()       { playSFX('sfxClick'); }
function sfxAchievement() { playSFX('sfxAchievement'); }
function sfxItem()        { playSFX('sfxItem'); }
function sfxSelect()      { playSFX('sfxSelect'); }

let notifyTimer = null;
function showNotification(title, text, type) {
  const el = document.getElementById('notification');
  if (!el) return;
  el.innerHTML = `<b>${title}</b>${text}`;
  el.classList.toggle('warn', type === 'warn');
  el.classList.add('show');
  if (notifyTimer) clearTimeout(notifyTimer);
  notifyTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

let popupTimer = null;
function showItemPopup(key) {
  const data = ITEMS[key];
  if (!data) return;
  sfxItem();
  document.getElementById('popupIcon').textContent = data.icon;
  document.getElementById('popupName').textContent = data.name;
  document.getElementById('popupHint').textContent = data.hint;
  const p = document.getElementById('itemPopup');
  p.classList.add('show');
  if (popupTimer) clearTimeout(popupTimer);
  popupTimer = setTimeout(() => p.classList.remove('show'), 2500);
}

function unlockAchievement(key) {
  if (gameState.achievements[key]) return;
  gameState.achievements[key] = true;
  sfxAchievement();
  saveGame();
  const a = ACHIEVEMENTS[key];
  if (a) showNotification('🏆 Достижение', `${a.icon} ${a.title}`);
  const allFour = gameState.endings.melody && gameState.endings.abundance && gameState.endings.engineering && gameState.endings.unity;
  if (allFour && !gameState.achievements.allEndings) {
    gameState.achievements.allEndings = true;
    saveGame();
    setTimeout(() => showNotification('🏆 Достижение', '🏆 Все четыре концовки'), 3500);
  }
}

let bgSwapTimer = null;
function setBackground(locationKey) {
  const bg = document.getElementById('bgLayer');
  const url = LOCATION_BG[locationKey];
  const currentUrl = bg.style.backgroundImage;
  if (url && currentUrl && currentUrl.includes(url)) return;
  if (bgSwapTimer) { clearTimeout(bgSwapTimer); bgSwapTimer = null; }
  bg.style.opacity = '0';
  bgSwapTimer = setTimeout(() => {
    bg.style.backgroundImage = url ? `url("${url}")` : 'none';
    bg.style.animation = 'none';
    bg.style.transform = 'scale(1)';
    void bg.offsetWidth;
    bg.style.animation = '';
    bg.style.transform = '';
    bg.style.opacity = '1';
    bgSwapTimer = null;
  }, 500);
}

function preloadImages() {
  Object.values(LOCATION_BG).forEach(url => {
    if (!url) return;
    const img = new Image();
    img.src = url;
  });
  ['hero', 'mira'].forEach(ch => {
    Object.values(SPRITE_FRAMES[ch]).forEach(v => {
      const arr = Array.isArray(v) ? v : [v];
      arr.forEach(url => { const img = new Image(); img.src = url; });
    });
  });
}

function initParticles() {
  const layer = document.getElementById('particlesLayer');
  if (!layer) return;
  layer.innerHTML = '';
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.bottom = '-20px';
    p.style.animationDuration = (14 + Math.random() * 18) + 's';
    p.style.animationDelay = (Math.random() * 15) + 's';
    const scale = 0.5 + Math.random() * 1.4;
    p.style.width = (3 * scale) + 'px';
    p.style.height = (3 * scale) + 'px';
    layer.appendChild(p);
  }
}

function typeText(element, html, speed, callback) {
  const tokens = [];
  let i = 0;
  while (i < html.length) {
    if (html[i] === '<') {
      const end = html.indexOf('>', i);
      if (end === -1) { tokens.push(html[i]); i++; continue; }
      tokens.push(html.slice(i, end + 1));
      i = end + 1;
    } else { tokens.push(html[i]); i++; }
  }
  element.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'type-cursor';
  cursor.textContent = '▍';
  element.appendChild(cursor);

  let idx = 0;
  function step() {
    if (idx >= tokens.length) {
      cursor.remove();
      element.innerHTML = html;
      gameState.isTyping = false;
      SpriteSystem.stopTalking('hero');
      SpriteSystem.stopTalking('mira');
      if (callback) callback();
      return;
    }
    const t = tokens[idx++];
    cursor.insertAdjacentHTML('beforebegin', t);
    if (t.startsWith('<')) step();
    else gameState.typewriterTimer = setTimeout(step, speed);
  }
  step();
}

function advance() {
  sfxClick();
  const passage = PASSAGES[gameState.currentPassage];
  if (!passage || passage.isTitle) return;
  if (gameState.isTyping) {
    if (gameState.typewriterTimer) clearTimeout(gameState.typewriterTimer);
    const textEl = document.getElementById('dialogueText');
    if (textEl) textEl.innerHTML = passage.text || '';
    gameState.isTyping = false;
    SpriteSystem.stopTalking('hero');
    SpriteSystem.stopTalking('mira');
    return;
  }
  if (passage.choices && passage.choices.length > 0) return;
  if (passage.next) {
    if (passage.next === 'title') {
      gameState.history = []; gameState.historyIndex = -1;
      renderPassage('title', false);
    } else {
      renderPassage(passage.next);
    }
  }
}

function clearTitleElements() { document.querySelectorAll('.title-screen, .title-endings, .ending-screen').forEach(el => el.remove()); }
function clearDialogueElements() { document.querySelectorAll('.dialogue-box, .choice-box, .game-menu').forEach(el => el.remove()); }

const ITEM_ACH = { has_feather: 'feather', has_crystal: 'crystal', has_selesta_vial: 'vial', has_key: 'key', has_scheme: 'scheme', has_pollen: 'pollen' };

function renderPassage(id, addToHistory = true) {
  const passage = PASSAGES[id];
  if (!passage) return;
  if (gameState.typewriterTimer) clearTimeout(gameState.typewriterTimer);
  gameState.isTyping = false;
  gameState.currentPassage = id;

  if (passage.isTitle) { renderTitleScreen(); return; }
  clearTitleElements();

  if (passage.set) {
    const newItems = [];
    Object.keys(passage.set).forEach(k => {
      if (passage.set[k] && !gameState.variables[k]) newItems.push(k);
    });
    Object.assign(gameState.variables, passage.set);
    Object.entries(ITEM_ACH).forEach(([k, a]) => { if (passage.set[k]) unlockAchievement(a); });
    newItems.forEach((k, i) => { setTimeout(() => showItemPopup(k), 500 + i * 1200); });
  }

  if (passage.ending) {
    gameState.endings[passage.ending] = true;
    unlockAchievement(passage.ending);
    const allFour = gameState.endings.melody && gameState.endings.abundance && gameState.endings.engineering && gameState.endings.unity;
    if (allFour) unlockAchievement('allEndings');
    saveGame();
  }

  if (addToHistory) {
    gameState.history = gameState.history.slice(0, gameState.historyIndex + 1);
    gameState.history.push(id);
    gameState.historyIndex = gameState.history.length - 1;
  }

  saveGame();
  renderPassageInner(id, passage);
}

function renderPassageInner(id, passage) {
  clearTitleElements();
  clearDialogueElements();

  if (id === 'ГлавнаяПочинка' && !canDoMusic() && !canDoNectar() && !canDoMechanics()) {
    grantEmergencyItem();
  }

  setBackground(passage.location);

  const speakerName = (passage.speaker || '').toLowerCase();
  const isHeroOrMira = speakerName.includes('вы') 
                    || speakerName.includes('игрок')
                    || speakerName.includes('герой')
                    || speakerName.includes('мира')
                    || speakerName.includes('рассказчик')
                    || speakerName.includes('финал');

  if (isHeroOrMira) {
    SpriteSystem.syncWithSpeaker(passage.speaker);
  } else {
    SpriteSystem.hideAll();
  }

  let navHTML = '';
  if (passage.choices && passage.choices.length > 0) {
    navHTML = '<div class="choice-box">' + passage.choices.map(c => {
      let cls = '';
      let extra = '';
      if (c.need && NEED_CHECK[c.need]) {
        const [okFn, missFn] = NEED_CHECK[c.need];
        if (!okFn()) {
          cls = 'disabled';
          extra = `<span class="need">(нужно: ${missFn().join(', ')})</span>`;
        }
      }
      return `<a data-to="${c.to}" data-need="${c.need || ''}" class="${cls}"><span>${c.text}${extra}</span></a>`;
    }).join('') + '</div>';
  }

  const gameMenuHTML = `
    <div class="game-menu">
      <button id="btnJournal" title="Журнал">📖</button>
      <button id="btnGameAchievements" title="Достижения">🏆</button>
      <button id="btnMenu" title="В главное меню">🏠</button>
    </div>
  `;

  const boxClass = passage.boxClass || 'narrator';
  const speaker = passage.speaker || '';

  const boxHTML = `
    <div class="dialogue-box ${boxClass}">
      <div class="top-line"></div>
      ${speaker ? `<div class="speaker-name">${speaker}</div>` : ''}
      <div class="dialogue-text" id="dialogueText"></div>
      ${(!passage.choices || passage.choices.length === 0) && passage.next ? '<div class="next-hint">▼</div>' : ''}
    </div>
  `;

  const gameArea = document.getElementById('gameArea');
  gameArea.style.opacity = '1';
  gameArea.innerHTML = boxHTML + navHTML + gameMenuHTML;

  gameArea.querySelectorAll('[data-to]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      sfxSelect();
      if (btn.classList.contains('disabled')) {
        const need = btn.dataset.need;
        const missFn = NEED_CHECK[need] ? NEED_CHECK[need][1] : () => [];
        showNotification('⚠ Не хватает предметов', `Соберите: ${missFn().join(', ')}`, 'warn');
        return;
      }
      if (gameState.typewriterTimer) {
        clearTimeout(gameState.typewriterTimer);
        gameState.typewriterTimer = null;
      }
      gameState.isTyping = false;

      const to = btn.dataset.to;
      if (to === 'title') {
        gameState.history = [];
        gameState.historyIndex = -1;
        renderPassage('title', false);
      } else {
        gameState.history = gameState.history.slice(0, gameState.historyIndex + 1);
        renderPassage(to);
      }
    });
  });

  const dialogueBox = gameArea.querySelector('.dialogue-box');
  if (dialogueBox) {
    dialogueBox.addEventListener('click', (e) => {
      if (e.target.closest('[data-to]')) return;
      if (e.target.closest('.game-menu')) return;
      e.stopPropagation();
      advance();
    });
  }

  const journalBtn = document.getElementById('btnJournal');
  if (journalBtn) journalBtn.addEventListener('click', (e) => { e.stopPropagation(); openJournal(); });
  const achBtn = document.getElementById('btnGameAchievements');
  if (achBtn) achBtn.addEventListener('click', (e) => { e.stopPropagation(); openAchievements(); });
  const menuBtn = document.getElementById('btnMenu');
  if (menuBtn) menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (confirm('Вернуться в главное меню?')) {
      gameState.history = []; gameState.historyIndex = -1;
      renderPassage('title', false);
    }
  });

  updateHistoryButtons();

  const name = (speaker || '').toLowerCase();
  if (name.includes('вы') || name.includes('игрок') || name.includes('герой')) {
    SpriteSystem.startTalking('hero');
  } else if (name.includes('мира')) {
    SpriteSystem.startTalking('mira');
  }

  const textEl = document.getElementById('dialogueText');
  const text = passage.text || '';
  if (gameState.settings.typewriter === 'on') {
    gameState.isTyping = true;
    typeText(textEl, text, gameState.settings.textSpeed, () => { gameState.isTyping = false; });
  } else {
    textEl.innerHTML = text;
    SpriteSystem.stopTalking('hero');
    SpriteSystem.stopTalking('mira');
  }

  const clickLayer = document.getElementById('clickLayer');
  if (clickLayer) {
    if (passage.choices && passage.choices.length > 0) clickLayer.classList.remove('enabled');
    else clickLayer.classList.add('enabled');
  }

  if (passage.endingScreen) {
    setTimeout(() => showEndingScreen(passage.endingScreen), 1200);
  }
}

function grantEmergencyItem() {
  if (!has('has_selesta_vial') && !has('has_pollen')) {
    gameState.variables['has_selesta_vial'] = true;
    unlockAchievement('vial');
    setTimeout(() => showItemPopup('has_selesta_vial'), 800);
    setTimeout(() => showNotification('💡 Мира вспомнила',
      '— Ой! Бабушка Селеста передала тебе флакон ещё утром, я совсем забыла!'), 200);
    return;
  }
  if (!has('has_feather')) {
    gameState.variables['has_feather'] = true;
    unlockAchievement('feather');
    setTimeout(() => showItemPopup('has_feather'), 800);
    setTimeout(() => showNotification('💡 Олвен предусмотрел',
      '— В письме было завёрнуто перо Лазурной Сойки, я чуть не выбросила!'), 200);
    return;
  }
  if (!has('has_crystal') && !has('has_key')) {
    gameState.variables['has_crystal'] = true;
    unlockAchievement('crystal');
    setTimeout(() => showItemPopup('has_crystal'), 800);
    setTimeout(() => showNotification('💡 Мира нашла в сумке',
      '— А это что за камушек? Кристалл кварца! Точно пригодится!'), 200);
    return;
  }
}

function showEndingScreen(endingKey) {
  clearDialogueElements();
  clearTitleElements();
  SpriteSystem.hideAll();
  const clickLayer = document.getElementById('clickLayer');
  if (clickLayer) clickLayer.classList.remove('enabled');

  const data = {
    melody:      { title: 'Финал Мелодии и Добра',       subtitle: 'Чуткость и верный тон',          color: '#FFC960', bg: LOCATION_BG['ending_melody'] },
    abundance:   { title: 'Финал Заботы и Изобилия',     subtitle: 'Сытый дух — счастливая долина',  color: '#a8d49a', bg: LOCATION_BG['ending_abundance'] },
    engineering: { title: 'Финал Инженерного Чуда',       subtitle: 'Точный расчёт и крепкая дружба', color: '#7cc0ff', bg: LOCATION_BG['ending_engineering'] },
    unity:       { title: 'Финал Истинной Гармонии',     subtitle: 'Природа, наука и тепло сердец',  color: '#FFD700', bg: LOCATION_BG['final_star'] },
  }[endingKey] || { title: 'Финал', subtitle: '', color: '#FBBF24', bg: null };

  if (data.bg) {
    const bg = document.getElementById('bgLayer');
    bg.style.opacity = '0';
    setTimeout(() => {
      bg.style.backgroundImage = `url("${data.bg}")`;
      bg.style.animation = 'none';
      bg.style.transform = 'scale(1)';
      void bg.offsetWidth;
      bg.style.animation = '';
      bg.style.transform = '';
      bg.style.opacity = '1';
    }, 400);
  }

  const count = ['melody','abundance','engineering','unity'].filter(k => gameState.endings[k]).length;
  const allFour = count === 4;

  const gameArea = document.getElementById('gameArea');
  gameArea.style.opacity = '1';
  gameArea.innerHTML = '';

  const screen = document.createElement('div');
  screen.className = 'ending-screen';
  screen.innerHTML = `
    <div class="ending-frame">
      <div class="ending-corner tr"></div>
      <div class="ending-corner bl"></div>
      <div class="ending-label">✦ История завершена ✦</div>
      <h1 class="ending-title" style="color:${data.color};">${data.title}</h1>
      <p class="ending-subtitle">${data.subtitle}</p>
      <div class="ending-divider"></div>
      <p class="ending-desc">${
        endingKey === 'melody' ? 'Свет маяка снова озарил долину тёплым янтарным потоком.' :
        endingKey === 'abundance' ? 'Сытый дух — счастливая долина. Небо вспыхнуло изумрудом.' :
        endingKey === 'engineering' ? 'Лучи маяка начертили в небе гигантскую светящуюся звезду.' :
        endingKey === 'unity' ? 'Радужный луч озарил долину, вокруг башни кружат светлячки.' :
        'Праздник Осенней Звезды спасён.'
      }</p>
      <div class="ending-progress">🏆 Открыто концовок: <b>${count} / 4</b></div>
      <div class="ending-buttons">
        <button id="btnTryAgain" class="primary">🔄 Попробовать снова</button>
        <button id="btnOtherEnding2" ${allFour ? 'disabled' : ''}>🎭 Открыть другую концовку</button>
        <button id="btnToMenu2">🏠 В главное меню</button>
      </div>
    </div>
  `;
  gameArea.appendChild(screen);

  document.getElementById('btnTryAgain').addEventListener('click', () => {
    gameState.history = [];
    gameState.historyIndex = -1;
    renderPassage('ВыборПути3');
    showNotification('🔄 Новое прохождение',
      'Прогресс сохранён. Пройдите другой маршрут, чтобы открыть остальные финалы.');
  });

  document.getElementById('btnOtherEnding2').addEventListener('click', () => {
    if (allFour) return;
    gameState.history = [];
    gameState.historyIndex = -1;
    renderPassage('ВнутриБашни');
    const ready = [canDoMusic(), canDoNectar(), canDoMechanics(), canDoUnity()].filter(Boolean).length;
    if (ready < 4) {
      setTimeout(() => showNotification('💡 Подсказка',
        `Открыто финалов: ${ready}/4. Пройдите другие маршруты (мост / тропа / лавка), чтобы собрать предметы.`), 800);
    }
  });

  document.getElementById('btnToMenu2').addEventListener('click', () => {
    gameState.history = []; gameState.historyIndex = -1;
    renderPassage('title', false);
  });

}

function renderTitleScreen() {
  gameState.currentPassage = 'title';
  clearDialogueElements();
  clearTitleElements();
  SpriteSystem.hideAll();
  setBackground('title');

  const clickLayer = document.getElementById('clickLayer');
  if (clickLayer) clickLayer.classList.remove('enabled');

  const gameArea = document.getElementById('gameArea');
  const count = ['melody','abundance','engineering','unity'].filter(k => gameState.endings[k]).length;
  const canLoad = hasSave();

  gameArea.style.opacity = '1';
  gameArea.innerHTML = `
    <div class="title-screen">
      <div class="title-logo">
        <h1 class="title-main">Песнь Августа</h1>
        <p class="title-sub">Интерактивная сказка</p>
      </div>
      <div class="title-menu">
        <button id="btnStart">▶ Начать историю</button>
        <button id="btnLoad" ${canLoad ? '' : 'disabled'}>📂 Продолжить</button>
        <button id="btnTitleAchievements" ${canLoad ? '' : 'disabled'}>🏆 Достижения</button>
        <button id="btnReset" ${canLoad ? '' : 'disabled'}>🗑 Сбросить прогресс</button>
      </div>
      <p class="title-footer">Верхний Шепот · Праздник Осенней Звезды</p>
    </div>
    <div class="title-endings">🏆 Концовок открыто: <b>${count} / 4</b></div>
  `;

  document.getElementById('btnStart').addEventListener('click', () => { resetAll(); renderPassage('Start1'); });
  document.getElementById('btnLoad').addEventListener('click', () => {
    if (loadGame()) {
      clearTitleElements();
      const target = gameState.currentPassage === 'title' ? 'Start1' : gameState.currentPassage;
      renderPassage(target, false);
    }
  });
  document.getElementById('btnTitleAchievements').addEventListener('click', openAchievements);
  document.getElementById('btnReset').addEventListener('click', () => {
    if (confirm('Сбросить весь прогресс?')) { resetAll(); renderTitleScreen(); }
  });
  updateHistoryButtons();
}

function updateHistoryButtons() {
  const back = document.getElementById('btnBack');
  const fwd = document.getElementById('btnForward');
  const controls = document.getElementById('historyControls');
  if (gameState.currentPassage === 'title') { controls.style.display = 'none'; return; }
  controls.style.display = 'flex';
  back.disabled = gameState.historyIndex <= 0;
  fwd.disabled = gameState.historyIndex >= gameState.history.length - 1;
}
function goBack() {
  if (gameState.historyIndex <= 0) return;
  if (gameState.typewriterTimer) { clearTimeout(gameState.typewriterTimer); gameState.typewriterTimer = null; }
  gameState.isTyping = false;
  SpriteSystem.stopTalking('hero');
  SpriteSystem.stopTalking('mira');
  gameState.historyIndex--;
  renderPassage(gameState.history[gameState.historyIndex], false);
}
function goForward() {
  if (gameState.historyIndex >= gameState.history.length - 1) return;
  if (gameState.typewriterTimer) { clearTimeout(gameState.typewriterTimer); gameState.typewriterTimer = null; }
  gameState.isTyping = false;
  SpriteSystem.stopTalking('hero');
  SpriteSystem.stopTalking('mira');
  gameState.historyIndex++;
  renderPassage(gameState.history[gameState.historyIndex], false);
}

function openJournal() {
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  let html = '<h2>📖 Журнал</h2>';
  html += '<h3>Предметы</h3>';
  const allKeys = Object.keys(ITEMS);
  const owned = allKeys.filter(k => has(k));
  if (owned.length === 0) {
    html += '<p style="color:#888;font-style:italic;">Пока ничего не найдено</p>';
  } else {
    owned.forEach(k => {
      const it = ITEMS[k];
      html += `<div class="item-row">
        <div class="item-icon">${it.icon}</div>
        <div class="item-info">
          <div class="item-name">${it.name}</div>
          <div class="item-hint">${it.hint}</div>
        </div>
      </div>`;
    });
  }

  html += '<h3>Доступные финалы</h3>';
  const rows = [
    ['🎵 Финал Мелодии и Добра', canDoMusic(), missingMusic()],
    ['🌿 Финал Заботы и Изобилия', canDoNectar(), missingNectar()],
    ['⚙ Финал Инженерного Чуда', canDoMechanics(), missingMechanics()],
    ['👑 Финал Истинной Гармонии', canDoUnity(), missingUnity()],
  ];
  rows.forEach(([label, ready, missing]) => {
    html += `<div class="ending-status ${ready?'ready':'locked'}">
      <div>${ready?'✅':'🔒'} ${label}</div>
      ${ready ? '' : `<div class="status-need">Нужно: ${missing.join(', ')}</div>`}
    </div>`;
  });

  html += '<div class="buttons"><button id="journalClose">Закрыть</button></div>';
  content.innerHTML = html;
  overlay.classList.remove('hidden');
  document.getElementById('journalClose').addEventListener('click', () => overlay.classList.add('hidden'));
}

function openAchievements() {
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  let html = '<h2>🏆 Достижения</h2><div class="ach-list">';
  Object.entries(ACHIEVEMENTS).forEach(([k, a]) => {
    const got = !!gameState.achievements[k];
    html += `<div class="ach ${got?'':'locked'}">
      <div class="icon">${got?a.icon:'🔒'}</div>
      <div class="info">
        <div class="title">${a.title}</div>
        <div class="desc">${a.desc}</div>
      </div>
    </div>`;
  });
  html += '</div><div class="buttons"><button id="achClose">Закрыть</button></div>';
  content.innerHTML = html;
  overlay.classList.remove('hidden');
  document.getElementById('achClose').addEventListener('click', () => overlay.classList.remove('hidden'));
}

function init() {
  loadGame();
  startMusic();
  initParticles();
  preloadImages();
  SpriteSystem.init();

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('button, .history-btn');
    if (btn && !btn.disabled && !btn.classList.contains('disabled')) {
      playSFX('sfxClick');
    }
  }, true);

  document.getElementById('btnBack').addEventListener('click', goBack);
  document.getElementById('btnForward').addEventListener('click', goForward);

  const clickLayerEl = document.getElementById('clickLayer');
  if (clickLayerEl) clickLayerEl.addEventListener('click', advance);

  document.addEventListener('keydown', ev => {
    const tag = (ev.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); goBack(); }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); goForward(); }
    else if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); advance(); }
    else if (ev.key === 'Escape') {
      const overlay = document.getElementById('modalOverlay');
      if (!overlay.classList.contains('hidden')) overlay.classList.add('hidden');
    }
  });

  document.getElementById('modalOverlay').addEventListener('click', ev => {
    if (ev.target.id === 'modalOverlay') ev.target.classList.add('hidden');
  });

  setTimeout(() => {
    const loading = document.getElementById('loadingScreen');
    if (loading) loading.classList.add('hidden');
  }, 700);

  renderTitleScreen();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
