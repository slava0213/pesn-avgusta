<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Песнь Августа</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: 'Georgia', 'Times New Roman', serif;
  background: #0a0a14; color: #eee;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.bg-layer {
  position: fixed; inset: 0;
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-color: #0a0a14;
  z-index: 1; pointer-events: none;
  opacity: 1;
  transition: opacity 0.8s ease-in-out;
  will-change: opacity, transform;
  animation: kenBurns 28s ease-in-out infinite alternate;
}
@keyframes kenBurns {
  0%   { transform: scale(1)    translate(0, 0); }
  100% { transform: scale(1.08) translate(-1.2%, -1%); }
}
.particles-layer {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 3;
  overflow: hidden;
}
.particle {
  position: absolute;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,220,120,1) 0%, rgba(255,180,50,0.6) 40%, transparent 70%);
  box-shadow: 0 0 8px rgba(255,200,80,0.9), 0 0 16px rgba(255,180,50,0.5);
  opacity: 0;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0%   { transform: translateY(0) translateX(0) scale(0.6); opacity: 0; }
  10%  { opacity: 0.85; }
  90%  { opacity: 0.65; }
  100% { transform: translateY(-110vh) translateX(40px) scale(1.1); opacity: 0; }
}
.insert-layer {
  position: fixed; inset: 0;
  z-index: 80;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.7s ease, visibility 0.7s ease;
  background-color: #000;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  transform: scale(1);
}
.insert-layer.active {
  opacity: 1;
  visibility: visible;
  animation: insertZoom 6s ease-out forwards;
}
@keyframes insertZoom {
  from { transform: scale(1); }
  to   { transform: scale(1.06); }
}
.vignette-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 4;
  background:
    radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,0.7) 100%),
    linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 25%, transparent 65%, rgba(0,0,0,0.7) 100%);
}
.loading-screen {
  position: fixed; inset: 0; z-index: 5000;
  background: radial-gradient(ellipse at center, #14101e 0%, #0a0a14 100%);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 24px;
  transition: opacity 0.8s ease;
}
.loading-screen.hidden { opacity: 0; pointer-events: none; }
.loading-spinner {
  width: 72px; height: 72px;
  border: 3px solid rgba(251,191,36,0.12);
  border-top-color: #FBBF24;
  border-right-color: rgba(251,191,36,0.5);
  border-radius: 50%;
  animation: spin 1.1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
  box-shadow: 0 0 40px rgba(251,191,36,0.35), inset 0 0 20px rgba(251,191,36,0.15);
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  color: #FBBF24; font-size: 14px;
  letter-spacing: 6px; text-transform: uppercase;
  animation: pulse 1.8s ease-in-out infinite;
  text-shadow: 0 0 16px rgba(251,191,36,0.7);
}
@keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

.click-layer {
  position: fixed; inset: 0; z-index: 90;
  background: transparent; cursor: pointer; display: none;
}
.click-layer.enabled { display: block; }

.dialogue-box {
  position: fixed; left: 50%; bottom: 3vh;
  transform: translateX(-50%);
  width: min(1240px, 94vw);
  max-height: 34vh;
  background: linear-gradient(180deg, rgba(28,22,14,0.92) 0%, rgba(14,10,6,0.97) 100%);
  border: 1px solid rgba(244,197,66,0.6);
  border-radius: 4px;
  box-shadow:
    0 -40px 80px rgba(0,0,0,0.7),
    0 24px 70px rgba(0,0,0,0.8),
    0 0 0 1px rgba(0,0,0,0.7),
    0 0 60px rgba(255,200,80,0.1),
    inset 0 1px 0 rgba(255,255,255,0.08),
    inset 0 0 80px rgba(255,180,50,0.04);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  z-index: 100;
  display: flex; flex-direction: column;
  animation: dialogueIn 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  overflow: visible; cursor: pointer;
}
.dialogue-box::before, .dialogue-box::after {
  content: ''; position: absolute;
  width: 28px; height: 28px;
  border: 2px solid rgba(244,197,66,0.85);
  pointer-events: none; z-index: 3;
}
.dialogue-box::before {
  top: -2px; left: -2px;
  border-right: none; border-bottom: none;
  border-radius: 4px 0 0 0;
  box-shadow: -2px -2px 12px rgba(255,200,80,0.3);
}
.dialogue-box::after {
  bottom: -2px; right: -2px;
  border-left: none; border-top: none;
  border-radius: 0 0 4px 0;
  box-shadow: 2px 2px 12px rgba(255,200,80,0.3);
}
.dialogue-box .top-line {
  position: absolute; top: -1px; left: 15%; right: 15%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,220,120,0.9), transparent);
  pointer-events: none; z-index: 3;
}
@keyframes dialogueIn {
  from { opacity: 0; transform: translateX(-50%) translateY(40px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.speaker-name {
  position: absolute; top: -26px; left: 34px;
  min-width: 150px; max-width: 360px;
  padding: 10px 26px 9px;
  background: linear-gradient(180deg, rgba(217,119,6,1) 0%, rgba(160,75,10,1) 100%);
  color: #FFF8E7;
  font-size: clamp(14px, 1.2vw, 18px);
  font-weight: bold; border-radius: 3px;
  border: 1px solid rgba(244,197,66,0.95);
  box-shadow:
    0 10px 28px rgba(0,0,0,0.7),
    0 0 24px rgba(255,180,50,0.35),
    inset 0 1px 0 rgba(255,255,255,0.3),
    inset 0 -6px 12px rgba(0,0,0,0.25);
  text-shadow: 1px 1px 4px rgba(0,0,0,0.85);
  letter-spacing: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  z-index: 4;
}
.speaker-name::after {
  content: ''; position: absolute;
  bottom: -6px; left: 22px;
  width: 0; height: 0;
  border-left: 7px solid transparent;
  border-right: 7px solid transparent;
  border-top: 7px solid rgba(160,75,10,1);
  filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
}
.dialogue-text {
  width: 100%; flex: 1;
  min-height: 13vh; max-height: 26vh;
  color: #f5ecd7;
  font-size: clamp(15px, 1.2vw, 19px);
  line-height: 1.85;
  text-shadow: 0 1px 3px rgba(0,0,0,0.95);
  padding: 34px 44px 30px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #FBBF24 rgba(255,243,196,0.1);
  letter-spacing: 0.2px;
}
.dialogue-text b { color: #FFE9A8; font-weight: bold; }
.dialogue-text i { color: #d8c9a8; font-style: italic; }
.dialogue-text em { color: #FFE9A8; font-style: italic; }
.type-cursor {
  display: inline-block; color: #FFD700;
  animation: cursorBlink 0.8s steps(2, start) infinite;
  font-weight: bold; margin-left: 2px;
  text-shadow: 0 0 10px rgba(255,215,0,0.95);
}
@keyframes cursorBlink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
.next-hint {
  position: absolute; right: 26px; bottom: 16px;
  color: #FFD700;
  font-size: clamp(18px, 1.5vw, 24px);
  opacity: 0.85;
  animation: nextPulse 1.5s ease-in-out infinite;
  pointer-events: none;
  text-shadow: 0 0 14px rgba(255,215,0,0.9);
}
@keyframes nextPulse {
  0%,100% { transform: translateY(0); opacity: 0.4; }
  50%     { transform: translateY(6px); opacity: 1; }
}
.dialogue-box.narrator { border-color: rgba(200,160,80,0.55); }
.dialogue-box.narrator .speaker-name { background: linear-gradient(180deg, rgba(180,130,40,1) 0%, rgba(130,90,25,1) 100%); }
.dialogue-box.narrator .speaker-name::after { border-top-color: rgba(130,90,25,1); }
.dialogue-box.mira { border-color: rgba(230,126,34,0.85); box-shadow: 0 -40px 80px rgba(0,0,0,0.7), 0 24px 70px rgba(0,0,0,0.8), 0 0 60px rgba(230,126,34,0.2), inset 0 1px 0 rgba(255,255,255,0.08); }
.dialogue-box.mira .speaker-name { background: linear-gradient(180deg, rgba(230,126,34,1) 0%, rgba(190,90,15,1) 100%); }
.dialogue-box.mira .speaker-name::after { border-top-color: rgba(190,90,15,1); }
.dialogue-box.bruno { border-color: rgba(170,170,170,0.8); }
.dialogue-box.bruno .speaker-name { background: linear-gradient(180deg, rgba(120,120,120,1) 0%, rgba(70,70,70,1) 100%); color: #F5F5F5; }
.dialogue-box.bruno .speaker-name::after { border-top-color: rgba(70,70,70,1); }
.dialogue-box.selesta { border-color: rgba(160,120,210,0.85); }
.dialogue-box.selesta .speaker-name { background: linear-gradient(180deg, rgba(130,90,180,1) 0%, rgba(95,65,135,1) 100%); }
.dialogue-box.selesta .speaker-name::after { border-top-color: rgba(95,65,135,1); }
.dialogue-box.cornelius { border-color: rgba(80,120,210,0.85); }
.dialogue-box.cornelius .speaker-name { background: linear-gradient(180deg, rgba(60,100,180,1) 0%, rgba(35,65,135,1) 100%); }
.dialogue-box.cornelius .speaker-name::after { border-top-color: rgba(35,65,135,1); }
.dialogue-box.olven { border-style: dashed; border-color: rgba(170,130,70,0.9); background: linear-gradient(180deg, rgba(50,38,22,0.94) 0%, rgba(28,20,10,0.97) 100%); }
.dialogue-box.olven .speaker-name { background: linear-gradient(180deg, rgba(150,110,55,1) 0%, rgba(100,70,30,1) 100%); }
.dialogue-box.olven .speaker-name::after { border-top-color: rgba(100,70,30,1); }
.dialogue-box.olven .dialogue-text { font-style: italic; color: #f0e3c8; }
.dialogue-box.player { border-color: rgba(100,200,255,0.85); }
.dialogue-box.player .speaker-name { background: linear-gradient(180deg, rgba(60,140,200,1) 0%, rgba(35,90,150,1) 100%); color: #F0F8FF; }
.dialogue-box.player .speaker-name::after { border-top-color: rgba(35,90,150,1); }
.dialogue-box.final-box {
  border-color: rgba(255,215,0,1);
  box-shadow:
    0 -40px 80px rgba(0,0,0,0.7),
    0 24px 70px rgba(0,0,0,0.8),
    0 0 80px rgba(255,215,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.15);
}
.dialogue-box.final-box .speaker-name { background: linear-gradient(180deg, rgba(255,215,0,1) 0%, rgba(200,150,20,1) 100%); color: #2A1500; }
.dialogue-box.final-box .speaker-name::after { border-top-color: rgba(200,150,20,1); }
/* 🎭 3-я концовка — зелёный стиль */
.dialogue-box.final-nature {
  border-color: rgba(139,171,122,1);
  box-shadow:
    0 -40px 80px rgba(0,0,0,0.7),
    0 24px 70px rgba(0,0,0,0.8),
    0 0 80px rgba(139,171,122,0.5),
    inset 0 1px 0 rgba(255,255,255,0.15);
}
.dialogue-box.final-nature .speaker-name { background: linear-gradient(180deg, rgba(139,171,122,1) 0%, rgba(90,120,80,1) 100%); color: #1a2410; }
.dialogue-box.final-nature .speaker-name::after { border-top-color: rgba(90,120,80,1); }

.choice-box {
  position: fixed; left: 50%; bottom: 40vh;
  transform: translateX(-50%); z-index: 101;
  display: flex; flex-direction: column; gap: 14px;
  width: min(780px, 88vw);
  animation: choicesIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.2s backwards;
}
@keyframes choicesIn {
  from { opacity: 0; transform: translateX(-50%) translateY(24px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.choice-box a {
  position: relative;
  width: 100%; display: block; text-align: left;
  padding: 16px 26px 16px 60px;
  background: linear-gradient(180deg, rgba(28,22,14,0.94) 0%, rgba(14,10,6,0.97) 100%);
  color: #F5ECD7;
  border: 1px solid rgba(244,197,66,0.5);
  border-radius: 4px;
  text-decoration: none;
  font-size: clamp(13px, 1.05vw, 16px);
  font-weight: normal;
  line-height: 1.4;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 8px 24px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
  letter-spacing: 0.4px; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.choice-box a::before {
  content: '▸'; position: absolute;
  left: 22px; top: 50%;
  transform: translateY(-50%);
  color: #FBBF24; font-size: 18px;
  transition: all 0.3s ease;
  text-shadow: 0 0 10px rgba(255,200,80,0.7);
}
.choice-box a::after {
  content: ''; position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,200,80,0.15), transparent);
  transition: left 0.6s ease;
  pointer-events: none;
}
.choice-box a:hover::after { left: 100%; }
.choice-box a > span { position: relative; z-index: 1; }
.choice-box a:hover:not(.disabled) {
  background: linear-gradient(180deg, rgba(244,197,66,0.18) 0%, rgba(180,120,20,0.12) 100%);
  border-color: rgba(244,197,66,0.95);
  color: #FFF8E7;
  transform: translateX(6px);
  box-shadow:
    0 14px 38px rgba(0,0,0,0.7),
    0 0 30px rgba(255,200,80,0.3),
    inset 0 1px 0 rgba(255,255,255,0.12);
}
.choice-box a:hover:not(.disabled)::before { color: #FFD700; transform: translateY(-50%) translateX(4px); text-shadow: 0 0 16px rgba(255,215,0,1); }
.choice-box a:active:not(.disabled) { transform: translateX(6px) scale(0.995); }
.choice-box a.disabled { opacity: 0.45; cursor: not-allowed; border-style: dashed; }
.choice-box a.disabled::before { content: '🔒'; color: #888; text-shadow: none; font-size: 16px; }
.choice-box a .need { color: #e07b39; font-size: 0.85em; font-style: italic; margin-left: 0.3em; }

.history-controls {
  position: fixed; top: 18px; left: 18px;
  display: flex; gap: 12px; z-index: 300;
  pointer-events: auto;
}
.history-btn {
  width: 50px; height: 50px;
  border-radius: 50%;
  border: 1px solid rgba(244,197,66,0.7);
  background: linear-gradient(180deg, rgba(28,22,14,0.9) 0%, rgba(14,10,6,0.95) 100%);
  color: #FBBF24;
  font-size: 22px; font-weight: bold;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 6px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
  user-select: none;
  font-family: 'Georgia', serif;
  padding: 0;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  -webkit-tap-highlight-color: transparent;
}
.history-btn:hover:not(:disabled) {
  transform: translateY(-3px) scale(1.08);
  box-shadow: 0 12px 30px rgba(0,0,0,0.7), 0 0 24px rgba(255,200,80,0.5);
  border-color: rgba(244,197,66,1);
  color: #FFD700;
}
.history-btn:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(0.8); }

.game-menu {
  position: fixed; top: 18px; right: 18px;
  display: flex; gap: 12px; z-index: 300;
}
.game-menu button {
  position: relative;
  width: 50px; height: 50px;
  border-radius: 50%;
  border: 1px solid rgba(244,197,66,0.7);
  background: linear-gradient(180deg, rgba(28,22,14,0.9) 0%, rgba(14,10,6,0.95) 100%);
  color: #FBBF24;
  font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 6px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
  padding: 0; overflow: hidden;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  -webkit-tap-highlight-color: transparent;
}
.game-menu button:hover {
  transform: translateY(-3px) scale(1.08);
  box-shadow: 0 12px 30px rgba(0,0,0,0.7), 0 0 24px rgba(255,200,80,0.5);
  border-color: rgba(244,197,66,1);
  color: #FFD700;
}

.notification {
  position: fixed; top: 90px; right: 24px;
  background: linear-gradient(180deg, rgba(217,119,6,0.97) 0%, rgba(160,75,10,0.97) 100%);
  color: #FFF8E7;
  padding: 16px 26px 16px 30px;
  border: 1px solid rgba(244,197,66,0.9);
  border-left: 4px solid #FBBF24;
  border-radius: 6px;
  box-shadow:
    0 14px 40px rgba(0,0,0,0.7),
    0 0 30px rgba(255,180,50,0.4),
    inset 0 1px 0 rgba(255,255,255,0.25);
  font-size: 14px;
  z-index: 400;
  opacity: 0;
  transform: translateX(80px);
  transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
  max-width: 340px;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.notification.show { opacity: 1; transform: translateX(0); }
.notification b {
  color: #FFE9A8; display: block; margin-bottom: 5px;
  font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
}
.notification.warn {
  background: linear-gradient(180deg, rgba(180,60,30,0.97) 0%, rgba(120,30,10,0.97) 100%);
  border-left-color: #F87171;
  border-color: rgba(248,113,113,0.9);
}
.notification.warn b { color: #FECACA; }

.item-popup {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.85);
  z-index: 450;
  background: linear-gradient(180deg, rgba(28,22,14,0.97) 0%, rgba(14,10,6,0.99) 100%);
  border: 2px solid rgba(244,197,66,0.95);
  border-radius: 10px;
  padding: 26px 40px;
  text-align: center;
  box-shadow:
    0 30px 80px rgba(0,0,0,0.85),
    0 0 60px rgba(255,200,80,0.5),
    inset 0 1px 0 rgba(255,255,255,0.15);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.item-popup.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.item-popup .popup-icon {
  font-size: 52px; margin-bottom: 10px;
  filter: drop-shadow(0 0 20px rgba(255,200,80,0.9));
}
.item-popup .popup-label {
  color: #FBBF24; font-size: 11px; letter-spacing: 3px;
  text-transform: uppercase; margin-bottom: 8px;
}
.item-popup .popup-name {
  color: #FFF8E7; font-size: 20px; font-weight: bold;
  letter-spacing: 1px; text-shadow: 0 0 14px rgba(255,220,100,0.7);
}
.item-popup .popup-hint {
  color: #d8c9a8; font-size: 13px; font-style: italic;
  margin-top: 10px; max-width: 320px;
}

.title-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: space-between;
  padding: 8vh 20px 6vh; z-index: 200;
  background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.15) 30%, rgba(0,0,0,0.3) 65%, rgba(0,0,0,0.85) 100%);
}
.title-logo { text-align: center; animation: titleFadeIn 1.3s ease-out; }
@keyframes titleFadeIn {
  from { opacity: 0; transform: translateY(-30px); }
  to   { opacity: 1; transform: translateY(0); }
}
.title-main {
  font-size: clamp(38px, 6vw, 76px);
  color: #FFF8E7;
  text-shadow:
    -3px -3px 0 #8B4513, 3px -3px 0 #8B4513,
    -3px 3px 0 #8B4513, 3px 3px 0 #8B4513,
     0 0 40px rgba(255, 220, 100, 1),
     0 0 80px rgba(255, 180, 50, 0.7),
     6px 6px 30px rgba(0, 0, 0, 0.9);
  letter-spacing: 8px; margin: 0; font-weight: bold;
  animation: titleGlow 3.6s ease-in-out infinite;
}
@keyframes titleGlow {
  0%,100% {
    text-shadow:
      -3px -3px 0 #8B4513, 3px -3px 0 #8B4513,
      -3px 3px 0 #8B4513, 3px 3px 0 #8B4513,
      0 0 40px rgba(255,220,100,1),
      0 0 80px rgba(255,180,50,0.7),
      6px 6px 30px rgba(0,0,0,0.9);
  }
  50% {
    text-shadow:

.cutscene-frame {

.cutscene-progress {

const SAVE_KEY = 'pesn_augusta_hybrid_v2';

const gameState = {
  currentPassage: 'title',
  history: [], historyIndex: -1,
  variables: {},
  endings: {},
  achievements: {},
  settings: { textSpeed: 40, typewriter: 'on', sfx: 'on', musicVolume: 0.6 },
  isTyping: false, typewriterTimer: null
};

function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      currentPassage: gameState.currentPassage,
      history: gameState.history,
      historyIndex: gameState.historyIndex,
      variables: gameState.variables,
      endings: gameState.endings,
      achievements: gameState.achievements,
      settings: gameState.settings
    }));
  } catch (e) {}
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    gameState.currentPassage = s.currentPassage || 'title';
    gameState.history = s.history || [];
    gameState.historyIndex = typeof s.historyIndex === 'number' ? s.historyIndex : -1;
    gameState.variables = s.variables || {};
    gameState.endings = s.endings || {};
    gameState.achievements = s.achievements || {};
    if (s.settings) Object.assign(gameState.settings, s.settings);
    return true;
  } catch (e) { return false; }
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function resetAll() {
  gameState.currentPassage = 'title';
  gameState.history = [];
  gameState.historyIndex = -1;
  gameState.variables = {};
  gameState.endings = {};
  gameState.achievements = {};
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}

/* ============================================================

   ============================================================ */
function has(k) { return !!gameState.variables[k]; }

/* ✨ Гармония — всё вместе: флакон + схема */
function canDoHarmony() { return has('has_selesta_vial') && has('has_scheme'); }
/* ⚙ Мастерство — инженерия: ключ или кристалл */
function canDoMastery() { return has('has_key') || has('has_crystal'); }
/* 🌿 Изобилие — забота: флакон (в идеале ещё и перо как «тепло природы») */
function canDoNature() { return has('has_selesta_vial') || has('has_feather'); }

function missingHarmony() {
  const m = [];
  if (!has('has_selesta_vial')) m.push('🧪 Флакон Селесты');
  if (!has('has_scheme')) m.push('📜 Схема Олвена');
  return m;
}
function missingMastery() {
  const m = [];
  if (!has('has_key') && !has('has_crystal')) m.push('🔑 Ключ или 💎 Кристалл');
  return m;
}
function missingNature() {
  const m = [];
  if (!has('has_selesta_vial') && !has('has_feather')) {
    m.push('🧪 Флакон Селесты или 🪶 Перо Сойки');
  }
  return m;
}

/* ============================================================
   ПЕЧАТАЮЩИЙСЯ ТЕКСТ
   ============================================================ */
function typeText(element, html, speed, callback) {
  const tokens = [];
  let i = 0;
  while (i < html.length) {
    if (html[i] === '<') {
      const end = html.indexOf('>', i);
      if (end === -1) { tokens.push(html[i]); i++; continue; }
      tokens.push(html.slice(i, end + 1));
      i = end + 1;
    } else { tokens.push(html[i]); i++; }
  }
  element.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'type-cursor';
  cursor.textContent = '▍';
  element.appendChild(cursor);

  let idx = 0;
  function step() {
    if (idx >= tokens.length) {
      cursor.remove();
      element.innerHTML = html;
      gameState.isTyping = false;
      if (callback) callback();
      return;
    }
    const t = tokens[idx++];
    cursor.insertAdjacentHTML('beforebegin', t);
    if (t.startsWith('<')) step();
    else gameState.typewriterTimer = setTimeout(step, speed);
  }
  step();
}

/* ============================================================
   КАТСЦЕНЫ
   ============================================================ */
const CutscenePlayer = {
  current: null, frameIndex: 0, timer: null, onFinish: null,
  play(sceneKey, onFinish) {
    const scene = CUTSCENES[sceneKey];
    if (!scene || !scene.frames || scene.frames.length === 0) { if (onFinish) onFinish(); return; }
    this.current = scene;
    this.frameIndex = 0;
    this.onFinish = onFinish;
    const layer = document.getElementById('cutsceneLayer');
    layer.classList.add('active');
    const firstFrame = scene.frames[0];
    document.getElementById('csFrameCurrent').style.backgroundImage = `url("${firstFrame.img}")`;
    document.getElementById('csFrameNext').style.backgroundImage = '';
    setTimeout(() => this.showFrame(1), firstFrame.duration);
  },
  showFrame(index) {
    if (!this.current || index >= this.current.frames.length) { this.finish(); return; }
    this.frameIndex = index;
    const frame = this.current.frames[index];
    const nextEl = document.getElementById('csFrameNext');
    nextEl.style.backgroundImage = `url("${frame.img}")`;
    nextEl.style.opacity = '1';
    setTimeout(() => {
      document.getElementById('csFrameCurrent').style.backgroundImage = `url("${frame.img}")`;
      nextEl.style.opacity = '0';
    }, 700);
    this.timer = setTimeout(() => this.showFrame(index + 1), frame.duration);
  },
  finish() {
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
    document.getElementById('cutsceneLayer').classList.remove('active');
    const cb = this.onFinish;
    this.current = null; this.onFinish = null;
    setTimeout(() => {
      document.getElementById('csFrameCurrent').style.backgroundImage = '';
      document.getElementById('csFrameNext').style.backgroundImage = '';
      if (cb) cb();
    }, 700);
  }
};

/* ============================================================
   ПЕРЕХОДЫ
   ============================================================ */
function advance() {
  const passage = PASSAGES[gameState.currentPassage];
  if (!passage || passage.isTitle) return;
  if (gameState.isTyping) {
    if (gameState.typewriterTimer) clearTimeout(gameState.typewriterTimer);
    const textEl = document.getElementById('dialogueText');
    if (textEl) textEl.innerHTML = passage.text || '';
    gameState.isTyping = false;
    return;
  }
  if (passage.choices && passage.choices.length > 0) return;
  if (passage.next) {
    if (passage.next === 'title') {
      gameState.history = []; gameState.historyIndex = -1;
      renderPassage('title', false);
    } else {
      renderPassage(passage.next);
    }
  }
}

function clearTitleElements() {
  document.querySelectorAll('.title-screen, .title-endings').forEach(el => el.remove());
}
function clearDialogueElements() {
  document.querySelectorAll('.dialogue-box, .choice-box, .game-menu').forEach(el => el.remove());
}

function renderPassage(id, addToHistory = true) {
  const passage = PASSAGES[id];
  if (!passage) return;
  if (gameState.typewriterTimer) clearTimeout(gameState.typewriterTimer);
  gameState.isTyping = false;
  gameState.currentPassage = id;

  if (passage.isTitle) { renderTitleScreen(); return; }
  clearTitleElements();

  if (passage.set) {
    const newItems = [];
    Object.keys(passage.set).forEach(k => {
      if (passage.set[k] && !gameState.variables[k]) newItems.push(k);
    });
    Object.assign(gameState.variables, passage.set);

    const itemAch = {
      has_feather: 'feather', has_crystal: 'crystal',
      has_selesta_vial: 'vial', has_key: 'key', has_scheme: 'scheme'
    };
    Object.entries(itemAch).forEach(([k, a]) => {
      if (passage.set[k]) unlockAchievement(a);
    });

    newItems.forEach((k, i) => {
      setTimeout(() => showItemPopup(k), 500 + i * 1200);
    });
  }

  if (passage.ending) {
    gameState.endings[passage.ending] = true;
    unlockAchievement(passage.ending);
    /* 🎭 3-я КОНЦОВКА — проверка на все три */
    if (gameState.endings.harmony && gameState.endings.mastery && gameState.endings.nature) {
      unlockAchievement('allEndings');
    }
    saveGame();
  }

  if (addToHistory) {
    gameState.history = gameState.history.slice(0, gameState.historyIndex + 1);
    gameState.history.push(id);
    gameState.historyIndex = gameState.history.length - 1;
  }

  saveGame();

  if (passage.cutscene) {
    const ga = document.getElementById('gameArea');
    if (ga) ga.style.opacity = '0';
    CutscenePlayer.play(passage.cutscene, () => {
      if (ga) ga.style.opacity = '1';
      renderPassageInner(id, passage);
    });
    return;
  }
  renderPassageInner(id, passage);
}

function renderPassageInner(id, passage) {
  clearTitleElements();
  clearDialogueElements();
  setBackground(passage.location);
  if (passage.insert) showInsert(passage.insert, passage.insertDuration || 2200);

  let navHTML = '';
  if (passage.choices && passage.choices.length > 0) {
    navHTML = '<div class="choice-box">' + passage.choices.map(c => {
      let cls = '';
      let extra = '';
      /* 🎭 3-я КОНЦОВКА — проверка для всех трёх финалов */
      if (c.to === 'ФиналГармония' && !canDoHarmony()) {
        cls = 'disabled';
        extra = `<span class="need">(нужно: ${missingHarmony().join(', ')})</span>`;
      }
      if (c.to === 'ФиналМастерство' && !canDoMastery()) {
        cls = 'disabled';
        extra = `<span class="need">(нужно: ${missingMastery().join(', ')})</span>`;
      }
      if (c.to === 'ФиналИзобилие' && !canDoNature()) {
        cls = 'disabled';
        extra = `<span class="need">(нужно: ${missingNature().join(', ')})</span>`;
      }
      return `<a data-to="${c.to}" class="${cls}"><span>${c.text}${extra}</span></a>`;
    }).join('') + '</div>';
  }

  const gameMenuHTML = `
    <div class="game-menu">
      <button id="btnJournal" title="Журнал">📖</button>
      <button id="btnAchievements" title="Достижения">🏆</button>
      <button id="btnMenu" title="В главное меню">🏠</button>
    </div>
  `;

  const boxClass = passage.boxClass || 'narrator';
  const speaker = passage.speaker || '';

  const boxHTML = `
    <div class="dialogue-box ${boxClass}">
      <div class="top-line"></div>
      ${speaker ? `<div class="speaker-name">${speaker}</div>` : ''}
      <div class="dialogue-text" id="dialogueText"></div>
      ${(!passage.choices || passage.choices.length === 0) && passage.next ? '<div class="next-hint">▼</div>' : ''}
    </div>
  `;

  const gameArea = document.getElementById('gameArea');
  gameArea.style.opacity = '1';
  gameArea.innerHTML = boxHTML + navHTML + gameMenuHTML;

  gameArea.querySelectorAll('[data-to]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (btn.classList.contains('disabled')) {
        const to = btn.dataset.to;
        let missing;
        if (to === 'ФиналГармония') missing = missingHarmony();
        else if (to === 'ФиналМастерство') missing = missingMastery();
        else missing = missingNature();
        showNotification('⚠ Не хватает предметов', `Соберите: ${missing.join(', ')}`, 'warn');
        return;
      }
      const to = btn.dataset.to;
      if (to === 'title') {
        gameState.history = []; gameState.historyIndex = -1;
        renderPassage('title', false);
      } else {
        renderPassage(to);
      }
    });
  });

  const dialogueBox = gameArea.querySelector('.dialogue-box');
  if (dialogueBox) {
    dialogueBox.addEventListener('click', (e) => {
      if (e.target.closest('[data-to]')) return;
      if (e.target.closest('.game-menu')) return;
      e.stopPropagation();
      advance();
    });
  }

  const journalBtn = document.getElementById('btnJournal');
  if (journalBtn) journalBtn.addEventListener('click', (e) => { e.stopPropagation(); openJournal(); });

  const achBtn = document.getElementById('btnAchievements');
  if (achBtn) achBtn.addEventListener('click', (e) => { e.stopPropagation(); openAchievements(); });

  const menuBtn = document.getElementById('btnMenu');
  if (menuBtn) menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (confirm('Вернуться в главное меню?')) {
      gameState.history = []; gameState.historyIndex = -1;
      renderPassage('title', false);
    }
  });

  updateHistoryButtons();

  const textEl = document.getElementById('dialogueText');
  const text = passage.text || '';
  if (gameState.settings.typewriter === 'on') {
    gameState.isTyping = true;
    typeText(textEl, text, gameState.settings.textSpeed, () => { gameState.isTyping = false; });
  } else {
    textEl.innerHTML = text;
  }

  const clickLayer = document.getElementById('clickLayer');
  if (clickLayer) {
    if (passage.choices && passage.choices.length > 0) clickLayer.classList.remove('enabled');
    else clickLayer.classList.add('enabled');
  }

  if (passage.endingScreen) {
    setTimeout(() => showEndingScreen(passage.endingScreen), 4000);
  }
}

/* ============================================================

function showEndingScreen(endingKey) {
  clearDialogueElements();
  clearTitleElements();
  const clickLayer = document.getElementById('clickLayer');
  if (clickLayer) clickLayer.classList.remove('enabled');

  const data = {
    harmony: { title: '✨ Финал Гармонии', subtitle: 'Природа, наука и тепло сердец — вместе', color: '#FBBF24' },
    mastery: { title: '⚙ Финал Мастерства', subtitle: 'Точный расчёт и крепкая дружба', color: '#8bab7a' },
    nature:  { title: '🌿 Финал Изобилия',  subtitle: 'Сытый дух — счастливая долина', color: '#a8d49a' }
  }[endingKey] || { title: 'Финал', subtitle: '', color: '#FBBF24' };

  const gameArea = document.getElementById('gameArea');
  gameArea.style.opacity = '1';
  gameArea.innerHTML = `
    <div class="title-screen">
      <div class="title-logo">
        <h1 class="title-main" style="color:${data.color};">${data.title}</h1>
        <p class="title-sub" style="color:${data.color};">${data.subtitle}</p>
      </div>
      <div class="title-menu">
        <button id="btnPlayAgain">🔄 Пройти заново</button>
        <button id="btnOtherEnding">🎭 Другая концовка</button>
        <button id="btnToMenu">🏠 В главное меню</button>
      </div>
      <p class="title-footer">Верхний Шепот · Праздник Осенней Звезды</p>
    </div>
  `;

  document.getElementById('btnPlayAgain').addEventListener('click', () => {
    resetAll();
    renderPassage('Start1');
  });
  document.getElementById('btnOtherEnding').addEventListener('click', () => {
    gameState.history = []; gameState.historyIndex = -1;
    renderPassage('ВнутриБашни');
  });
  document.getElementById('btnToMenu').addEventListener('click', () => {
    gameState.history = []; gameState.historyIndex = -1;
    renderPassage('title', false);
  });
  updateHistoryButtons();
}

/* ============================================================
   ТИТУЛЬНЫЙ ЭКРАН (обновлён на 3 концовки)
   ============================================================ */
function renderTitleScreen() {
  gameState.currentPassage = 'title';
  clearDialogueElements();
  clearTitleElements();
  setBackground('title');

  const clickLayer = document.getElementById('clickLayer');
  if (clickLayer) clickLayer.classList.remove('enabled');

  const gameArea = document.getElementById('gameArea');
  /* 🎭 3-я КОНЦОВКА */
  const count = ['harmony','mastery','nature'].filter(k => gameState.endings[k]).length;
  const canLoad = hasSave();

  gameArea.style.opacity = '1';
  gameArea.innerHTML = `
    <div class="title-screen">
      <div class="title-logo">
        <h1 class="title-main">Песнь Августа</h1>
        <p class="title-sub">Интерактивная сказка</p>
      </div>
      <div class="title-menu">
        <button id="btnStart">▶ Начать историю</button>
        <button id="btnLoad" ${canLoad ? '' : 'disabled'}>📂 Продолжить</button>
        <button id="btnAchievements" ${canLoad ? '' : 'disabled'}>🏆 Достижения</button>
        <button id="btnReset" ${canLoad ? '' : 'disabled'}>🗑 Сбросить прогресс</button>
      </div>
      <p class="title-footer">Верхний Шепот · Праздник Осенней Звезды</p>
    </div>
    <div class="title-endings">🏆 Концовок открыто: <b>${count} / 3</b></div>
  `;

  document.getElementById('btnStart').addEventListener('click', () => {
    resetAll();
    renderPassage('Start1');
  });
  document.getElementById('btnLoad').addEventListener('click', () => {
    if (loadGame()) {
      clearTitleElements();
      const target = gameState.currentPassage === 'title' ? 'Start1' : gameState.currentPassage;
      renderPassage(target, false);
    }
  });
  document.getElementById('btnAchievements').addEventListener('click', openAchievements);
  document.getElementById('btnReset').addEventListener('click', () => {
    if (confirm('Сбросить весь прогресс?')) {
      resetAll();
      renderTitleScreen();
    }
  });
  updateHistoryButtons();
}

/* ============================================================
   НАВИГАЦИЯ
   ============================================================ */
function updateHistoryButtons() {
  const back = document.getElementById('btnBack');
  const fwd = document.getElementById('btnForward');
  const controls = document.getElementById('historyControls');
  if (gameState.currentPassage === 'title') { controls.style.display = 'none'; return; }
  controls.style.display = 'flex';
  back.disabled = gameState.historyIndex <= 0;
  fwd.disabled = gameState.historyIndex >= gameState.history.length - 1;
}
function goBack() {
  if (gameState.historyIndex <= 0) return;
  gameState.historyIndex--;
  renderPassage(gameState.history[gameState.historyIndex], false);
}
function goForward() {
  if (gameState.historyIndex >= gameState.history.length - 1) return;
  gameState.historyIndex++;
  renderPassage(gameState.history[gameState.historyIndex], false);
}

/* ============================================================
   МОДАЛКИ (журнал обновлён для 3 концовок)
   ============================================================ */
function openJournal() {
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  let html = '<h2>📖 Журнал</h2>';
  html += '<h3>Предметы</h3>';
  const allKeys = ['has_feather','has_crystal','has_selesta_vial','has_key','has_scheme'];
  const owned = allKeys.filter(k => has(k));
  if (owned.length === 0) {
    html += '<p style="color:#888;font-style:italic;">Пока ничего не найдено</p>';
  } else {
    owned.forEach(k => {
      const it = ITEMS[k];
      html += `<div class="item-row">
        <div class="item-icon">${it.icon}</div>
        <div class="item-info">
          <div class="item-name">${it.name}</div>
          <div class="item-hint">${it.hint}</div>
        </div>
      </div>`;
    });
  }

  /* 🎭 3-я КОНЦОВКА — показываем все три финала */
  html += '<h3>Доступные финалы</h3>';
  const hReady = canDoHarmony(), mReady = canDoMastery(), nReady = canDoNature();

  html += `<div class="ending-status ${hReady?'ready':'locked'}">
    <div>${hReady?'✅':'🔒'} ✨ Финал Гармонии — всё вместе</div>
    ${hReady ? '' : `<div class="status-need">Нужно: ${missingHarmony().join(', ')}</div>`}
  </div>`;

  html += `<div class="ending-status ${mReady?'ready':'locked'}">
    <div>${mReady?'✅':'🔒'} ⚙ Финал Мастерства — инженерия</div>
    ${mReady ? '' : `<div class="status-need">Нужно: ${missingMastery().join(', ')}</div>`}
  </div>`;

  html += `<div class="ending-status ${nReady?'ready':'locked'}">
    <div>${nReady?'✅':'🔒'} 🌿 Финал Изобилия — забота</div>
    ${nReady ? '' : `<div class="status-need">Нужно: ${missingNature().join(', ')}</div>`}
  </div>`;

  html += '<div class="buttons"><button id="journalClose">Закрыть</button></div>';
  content.innerHTML = html;
  overlay.classList.remove('hidden');
  document.getElementById('journalClose').addEventListener('click', () => overlay.classList.add('hidden'));
}

function openAchievements() {
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  let html = '<h2>🏆 Достижения</h2><div class="ach-list">';
  Object.entries(ACHIEVEMENTS).forEach(([k, a]) => {
    const got = !!gameState.achievements[k];
    html += `<div class="ach ${got?'':'locked'}">
      <div class="icon">${got?a.icon:'🔒'}</div>
      <div class="info">
        <div class="title">${a.title}</div>
        <div class="desc">${a.desc}</div>
      </div>
    </div>`;
  });
  html += '</div><div class="buttons"><button id="achClose">Закрыть</button></div>';
  content.innerHTML = html;
  overlay.classList.remove('hidden');
  document.getElementById('achClose').addEventListener('click', () => overlay.classList.add('hidden'));
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
function init() {
  loadGame();
  startMusic();
  initParticles();

  document.getElementById('btnBack').addEventListener('click', goBack);
  document.getElementById('btnForward').addEventListener('click', goForward);

  const clickLayerEl = document.getElementById('clickLayer');
  if (clickLayerEl) clickLayerEl.addEventListener('click', advance);

  document.addEventListener('keydown', ev => {
    const tag = (ev.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); goBack(); }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); goForward(); }
    else if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); advance(); }
    else if (ev.key === 'Escape') {
      const overlay = document.getElementById('modalOverlay');
      if (!overlay.classList.contains('hidden')) overlay.classList.add('hidden');
    }
  });

  document.getElementById('modalOverlay').addEventListener('click', ev => {
    if (ev.target.id === 'modalOverlay') ev.target.classList.add('hidden');
  });

  setTimeout(() => {
    const loading = document.getElementById('loadingScreen');
    if (loading) loading.classList.add('hidden');
  }, 700);

  renderTitleScreen();
}

document.addEventListener('DOMContentLoaded', init);
</script>
