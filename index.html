<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Песнь Августа</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* ============================================
   БАЗОВЫЕ СТИЛИ
   ============================================ */
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: 'Georgia', 'Times New Roman', serif;
  background: #0a0a14;
  color: #eee;
  overflow: hidden;
}

/* ===== ФОН ===== */
.bg-layer {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 35vh;
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
  background-color: #0a0a14;
  z-index: 1;
  transition: background-image 0.8s ease-in-out;
}
.vignette-layer {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 35vh;
  pointer-events: none;
  z-index: 2;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
}

/* ===== СПРАЙТЫ ===== */
.sprite-stage {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  pointer-events: none;
  z-index: 50;
}
.sprite {
  position: absolute;
  bottom: 20vh;
  height: 75vh;
  max-height: 900px;
  min-height: 300px;
  width: auto;
  max-width: 38vw;
  object-fit: contain;
  pointer-events: none;
  transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
              filter 0.4s ease-out,
              opacity 0.4s ease-out,
              left 0.6s ease-out,
              right 0.6s ease-out;
  filter: drop-shadow(0 0 15px rgba(0,0,0,0.7)) contrast(1.1) brightness(1.05);
  opacity: 1;
  will-change: transform, filter, opacity;
}
.sprite.pos-solo      { left: 50%; --tx: -50%; --sc: 1; }
.sprite.pos-left      { left: 22%; --tx: -50%; --sc: 0.95; }
.sprite.pos-right     { right: 22%; --tx: 50%;  --sc: 0.95; }
.sprite.pos-far-left  { left: 14%; --tx: -50%; --sc: 0.85; }
.sprite.pos-center    { left: 50%; --tx: -50%; --sc: 1; }
.sprite.pos-far-right { right: 14%; --tx: 50%;  --sc: 0.85; }

.sprite.pos-solo,
.sprite.pos-left,
.sprite.pos-far-left,
.sprite.pos-center { transform: translateX(-50%) scale(var(--sc)); }
.sprite.pos-right,
.sprite.pos-far-right { transform: translateX(50%) scale(var(--sc)); }

.sprite.active {
  opacity: 1;
  filter: drop-shadow(0 0 35px rgba(255,220,100,0.9))
          drop-shadow(0 0 70px rgba(255,180,50,0.6))
          brightness(1.15) saturate(1.2);
  z-index: 10;
  animation: spriteJump 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.sprite.inactive {
  opacity: 0.85;
  filter: drop-shadow(0 0 12px rgba(0,0,0,0.7)) brightness(0.75) saturate(0.8);
  z-index: 5;
}
.sprite.entering {
  opacity: 0;
  transform: translateX(var(--tx,-50%)) translateY(50px) scale(var(--sc,1));
}
.sprite.entered {
  opacity: 1;
  transform: translateX(var(--tx,-50%)) translateY(0) scale(var(--sc,1));
}
.sprite.leaving {
  opacity: 0;
  transform: translateX(var(--tx,-50%)) translateY(50px) scale(var(--sc,1));
  transition: all 0.5s ease-in;
}
@keyframes spriteJump {
  0%   { transform: translateX(var(--tx,-50%)) translateY(0) scale(var(--sc,1)); }
  25%  { transform: translateX(var(--tx,-50%)) translateY(-30px) scale(calc(var(--sc,1) * 1.06)); }
  50%  { transform: translateX(var(--tx,-50%)) translateY(-12px) scale(calc(var(--sc,1) * 1.03)); }
  75%  { transform: translateX(var(--tx,-50%)) translateY(-4px) scale(var(--sc,1)); }
  100% { transform: translateX(var(--tx,-50%)) translateY(0) scale(var(--sc,1)); }
}

/* ===== ДИАЛОГОВОЕ ОКНО ===== */
.dialogue-box {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  width: 100vw;
  max-height: 35vh;
  overflow: hidden;
  background: linear-gradient(180deg, rgba(20,15,10,0.92) 0%, rgba(10,8,5,0.95) 100%);
  border-top: 3px solid rgba(244,197,66,0.95);
  box-shadow: 0 -10px 50px rgba(0,0,0,0.7), inset 0 1px 0 rgba(244,197,66,0.3);
  backdrop-filter: blur(10px);
  z-index: 100;
  display: flex;
  flex-direction: column;
  animation: dialogueIn 0.5s ease-out;
}
@keyframes dialogueIn {
  from { opacity: 0; transform: translateY(30px); }
  to   { opacity: 1; transform: translateY(0); }
}
.speaker-name {
  display: flex;
  align-items: center;
  min-width: 160px;
  max-width: 280px;
  height: 4.5vh;
  min-height: 32px;
  padding: 0 1.5vw;
  background: linear-gradient(180deg, rgba(217,119,6,0.95) 0%, rgba(180,83,9,0.95) 100%);
  color: #FFF8E7;
  font-size: 1.4vw;
  font-weight: bold;
  border-radius: 0 0 6px 0;
  border-right: 3px solid rgba(244,197,66,0.9);
  border-bottom: 3px solid rgba(244,197,66,0.9);
  text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
  letter-spacing: 1.5px;
  margin-left: 2vw;
  flex-shrink: 0;
}
.dialogue-text {
  width: 100%;
  flex: 1;
  min-height: 10vh;
  color: #f0e6d2;
  font-size: 1.2vw;
  line-height: 1.7;
  text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  padding: 1.5vh 3vw;
  overflow-y: auto;
  border-top: 1px solid rgba(244,197,66,0.3);
}
.type-cursor {
  display: inline-block;
  color: #FFD700;
  animation: cursorBlink 0.8s steps(2, start) infinite;
  font-weight: bold;
}
@keyframes cursorBlink {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0; }
}

/* Типы диалогов */
.dialogue-box.narrator { background: linear-gradient(180deg, rgba(30,25,15,0.92) 0%, rgba(15,12,8,0.95) 100%); }
.dialogue-box.narrator .speaker-name { background: linear-gradient(180deg, rgba(180,130,40,0.95) 0%, rgba(140,100,30,0.95) 100%); }
.dialogue-box.mira { background: linear-gradient(180deg, rgba(45,25,10,0.92) 0%, rgba(25,15,5,0.95) 100%); border-top-color: rgba(230,126,34,0.95); }
.dialogue-box.mira .speaker-name { background: linear-gradient(180deg, rgba(230,126,34,0.95) 0%, rgba(200,100,20,0.95) 100%); }
.dialogue-box.bruno { background: linear-gradient(180deg, rgba(30,30,30,0.92) 0%, rgba(15,15,15,0.95) 100%); border-top-color: rgba(150,150,150,0.95); }
.dialogue-box.bruno .speaker-name { background: linear-gradient(180deg, rgba(100,100,100,0.95) 0%, rgba(70,70,70,0.95) 100%); }
.dialogue-box.shustik { background: linear-gradient(180deg, rgba(15,35,20,0.92) 0%, rgba(8,20,12,0.95) 100%); border-top-color: rgba(80,200,100,0.95); }
.dialogue-box.shustik .speaker-name { background: linear-gradient(180deg, rgba(60,160,80,0.95) 0%, rgba(40,120,60,0.95) 100%); }
.dialogue-box.selesta { background: linear-gradient(180deg, rgba(30,20,40,0.92) 0%, rgba(18,12,25,0.95) 100%); border-top-color: rgba(150,110,200,0.95); }
.dialogue-box.selesta .speaker-name { background: linear-gradient(180deg, rgba(130,90,180,0.95) 0%, rgba(100,70,140,0.95) 100%); }
.dialogue-box.cornelius { background: linear-gradient(180deg, rgba(15,25,45,0.92) 0%, rgba(8,15,30,0.95) 100%); border-top-color: rgba(70,110,200,0.95); }
.dialogue-box.cornelius .speaker-name { background: linear-gradient(180deg, rgba(60,100,180,0.95) 0%, rgba(40,70,140,0.95) 100%); }
.dialogue-box.august { background: linear-gradient(180deg, rgba(60,45,10,0.92) 0%, rgba(35,25,5,0.95) 100%); border-top-color: rgba(255,200,50,1); box-shadow: 0 -10px 60px rgba(255,200,50,0.4), inset 0 1px 0 rgba(255,220,100,0.4); }
.dialogue-box.august .speaker-name { background: linear-gradient(180deg, rgba(255,200,50,1) 0%, rgba(220,160,20,1) 100%); color: #2A1500; }
.dialogue-box.olven { background: linear-gradient(180deg, rgba(40,32,18,0.92) 0%, rgba(22,18,10,0.95) 100%); border-top: 3px dashed rgba(160,120,60,0.95); }
.dialogue-box.olven .speaker-name { background: linear-gradient(180deg, rgba(140,100,50,0.95) 0%, rgba(110,80,40,0.95) 100%); }
.dialogue-box.final-box { background: linear-gradient(180deg, rgba(40,35,15,0.92) 0%, rgba(20,18,8,0.95) 100%); border-top-color: rgba(255,215,0,1); box-shadow: 0 -10px 70px rgba(255,215,0,0.5); }
.dialogue-box.final-box .speaker-name { background: linear-gradient(180deg, rgba(255,215,0,1) 0%, rgba(200,150,20,1) 100%); color: #2A1500; }

/* ===== КНОПКИ ВЫБОРА ===== */
.choice-box {
  position: fixed;
  bottom: 37vh;
  left: 50%;
  transform: translateX(-50%);
  z-index: 101;
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 60%;
  max-width: 700px;
  animation: choicesIn 0.6s ease-out 0.3s backwards;
}
@keyframes choicesIn {
  from { opacity: 0; transform: translateX(-50%) translateY(20px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.choice-box a {
  width: 100%;
  display: block;
  text-align: center;
  padding: 16px 24px;
  background: linear-gradient(180deg, rgba(251,191,36,0.92) 0%, rgba(217,119,6,0.92) 100%);
  color: #2A1500;
  border: 3px solid rgba(180,83,9,0.95);
  border-radius: 6px;
  text-decoration: none;
  font-size: 16px;
  font-weight: bold;
  line-height: 1.3;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 6px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
}
.choice-box a:hover {
  background: linear-gradient(180deg, rgba(252,211,77,1) 0%, rgba(245,158,11,1) 100%);
  color: #1a0d00;
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 12px 35px rgba(255,200,100,0.7);
}

/* ===== КНОПКА "ДАЛЬШЕ" ===== */
.next-box {
  position: fixed;
  bottom: 37vh;
  right: 3vw;
  width: 10vw;
  max-width: 150px;
  min-width: 100px;
  z-index: 102;
  animation: choicesIn 0.6s ease-out 0.4s backwards;
}
.next-box a {
  display: block;
  background: linear-gradient(180deg, rgba(110,231,183,0.95) 0%, rgba(16,185,129,0.95) 100%);
  color: #064E3B;
  padding: 1.2vh 1vw;
  border-radius: 6px;
  border: 0.2vw solid rgba(5,150,105,0.95);
  text-decoration: none;
  font-size: 1.1vw;
  font-weight: bold;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(16,185,129,0.5);
  letter-spacing: 1px;
}
.next-box a:hover {
  background: linear-gradient(180deg, rgba(167,243,208,1) 0%, rgba(52,211,153,1) 100%);
  transform: translateY(-3px);
  box-shadow: 0 8px 30px rgba(16,185,129,0.8);
}

/* ===== КНОПКИ ИСТОРИИ ===== */
.history-controls {
  position: fixed;
  top: 15px; left: 15px;
  display: flex;
  gap: 10px;
  z-index: 300;
}
.history-btn {
  width: 50px; height: 50px;
  border-radius: 50%;
  border: 3px solid rgba(180,83,9,0.95);
  background: linear-gradient(180deg, rgba(251,191,36,0.95) 0%, rgba(217,119,6,0.95) 100%);
  color: #2A1500;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  padding: 0;
}
.history-btn:hover:not(:disabled) {
  transform: translateY(-3px) scale(1.1);
  box-shadow: 0 8px 25px rgba(255,200,100,0.7);
}
.history-btn:disabled { opacity: 0.35; cursor: not-allowed; filter: grayscale(0.7); }

/* ===== ИГРОВОЕ МЕНЮ (сохранить / в меню) ===== */
.game-menu {
  position: fixed;
  top: 15px;
  right: 15px;
  display: flex;
  gap: 10px;
  z-index: 300;
}
.game-menu button {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: 3px solid rgba(180,83,9,0.95);
  background: linear-gradient(180deg, rgba(251,191,36,0.95) 0%, rgba(217,119,6,0.95) 100%);
  color: #2A1500;
  font-size: 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  padding: 0;
}
.game-menu button:hover {
  transform: translateY(-3px) scale(1.1);
  box-shadow: 0 8px 25px rgba(255,200,100,0.7);
}

/* ===== ТИТУЛЬНЫЙ ЭКРАН ===== */
.title-screen {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 6vh 20px 5vh;
  z-index: 200;
  background: transparent;
}
.title-logo { text-align: center; animation: titleFadeIn 1.2s ease-out; }
@keyframes titleFadeIn {
  from { opacity: 0; transform: translateY(-30px); }
  to   { opacity: 1; transform: translateY(0); }
}
.title-main {
  font-size: 58px;
  color: #FFF8E7;
  text-shadow: -2px -2px 0 #B45309, 2px -2px 0 #B45309,
               -2px 2px 0 #B45309, 2px 2px 0 #B45309,
               0 0 30px rgba(255,220,100,1),
               5px 5px 25px rgba(0,0,0,0.8);
  letter-spacing: 6px;
  margin: 0;
  font-weight: bold;
  animation: titleGlow 3s ease-in-out infinite;
}
@keyframes titleGlow {
  0%, 100% { text-shadow: -2px -2px 0 #B45309, 2px -2px 0 #B45309, -2px 2px 0 #B45309, 2px 2px 0 #B45309, 0 0 30px rgba(255,220,100,1), 5px 5px 25px rgba(0,0,0,0.8); }
  50%      { text-shadow: -2px -2px 0 #B45309, 2px -2px 0 #B45309, -2px 2px 0 #B45309, 2px 2px 0 #B45309, 0 0 50px rgba(255,240,150,1), 5px 5px 25px rgba(0,0,0,0.8); }
}
.title-sub {
  font-size: 17px;
  color: #FFF3C4;
  text-shadow: 1px 1px 0 #B45309, 2px 2px 6px rgba(0,0,0,0.9);
  font-style: italic;
  margin-top: 10px;
  letter-spacing: 4px;
}
.title-menu {
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: 300px;
  animation: titleFadeIn 1s ease-out 0.4s backwards;
}
.title-menu button {
  display: block;
  background: linear-gradient(180deg, rgba(251,191,36,0.95) 0%, rgba(217,119,6,0.95) 100%);
  color: #2A1500;
  padding: 14px 22px;
  border-radius: 4px;
  border: 3px solid rgba(180,83,9,0.95);
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
  font-family: inherit;
  text-align: center;
  letter-spacing: 1.5px;
  transition: all 0.3s ease;
  box-shadow: 0 6px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
}
.title-menu button:hover:not(:disabled) {
  background: linear-gradient(180deg, rgba(252,211,77,1) 0%, rgba(245,158,11,1) 100%);
  transform: translateY(-3px) scale(1.03);
  box-shadow: 0 12px 30px rgba(255,200,100,0.7);
}
.title-menu button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  filter: grayscale(0.6);
}
.title-footer {
  font-size: 13px;
  color: #FFF3C4;
  text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
  letter-spacing: 2px;
  font-style: italic;
  opacity: 0.9;
  margin: 0;
  animation: titleFadeIn 1s ease-out 0.8s backwards;
}
.title-endings {
  position: fixed;
  bottom: 12vh;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.75);
  color: #FFD700;
  padding: 12px 28px;
  border: 2px solid rgba(255,215,0,0.85);
  border-radius: 10px;
  font-size: 16px;
  letter-spacing: 1.5px;
  box-shadow: 0 4px 25px rgba(255,215,0,0.3);
  z-index: 210;
}

/* ===== МОДАЛЬНОЕ ОКНО ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: #111;
  border: 2px solid #444;
  max-width: 500px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 24px;
  border-radius: 8px;
}
.modal h2 {
  margin: 0 0 16px;
  color: #FBBF24;
  text-transform: uppercase;
  font-size: 20px;
  letter-spacing: 2px;
}
.modal .row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid #333;
  gap: 12px;
  flex-wrap: wrap;
}
.modal .row:last-of-type { border-bottom: none; }
.modal label { color: #ddd; }
.modal select, .modal input[type=range] {
  background: #222;
  color: #eee;
  border: 1px solid #555;
  padding: 6px 10px;
  border-radius: 4px;
  font-family: inherit;
  font-size: 14px;
}
.modal .buttons {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  margin-top: 20px;
}
.modal button {
  background: linear-gradient(180deg, #35a, #147);
  color: #fff;
  border: 2px solid #57c;
  padding: 10px 20px;
  border-radius: 4px;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 1px;
}
.modal button:hover { background: linear-gradient(180deg, #57c, #258); }
.modal button.danger { background: linear-gradient(180deg, #911, #600); border-color: #c33; }
.modal button.danger:hover { background: linear-gradient(180deg, #c33, #811); }

/* ===== СКРОЛЛБАР ===== */
.dialogue-text::-webkit-scrollbar,
.modal::-webkit-scrollbar { width: 8px; }
.dialogue-text::-webkit-scrollbar-track,
.modal::-webkit-scrollbar-track { background: rgba(255,243,196,0.2); }
.dialogue-text::-webkit-scrollbar-thumb,
.modal::-webkit-scrollbar-thumb { background: #FBBF24; border-radius: 4px; }
.dialogue-text::-webkit-scrollbar-thumb:hover,
.modal::-webkit-scrollbar-thumb:hover { background: #F59E0B; }

/* ===== МОБИЛЬНАЯ АДАПТАЦИЯ ===== */
@media (max-width: 768px) {
  .bg-layer, .vignette-layer { bottom: 42vh; }
  .dialogue-box { max-height: 42vh; }
  .speaker-name { font-size: 4vw; min-width: 130px; margin-left: 3vw; }
  .dialogue-text { font-size: 3.5vw; padding: 1.5vh 4vw; }
  .choice-box { bottom: 44vh; width: 88%; }
  .choice-box a { padding: 12px 16px; font-size: 13px; }
  .next-box { bottom: 44vh; right: 3vw; width: 22vw; min-width: 90px; }
  .next-box a { font-size: 3.2vw; }
  .sprite { height: 60vh; max-width: 55vw; bottom: 25vh; }
  .sprite.pos-left { left: 24%; }
  .sprite.pos-right { right: 24%; }
  .title-main { font-size: 34px; letter-spacing: 2px; }
  .title-sub { font-size: 13px; letter-spacing: 2px; }
  .title-menu { width: 240px; }
  .title-menu button { font-size: 13px; padding: 10px 14px; }
  .title-endings { font-size: 13px; padding: 10px 20px; bottom: 16vh; }
  .history-btn { width: 42px; height: 42px; font-size: 18px; }
  .game-menu button { width: 42px; height: 42px; font-size: 18px; }
}

.hidden { display: none !important; }
</style>
</head>
<body>

<!-- Музыка -->
<audio id="bgMusic" loop preload="auto" src="audio/main_theme.mp3"></audio>

<!-- Фон и виньетка -->
<div class="bg-layer" id="bgLayer"></div>
<div class="vignette-layer"></div>

<!-- Сцена для спрайтов -->
<div class="sprite-stage" id="spriteStage"></div>

<!-- Кнопки истории -->
<div class="history-controls" id="historyControls" style="display:none;">
  <button class="history-btn" id="btnBack" title="Назад (←)">←</button>
  <button class="history-btn" id="btnForward" title="Вперёд (→)">→</button>
</div>

<!-- Игровая зона -->
<div id="gameArea"></div>

<!-- Модальное окно -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
/* ============================================
   ПЕСНЬ АВГУСТА — движок
   ============================================ */

const gameState = {
  currentPassage: 'title',
  history: [],
  historyIndex: -1,
  variables: {},
  endings: {},
  settings: {
    textSpeed: 40,
    musicVolume: 0.6,
    typewriter: 'on'
  },
  isTyping: false,
  typewriterTimer: null
};

/* ===== МУЗЫКА ===== */
const bgMusic = document.getElementById('bgMusic');
let musicStarted = false;

function startMusic() {
  if (musicStarted) return;
  if (!bgMusic) return;
  bgMusic.volume = gameState.settings.musicVolume;
  const p = bgMusic.play();
  if (p && p.catch) {
    p.then(() => {
      musicStarted = true;
    }).catch(() => {
      // Автоплей заблокирован — ждём первого клика/клавиши
      const kick = () => {
        bgMusic.play().then(() => {
          musicStarted = true;
          document.removeEventListener('click', kick);
          document.removeEventListener('keydown', kick);
        }).catch(() => {});
      };
      document.addEventListener('click', kick);
      document.addEventListener('keydown', kick);
    });
  } else {
    musicStarted = true;
  }
}

function setMusicVolume(v) {
  gameState.settings.musicVolume = v;
  if (bgMusic) bgMusic.volume = v;
}

/* ===== СОХРАНЕНИЯ (localStorage) ===== */
const SAVE_KEY = 'pesn_augusta_save';
const ENDINGS_KEY = 'pesn_augusta_endings';
const SETTINGS_KEY = 'pesn_augusta_settings';

function saveGame() {
  try {
    const save = {
      version: 1,
      timestamp: Date.now(),
      currentPassage: gameState.currentPassage,
      history: gameState.history,
      historyIndex: gameState.historyIndex,
      variables: gameState.variables,
      endings: gameState.endings
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
    return true;
  } catch (e) {
    console.error('Ошибка сохранения:', e);
    return false;
  }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const save = JSON.parse(raw);
    if (!save || !save.currentPassage) return false;

    gameState.currentPassage = save.currentPassage;
    gameState.history = save.history || [];
    gameState.historyIndex = (typeof save.historyIndex === 'number')
      ? save.historyIndex
      : gameState.history.length - 1;
    gameState.variables = save.variables || {};
    if (save.endings) {
      gameState.endings = save.endings;
      saveEndingsToStorage();
    }
    return true;
  } catch (e) {
    console.error('Ошибка загрузки:', e);
    return false;
  }
}

function hasSave() {
  try {
    return !!localStorage.getItem(SAVE_KEY);
  } catch (e) {
    return false;
  }
}

function clearSave() {
  try {
    localStorage.removeItem(SAVE_KEY);
  } catch (e) {}
}

/* ===== КОНЦОВКИ ===== */
function loadEndingsFromStorage() {
  try {
    const saved = localStorage.getItem(ENDINGS_KEY);
    if (saved) gameState.endings = JSON.parse(saved);
  } catch (e) { console.warn('Не удалось загрузить концовки:', e); }
}
function saveEndingsToStorage() {
  try {
    localStorage.setItem(ENDINGS_KEY, JSON.stringify(gameState.endings));
  } catch (e) { console.warn('Не удалось сохранить концовки:', e); }
}
function countEndings() {
  return ['harmony', 'mastery', 'science', 'unity'].filter(k => gameState.endings[k]).length;
}

/* ===== НАСТРОЙКИ ===== */
function saveSettings() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(gameState.settings));
  } catch (e) {}
}
function loadSettings() {
  try {
    const s = localStorage.getItem(SETTINGS_KEY);
    if (s) Object.assign(gameState.settings, JSON.parse(s));
  } catch (e) {}
}

/* ===== ФОН ===== */
function setBackground(locationKey) {
  const bg = document.getElementById('bgLayer');
  const url = LOCATION_BG[locationKey];
  if (url) {
    bg.style.backgroundImage = `url("${url}")`;
  } else {
    bg.style.backgroundImage = 'none';
  }
}

/* ===== СПРАЙТЫ ===== */
const activeSprites = {};

function getSceneLayout(count) {
  if (count === 1) return ['pos-solo'];
  if (count === 2) return ['pos-left', 'pos-right'];
  if (count === 3) return ['pos-far-left', 'pos-center', 'pos-far-right'];
  return ['pos-far-left', 'pos-left', 'pos-right', 'pos-far-right'];
}

function relayoutSprites() {
  const names = Object.keys(activeSprites);
  const layout = getSceneLayout(names.length);
  names.forEach((name, i) => {
    const sprite = activeSprites[name];
    const wasActive = sprite.el.classList.contains('active');
    const wasInactive = sprite.el.classList.contains('inactive');
    sprite.el.className = 'sprite ' + (layout[i] || 'pos-solo');
    if (wasActive) sprite.el.classList.add('active');
    else if (wasInactive) sprite.el.classList.add('inactive');
  });
}

function addSprite(name, pos) {
  if (activeSprites[name]) {
    if (pos) {
      activeSprites[name].el.classList.remove(
        'pos-solo','pos-left','pos-right','pos-center','pos-far-left','pos-far-right'
      );
      activeSprites[name].el.classList.add('pos-' + pos);
    }
    return;
  }
  const stage = document.getElementById('spriteStage');
  const img = document.createElement('img');
  img.src = SPRITE_MAP[name];
  img.alt = name;
  img.dataset.char = name;
  img.className = 'sprite entering ' + (pos ? 'pos-' + pos : 'pos-solo');
  stage.appendChild(img);
  activeSprites[name] = { el: img };
  setTimeout(() => {
    img.classList.remove('entering');
    img.classList.add('entered');
  }, 50);
}

function removeSprite(name) {
  if (!activeSprites[name]) return;
  const el = activeSprites[name].el;
  el.classList.add('leaving');
  setTimeout(() => {
    el.remove();
    delete activeSprites[name];
    relayoutSprites();
  }, 400);
}

function clearSprites() {
  Object.keys(activeSprites).forEach(name => activeSprites[name].el.remove());
  Object.keys(activeSprites).forEach(name => delete activeSprites[name]);
}

function setActiveSprite(name) {
  Object.keys(activeSprites).forEach(key => {
    const sprite = activeSprites[key];
    if (key === name) {
      sprite.el.classList.remove('inactive');
      sprite.el.classList.add('active');
      sprite.el.style.animation = 'none';
      void sprite.el.offsetWidth;
      sprite.el.style.animation = '';
    } else {
      sprite.el.classList.remove('active');
      sprite.el.classList.add('inactive');
    }
  });
}

function deactivateAllSprites() {
  Object.keys(activeSprites).forEach(key => {
    activeSprites[key].el.classList.remove('active');
    activeSprites[key].el.classList.add('inactive');
  });
}

/* ===== ПЕЧАТАЮЩИЙСЯ ТЕКСТ ===== */
function typeText(element, html, speed, callback) {
  const tokens = [];
  let i = 0;
  while (i < html.length) {
    if (html[i] === '<') {
      const end = html.indexOf('>', i);
      if (end === -1) { tokens.push(html[i]); i++; continue; }
      tokens.push(html.slice(i, end + 1));
      i = end + 1;
    } else {
      tokens.push(html[i]);
      i++;
    }
  }

  element.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'type-cursor';
  cursor.textContent = '▍';
  let buffer = '';
  let idx = 0;

  function step() {
    if (idx >= tokens.length) {
      cursor.remove();
      element.innerHTML = html;
      gameState.isTyping = false;
      if (callback) callback();
      return;
    }
    const t = tokens[idx++];
    buffer += t;
    element.innerHTML = buffer;
    element.appendChild(cursor);
    if (t.startsWith('<')) {
      step();
    } else {
      gameState.typewriterTimer = setTimeout(step, speed);
    }
  }
  step();
}

/* ===== ОТРИСОВКА ПАССАЖА ===== */
function renderPassage(id, addToHistory = true) {
  const passage = PASSAGES[id];
  if (!passage) {
    console.error('Пассаж не найден:', id);
    return;
  }

  if (gameState.typewriterTimer) {
    clearTimeout(gameState.typewriterTimer);
    gameState.typewriterTimer = null;
  }
  gameState.isTyping = false;

  gameState.currentPassage = id;

  // Титульный экран
  if (passage.isTitle) {
    renderTitleScreen();
    return;
  }

  // set-переменные
  if (passage.set) {
    Object.assign(gameState.variables, passage.set);
  }

  // Отметка концовки
  if (passage.ending) {
    gameState.endings[passage.ending] = true;
    saveEndingsToStorage();
  }

  // История
  if (addToHistory) {
    gameState.history = gameState.history.slice(0, gameState.historyIndex + 1);
    gameState.history.push(id);
    gameState.historyIndex = gameState.history.length - 1;
  }

  // Фон
  setBackground(passage.location);

  // Спрайты
  const wanted = passage.sprites || [];
  const wantedNames = wanted.map(s => s.name);

  Object.keys(activeSprites).forEach(name => {
    if (!wantedNames.includes(name)) removeSprite(name);
  });
  wanted.forEach(s => addSprite(s.name, s.pos));
  setTimeout(relayoutSprites, 50);

  // Активный спрайт
  const speakerKey = SPEAKER_MAP[passage.speaker];
  if (speakerKey && activeSprites[speakerKey]) {
    setActiveSprite(speakerKey);
  } else if (wantedNames.length > 0) {
    deactivateAllSprites();
  }

  // Диалоговое окно
  const boxClass = passage.boxClass || 'narrator';
  const speaker = passage.speaker || '';

  const boxHTML = `
    <div class="dialogue-box ${boxClass}">
      <div class="speaker-name">${speaker}</div>
      <div class="dialogue-text" id="dialogueText"></div>
    </div>
  `;

  // Кнопки
  let buttonsHTML = '';
  if (passage.choices && passage.choices.length > 0) {
    buttonsHTML = '<div class="choice-box">' +
      passage.choices.map(c => `<a data-to="${c.to}">${c.text}</a>`).join('') +
      '</div>';
  } else if (passage.next) {
    buttonsHTML = '<div class="next-box"><a data-to="' + passage.next + '">Дальше →</a></div>';
  }

  // Игровое меню (сохранить / в главное меню)
  buttonsHTML += `
    <div class="game-menu">
      <button id="btnSave" title="Сохранить игру">💾</button>
      <button id="btnMenu" title="В главное меню">🏠</button>
    </div>
  `;

  const gameArea = document.getElementById('gameArea');
  gameArea.innerHTML = boxHTML + buttonsHTML;

  // Кнопки переходов
  gameArea.querySelectorAll('[data-to]').forEach(btn => {
    btn.addEventListener('click', () => {
      const to = btn.dataset.to;
      if (to === 'title') {
        gameState.history = [];
        gameState.historyIndex = -1;
        renderPassage('title', false);
      } else {
        renderPassage(to);
      }
    });
  });

  // Кнопка "Сохранить"
  const saveBtn = document.getElementById('btnSave');
  if (saveBtn) saveBtn.addEventListener('click', () => {
    if (saveGame()) {
      saveBtn.textContent = '✅';
      setTimeout(() => { saveBtn.textContent = '💾'; }, 1000);
    } else {
      alert('Не удалось сохранить игру.');
    }
  });

  // Кнопка "В меню"
  const menuBtn = document.getElementById('btnMenu');
  if (menuBtn) menuBtn.addEventListener('click', () => {
    if (confirm('Вернуться в главное меню? Несохранённый прогресс будет потерян.')) {
      gameState.history = [];
      gameState.historyIndex = -1;
      renderPassage('title', false);
    }
  });

  // Кнопки истории
  updateHistoryButtons();

  // Печатающийся текст
  const textEl = document.getElementById('dialogueText');
  const text = passage.text || '';
  if (gameState.settings.typewriter === 'on') {
    gameState.isTyping = true;
    typeText(textEl, text, gameState.settings.textSpeed, () => {
      gameState.isTyping = false;
    });
    textEl.addEventListener('click', function finishTyping() {
      if (gameState.isTyping) {
        clearTimeout(gameState.typewriterTimer);
        textEl.innerHTML = text;
        gameState.isTyping = false;
        textEl.removeEventListener('click', finishTyping);
      }
    });
  } else {
    textEl.innerHTML = text;
  }
}

/* ===== ТИТУЛЬНЫЙ ЭКРАН ===== */
function renderTitleScreen() {
  setBackground('title');
  clearSprites();
  const gameArea = document.getElementById('gameArea');
  const count = countEndings();
  const total = 4;
  const canLoad = hasSave();

  gameArea.innerHTML = `
    <div class="title-screen">
      <div class="title-logo">
        <h1 class="title-main">Песнь Августа</h1>
        <p class="title-sub">Интерактивная сказка</p>
      </div>
      <div class="title-menu">
        <button id="btnStart">▶ Начать историю</button>
        <button id="btnLoad" ${canLoad ? '' : 'disabled'}>📂 Загрузить</button>
        <button id="btnSettings">⚙ Настройки</button>
        <button id="btnResetEndings">🔄 Сбросить концовки</button>
      </div>
      <p class="title-footer">Верхний Шепоть · Праздник Осенней Звезды</p>
    </div>
    <div class="title-endings">🏆 Концовок открыто: <b>${count} / ${total}</b></div>
  `;

  document.getElementById('btnStart').addEventListener('click', () => {
    gameState.history = [];
    gameState.historyIndex = -1;
    gameState.variables = {};
    renderPassage('Start1');
  });

  document.getElementById('btnLoad').addEventListener('click', () => {
    if (loadGame()) {
      renderPassage(gameState.currentPassage, false);
    } else {
      alert('Сохранение не найдено или повреждено.');
    }
  });

  document.getElementById('btnSettings').addEventListener('click', openSettings);

  document.getElementById('btnResetEndings').addEventListener('click', () => {
    if (confirm('Сбросить все открытые концовки?')) {
      gameState.endings = {};
      saveEndingsToStorage();
      renderTitleScreen();
    }
  });

  updateHistoryButtons();
}

/* ===== КНОПКИ ИСТОРИИ ===== */
function updateHistoryButtons() {
  const back = document.getElementById('btnBack');
  const fwd = document.getElementById('btnForward');
  const controls = document.getElementById('historyControls');
  if (gameState.currentPassage === 'title') {
    controls.style.display = 'none';
    return;
  }
  controls.style.display = 'flex';
  back.disabled = gameState.historyIndex <= 0;
  fwd.disabled = gameState.historyIndex >= gameState.history.length - 1;
}

function goBack() {
  if (gameState.historyIndex <= 0) return;
  gameState.historyIndex--;
  const id = gameState.history[gameState.historyIndex];
  renderPassage(id, false);
}

function goForward() {
  if (gameState.historyIndex >= gameState.history.length - 1) return;
  gameState.historyIndex++;
  const id = gameState.history[gameState.historyIndex];
  renderPassage(id, false);
}

/* ===== НАСТРОЙКИ (модальное окно) ===== */
function openSettings() {
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  content.innerHTML = `
    <h2>Настройки</h2>
    <div class="row">
      <label>Скорость текста</label>
      <select id="setSpeed">
        <option value="20" ${gameState.settings.textSpeed==20?'selected':''}>Медленно</option>
        <option value="40" ${gameState.settings.textSpeed==40?'selected':''}>Обычно</option>
        <option value="60" ${gameState.settings.textSpeed==60?'selected':''}>Быстро</option>
      </select>
    </div>
    <div class="row">
      <label>Печатающийся текст</label>
      <select id="setTypewriter">
        <option value="on" ${gameState.settings.typewriter=='on'?'selected':''}>Включён</option>
        <option value="off" ${gameState.settings.typewriter=='off'?'selected':''}>Выключен</option>
      </select>
    </div>
    <div class="row">
      <label>Громкость музыки: <span id="volLabel">${Math.round(gameState.settings.musicVolume*100)}%</span></label>
      <input type="range" id="setVolume" min="0" max="1" step="0.05" value="${gameState.settings.musicVolume}" style="width:180px;">
    </div>
    <div class="buttons">
      <button id="setClose">Закрыть</button>
    </div>
  `;
  overlay.classList.remove('hidden');

  document.getElementById('setSpeed').addEventListener('change', e => {
    gameState.settings.textSpeed = Number(e.target.value);
    saveSettings();
  });
  document.getElementById('setTypewriter').addEventListener('change', e => {
    gameState.settings.typewriter = e.target.value;
    saveSettings();
  });
  document.getElementById('setVolume').addEventListener('input', e => {
    const v = Number(e.target.value);
    setMusicVolume(v);
    document.getElementById('volLabel').textContent = Math.round(v*100) + '%';
    saveSettings();
  });
  document.getElementById('setClose').addEventListener('click', () => {
    overlay.classList.add('hidden');
  });
}

/* ===== ИНИЦИАЛИЗАЦИЯ ===== */
function init() {
  loadEndingsFromStorage();
  loadSettings();

  // Применяем загруженную громкость
  if (bgMusic) bgMusic.volume = gameState.settings.musicVolume;

  // Запускаем музыку
  startMusic();

  // Кнопки истории
  document.getElementById('btnBack').addEventListener('click', goBack);
  document.getElementById('btnForward').addEventListener('click', goForward);

  // Клавиатура
  document.addEventListener('keydown', ev => {
    const tag = (ev.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (ev.ctrlKey || ev.altKey || ev.metaKey) return;
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); goBack(); }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); goForward(); }
  });

  // Модальное окно — закрытие по клику на фон
  document.getElementById('modalOverlay').addEventListener('click', ev => {
    if (ev.target.id === 'modalOverlay') {
      ev.target.classList.add('hidden');
    }
  });

  // Старт
  renderPassage('title', false);
}

document.addEventListener('DOMContentLoaded', init);
</script>
