<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Песнь Августа — упрощённая версия</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: 'Georgia', 'Times New Roman', serif;
  background: #0a0a14; color: #eee;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.bg-layer {
  position: fixed; inset: 0;
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-color: #0a0a14;
  z-index: 1; pointer-events: none;
  opacity: 1;
  transition: opacity 0.8s ease-in-out;
  animation: kenBurns 28s ease-in-out infinite alternate;
}
@keyframes kenBurns {
  0%   { transform: scale(1)    translate(0, 0); }
  100% { transform: scale(1.08) translate(-1.2%, -1%); }
}
.particles-layer {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 3;
  overflow: hidden;
}
.particle {
  position: absolute;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,220,120,1) 0%, rgba(255,180,50,0.6) 40%, transparent 70%);
  box-shadow: 0 0 8px rgba(255,200,80,0.9), 0 0 16px rgba(255,180,50,0.5);
  opacity: 0;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0%   { transform: translateY(0) translateX(0) scale(0.6); opacity: 0; }
  10%  { opacity: 0.85; }
  90%  { opacity: 0.65; }
  100% { transform: translateY(-110vh) translateX(40px) scale(1.1); opacity: 0; }
}
.vignette-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 4;
  background:
    radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,0.7) 100%),
    linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 25%, transparent 65%, rgba(0,0,0,0.7) 100%);
}
.loading-screen {
  position: fixed; inset: 0; z-index: 5000;
  background: radial-gradient(ellipse at center, #14101e 0%, #0a0a14 100%);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 24px;
  transition: opacity 0.8s ease;
}
.loading-screen.hidden { opacity: 0; pointer-events: none; }
.loading-spinner {
  width: 72px; height: 72px;
  border: 3px solid rgba(251,191,36,0.12);
  border-top-color: #FBBF24;
  border-right-color: rgba(251,191,36,0.5);
  border-radius: 50%;
  animation: spin 1.1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
  box-shadow: 0 0 40px rgba(251,191,36,0.35), inset 0 0 20px rgba(251,191,36,0.15);
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  color: #FBBF24; font-size: 14px;
  letter-spacing: 6px; text-transform: uppercase;
  animation: pulse 1.8s ease-in-out infinite;
  text-shadow: 0 0 16px rgba(251,191,36,0.7);
}
@keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

.dialogue-box {
  position: fixed; left: 50%; bottom: 3vh;
  transform: translateX(-50%);
  width: min(1000px, 94vw);
  max-height: 36vh;
  background: linear-gradient(180deg, rgba(28,22,14,0.94) 0%, rgba(14,10,6,0.97) 100%);
  border: 1px solid rgba(244,197,66,0.6);
  border-radius: 4px;
  box-shadow:
    0 -40px 80px rgba(0,0,0,0.7),
    0 24px 70px rgba(0,0,0,0.8),
    0 0 60px rgba(255,200,80,0.1),
    inset 0 1px 0 rgba(255,255,255,0.08);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  z-index: 100;
  display: flex; flex-direction: column;
  animation: dialogueIn 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  overflow: visible; cursor: pointer;
}
@keyframes dialogueIn {
  from { opacity: 0; transform: translateX(-50%) translateY(40px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.speaker-name {
  position: absolute; top: -26px; left: 34px;
  min-width: 130px; max-width: 360px;
  padding: 10px 26px 9px;
  background: linear-gradient(180deg, rgba(217,119,6,1) 0%, rgba(160,75,10,1) 100%);
  color: #FFF8E7;
  font-size: clamp(14px, 1.2vw, 18px);
  font-weight: bold; border-radius: 3px;
  border: 1px solid rgba(244,197,66,0.95);
  box-shadow:
    0 10px 28px rgba(0,0,0,0.7),
    0 0 24px rgba(255,180,50,0.35),
    inset 0 1px 0 rgba(255,255,255,0.3);
  text-shadow: 1px 1px 4px rgba(0,0,0,0.85);
  letter-spacing: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  z-index: 4;
}
.dialogue-text {
  width: 100%; flex: 1;
  min-height: 14vh; max-height: 28vh;
  color: #f5ecd7;
  font-size: clamp(15px, 1.2vw, 19px);
  line-height: 1.85;
  text-shadow: 0 1px 3px rgba(0,0,0,0.95);
  padding: 34px 44px 30px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #FBBF24 rgba(255,243,196,0.1);
}
.dialogue-text b { color: #FFE9A8; font-weight: bold; }
.dialogue-text i { color: #d8c9a8; font-style: italic; }
.type-cursor {
  display: inline-block; color: #FFD700;
  animation: cursorBlink 0.8s steps(2, start) infinite;
  font-weight: bold; margin-left: 2px;
  text-shadow: 0 0 10px rgba(255,215,0,0.95);
}
@keyframes cursorBlink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
.next-hint {
  position: absolute; right: 26px; bottom: 16px;
  color: #FFD700;
  font-size: clamp(18px, 1.5vw, 24px);
  opacity: 0.85;
  animation: nextPulse 1.5s ease-in-out infinite;
  pointer-events: none;
  text-shadow: 0 0 14px rgba(255,215,0,0.9);
}
@keyframes nextPulse {
  0%,100% { transform: translateY(0); opacity: 0.4; }
  50%     { transform: translateY(6px); opacity: 1; }
}
.dialogue-box.narrator { border-color: rgba(200,160,80,0.55); }
.dialogue-box.narrator .speaker-name { background: linear-gradient(180deg, rgba(180,130,40,1) 0%, rgba(130,90,25,1) 100%); }
.dialogue-box.mira .speaker-name { background: linear-gradient(180deg, rgba(230,126,34,1) 0%, rgba(190,90,15,1) 100%); }
.dialogue-box.bruno .speaker-name { background: linear-gradient(180deg, rgba(120,120,120,1) 0%, rgba(70,70,70,1) 100%); }
.dialogue-box.shustik .speaker-name { background: linear-gradient(180deg, rgba(60,160,80,1) 0%, rgba(35,110,55,1) 100%); }
.dialogue-box.selesta .speaker-name { background: linear-gradient(180deg, rgba(130,90,180,1) 0%, rgba(95,65,135,1) 100%); }
.dialogue-box.cornelius .speaker-name { background: linear-gradient(180deg, rgba(60,100,180,1) 0%, rgba(35,65,135,1) 100%); }
.dialogue-box.olven { border-style: dashed; border-color: rgba(170,130,70,0.9); background: linear-gradient(180deg, rgba(50,38,22,0.94) 0%, rgba(28,20,10,0.97) 100%); }
.dialogue-box.olven .speaker-name { background: linear-gradient(180deg, rgba(150,110,55,1) 0%, rgba(100,70,30,1) 100%); }
.dialogue-box.olven .dialogue-text { font-style: italic; color: #f0e3c8; }
.dialogue-box.player .speaker-name { background: linear-gradient(180deg, rgba(60,140,200,1) 0%, rgba(35,90,150,1) 100%); }
.dialogue-box.final-box {
  border-color: rgba(255,215,0,1);
  box-shadow:
    0 -40px 80px rgba(0,0,0,0.7),
    0 24px 70px rgba(0,0,0,0.8),
    0 0 80px rgba(255,215,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.15);
}
.dialogue-box.final-box .speaker-name { background: linear-gradient(180deg, rgba(255,215,0,1) 0%, rgba(200,150,20,1) 100%); color: #2A1500; }

.choice-box {
  position: fixed; left: 50%; bottom: 42vh;
  transform: translateX(-50%); z-index: 101;
  display: flex; flex-direction: column; gap: 14px;
  width: min(720px, 88vw);
  animation: choicesIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.2s backwards;
}
@keyframes choicesIn {
  from { opacity: 0; transform: translateX(-50%) translateY(24px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.choice-box a {
  position: relative;
  width: 100%; display: block; text-align: left;
  padding: 16px 26px 16px 60px;
  background: linear-gradient(180deg, rgba(28,22,14,0.94) 0%, rgba(14,10,6,0.97) 100%);
  color: #F5ECD7;
  border: 1px solid rgba(244,197,66,0.5);
  border-radius: 4px;
  text-decoration: none;
  font-size: clamp(13px, 1.05vw, 16px);
  line-height: 1.4;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 8px 24px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
  letter-spacing: 0.4px; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.choice-box a::before {
  content: '▸'; position: absolute;
  left: 22px; top: 50%;
  transform: translateY(-50%);
  color: #FBBF24; font-size: 18px;
  transition: all 0.3s ease;
  text-shadow: 0 0 10px rgba(255,200,80,0.7);
}
.choice-box a:hover {
  background: linear-gradient(180deg, rgba(244,197,66,0.18) 0%, rgba(180,120,20,0.12) 100%);
  border-color: rgba(244,197,66,0.95);
  color: #FFF8E7;
  transform: translateX(6px);
  box-shadow:
    0 14px 38px rgba(0,0,0,0.7),
    0 0 30px rgba(255,200,80,0.3);
}
.choice-box a:hover::before { color: #FFD700; transform: translateY(-50%) translateX(4px); }
.choice-box a:active { transform: translateX(6px) scale(0.995); }

.title-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: space-between;
  padding: 10vh 20px 8vh; z-index: 200;
  background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.15) 30%, rgba(0,0,0,0.3) 65%, rgba(0,0,0,0.85) 100%);
}
.title-logo { text-align: center; animation: titleFadeIn 1.3s ease-out; }
@keyframes titleFadeIn {
  from { opacity: 0; transform: translateY(-30px); }
  to   { opacity: 1; transform: translateY(0); }
}
.title-main {
  font-size: clamp(38px, 6vw, 76px);
  color: #FFF8E7;
  text-shadow:
    -3px -3px 0 #8B4513, 3px -3px 0 #8B4513,
    -3px 3px 0 #8B4513, 3px 3px 0 #8B4513,
     0 0 40px rgba(255, 220, 100, 1),
     0 0 80px rgba(255, 180, 50, 0.7),
     6px 6px 30px rgba(0, 0, 0, 0.9);
  letter-spacing: 8px; margin: 0; font-weight: bold;
  animation: titleGlow 3.6s ease-in-out infinite;
}
@keyframes titleGlow {
  0%,100% {
    text-shadow:
      -3px -3px 0 #8B4513, 3px -3px 0 #8B4513,
      -3px 3px 0 #8B4513, 3px 3px 0 #8B4513,
      0 0 40px rgba(255,220,100,1),
      0 0 80px rgba(255,180,50,0.7),
      6px 6px 30px rgba(0,0,0,0.9);
  }
  50% {
    text-shadow:
      -3px -3px 0 #8B4513, 3px -3px 0 #8B4513,
      -3px 3px 0 #8B4513, 3px 3px 0 #8B4513,
      0 0 65px rgba(255,240,150,1),
      0 0 120px rgba(255,200,80,0.9),
      6px 6px 30px rgba(0,0,0,0.9);
  }
}
.title-sub {
  font-size: clamp(14px, 1.2vw, 19px);
  color: #FFF3C4;
  text-shadow: 2px 2px 0 #8B4513, 3px 3px 8px rgba(0,0,0,0.95);
  font-style: italic; margin-top: 14px; letter-spacing: 6px;
  text-transform: uppercase;
}
.title-menu {
  display: flex; flex-direction: column; gap: 14px;
  width: min(340px, 80vw);
  animation: titleFadeIn 1s ease-out 0.4s backwards;
}
.title-menu button {
  display: block;
  background: linear-gradient(180deg, rgba(28,22,14,0.9) 0%, rgba(14,10,6,0.95) 100%);
  color: #FFE9A8;
  padding: 15px 26px;
  border-radius: 4px;
  border: 1px solid rgba(244,197,66,0.6);
  cursor: pointer;
  font-size: clamp(13px, 1.05vw, 16px);
  font-weight: bold; font-family: inherit; text-align: center;
  letter-spacing: 2.5px; text-transform: uppercase;
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 8px 24px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  -webkit-tap-highlight-color: transparent;
}
.title-menu button:hover {
  background: linear-gradient(180deg, rgba(244,197,66,0.2) 0%, rgba(180,120,20,0.15) 100%);
  color: #FFF8E7;
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 16px 40px rgba(0,0,0,0.7), 0 0 30px rgba(255,200,80,0.5);
  border-color: rgba(244,197,66,1);
}
.title-footer {
  font-size: clamp(11px, 0.9vw, 13px);
  color: #FFF3C4;
  text-shadow: 2px 2px 6px rgba(0,0,0,0.95);
  letter-spacing: 4px; font-style: italic; opacity: 0.9; margin: 0;
  text-transform: uppercase;
}
.title-endings {
  position: fixed; left: 50%; bottom: 10vh;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.82);
  color: #FFD700;
  padding: 12px 32px;
  border: 1px solid rgba(255,215,0,0.9);
  border-radius: 999px;
  font-size: clamp(12px, 1vw, 15px);
  letter-spacing: 2px;
  text-shadow: 0 0 10px rgba(255,215,0,0.8), 1px 1px 4px rgba(0,0,0,0.95);
  box-shadow: 0 8px 32px rgba(255,215,0,0.35);
  z-index: 210;
  text-transform: uppercase;
}

.dialogue-text::-webkit-scrollbar { width: 6px; }
.dialogue-text::-webkit-scrollbar-track { background: rgba(255,243,196,0.1); border-radius: 3px; }
.dialogue-text::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #FBBF24, #F59E0B); border-radius: 3px; }

@media (max-width: 768px) {
  .dialogue-box { width: 94vw; max-height: 44vh; bottom: 2vh; }
  .speaker-name { top: -22px; left: 22px; padding: 8px 20px 7px; font-size: 14px; min-width: 100px; }
  .dialogue-text { font-size: 15px; padding: 30px 26px 26px; line-height: 1.7; }
  .choice-box { bottom: 50vh; width: 92vw; gap: 10px; }
  .choice-box a { padding: 13px 20px 13px 50px; font-size: 14px; }
  .choice-box a::before { left: 18px; font-size: 16px; }
}
@media (max-width: 480px) {
  .dialogue-box { width: 96vw; max-height: 50vh; bottom: 1.5vh; }
  .speaker-name { top: -20px; left: 16px; padding: 6px 16px; font-size: 13px; }
  .dialogue-text { font-size: 14px; padding: 28px 20px 22px; line-height: 1.65; }
  .choice-box { bottom: 56vh; width: 96vw; gap: 8px; }
  .choice-box a { padding: 11px 16px 11px 42px; font-size: 13px; }
  .title-main { font-size: 30px; letter-spacing: 4px; }
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-spinner"></div>
  <div class="loading-text">Загрузка долины...</div>
</div>

<audio id="bgMusic" loop preload="auto" src="audio/main_theme.mp3"></audio>

<div class="bg-layer" id="bgLayer"></div>
<div class="particles-layer" id="particlesLayer"></div>
<div class="vignette-layer"></div>

<div class="click-layer" id="clickLayer" style="position:fixed;inset:0;z-index:90;display:none;"></div>

<div id="gameArea"></div>

<script>
/* ============================================================
   ПЕСНЬ АВГУСТА — упрощённая версия (2 концовки)
   ============================================================ */

const LOCATION_BG = {
  title:        'images/bg_01.png',
  start:        'images/bg_02.png',
  house:        'images/bg_04.png',
  table:        'images/bg_06.png',
  letter:       'images/bg_05.png',
  parchment:    'images/bg_08.png',
  table2:       'images/bg_09.png',
  most:         'images/sprite/bg_02.png',
  tropa:        'images/sprite/bg_03.png',
  lavka:        'images/sprite/bg_03.png',
  tower:        'images/sprite/bg_03.png',
  tower_inside: 'images/sprite/bg_04.png',
  final:        'images/sprite/bg_01.png',
  epilogue:     'images/bg_09.png'
};

/* ============================================================
   ПАССАЖИ — линейный сюжет с двумя концовками
   ============================================================ */
const PASSAGES = {
  title: { isTitle: true },

  Start1: {
    location: 'start',
    speaker: 'Рассказчик', boxClass: 'narrator',
    text: `Верхний Шепот раскинулся на берегу тихого озера, у подножия заснеженных гор. Здесь пахнет сушёными яблоками, речной мятой и смолой. Сегодня — Праздник Осенней Звезды. Но что-то пошло не так.`,
    next: 'Start2'
  },
  Start2: {
    location: 'house',
    speaker: 'Рассказчик', boxClass: 'narrator',
    text: `Вы — молодой травник, ученик мастера Олвена. Ваш дом стоит на краю города, среди яблоневых садов. Этим утром вы проснулись от тишины: обычно над озером уже гудели пчёлы и сновали лодки. Сегодня — тихо.`,
    next: 'Start3'
  },
  Start3: {
    location: 'table',
    speaker: 'Мира', boxClass: 'mira',
    text: `— Подъём, Хранитель трав и ветров! — звонко бросила Мира, заглядывая через плечо. Её рыжие кудри пахли машинным маслом и полевыми цветами. — Мастер Олвен передал, что в маяке заклинило рунный резонатор. Я взяла отмычки, разводной ключ и банку лучшей графитовой смазки. А у тебя что в письме?`,
    choices: [
      { text: 'Вскрыть письмо мастера Олвена', to: 'Letter' },
      { text: 'Сначала обсудить маршрут к маяку', to: 'RouteChoice' }
    ]
  },
  Letter: {
    location: 'parchment',
    speaker: 'Мастер Олвен', boxClass: 'olven',
    text: `«Мой юный друг! Сердце маяка — живое существо, древний Звёздный Светляк по имени Август. Он не переносит грубой силы и фальшивых нот. Если механизм замер, ищите причину не в поломке металла, а в нарушении гармонии. Возьмите с собой частицу стихии и помните: свет рождается из дружбы, а не из принуждения».`,
    next: 'Letter2'
  },
  Letter2: {
    location: 'table2',
    speaker: 'Мира', boxClass: 'mira',
    text: `Мира заглянула через плечо и тихонько присвистнула. — «Свет рождается из дружбы»... Красиво сказано, но без шестерёнок он всё равно не закрутится! Ладно, Олвен мудр. Как пойдём к холму Светлячков?`,
    next: 'RouteChoice'
  },
  RouteChoice: {
    location: 'table2',
    speaker: 'Мира', boxClass: 'mira',
    text: `Тогда решай, как пойдём. Через мост — дольше, но спокойнее. Через Грибную тропу — быстрее, но там сумрачно. Или заглянем к бабушке Селесте — она всегда что-то подскажет.`,
    choices: [
      { text: 'Пойти через Старый каменный мост', to: 'Bridge' },
      { text: 'Срезать через Грибную тропу', to: 'Forest' },
      { text: 'Сначала заглянуть к травнице Селесте', to: 'Selesta' }
    ]
  },

  /* === ПУТЬ: МОСТ → БРУНО === */
  Bridge: {
    location: 'most',
    speaker: 'Рассказчик', boxClass: 'narrator',
    text: `Старый каменный мост вздымался над бурным ручьём. Прямо по центру, развалившись на нагретых солнцем камнях, дремал пушистый каменный гаргуль Бруно.`,
    next: 'Bridge2'
  },
  Bridge2: {
    location: 'most',
    speaker: 'Бруно', boxClass: 'bruno',
    text: `— Ба, знакомые лица! — пробасил он. — Куда путь держите? Уж не к маяку ли?`,
    next: 'Bridge3'
  },
  Bridge3: {

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
const gameState = {
  currentPassage: 'title',
  variables: {},
  endings: {},
  isTyping: false,
  typewriterTimer: null
};

/* ============================================================
   ЗВУК
   ============================================================ */
const bgMusic = document.getElementById('bgMusic');
let musicStarted = false;

function startMusic() {
  if (musicStarted || !bgMusic) return;
  bgMusic.volume = 0.5;
  const p = bgMusic.play();
  if (p && p.catch) {
    p.then(() => { musicStarted = true; }).catch(() => {
      const kick = () => {
        bgMusic.play().then(() => {
          musicStarted = true;
          document.removeEventListener('click', kick);
          document.removeEventListener('keydown', kick);
        }).catch(() => {});
      };
      document.addEventListener('click', kick);
      document.addEventListener('keydown', kick);
    });
  } else { musicStarted = true; }
}

/* ============================================================
   ФОН
   ============================================================ */
let bgSwapTimer = null;
function setBackground(locationKey) {
  const bg = document.getElementById('bgLayer');
  const url = LOCATION_BG[locationKey];
  if (!url) return;
  if (bgSwapTimer) { clearTimeout(bgSwapTimer); bgSwapTimer = null; }
  bg.style.opacity = '0';
  bgSwapTimer = setTimeout(() => {
    bg.style.backgroundImage = `url("${url}")`;
    bg.style.opacity = '1';
    bgSwapTimer = null;
  }, 500);
}

/* ============================================================
   ЧАСТИЦЫ
   ============================================================ */
function initParticles() {
  const layer = document.getElementById('particlesLayer');
  if (!layer) return;
  layer.innerHTML = '';
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.bottom = '-20px';
    p.style.animationDuration = (14 + Math.random() * 18) + 's';
    p.style.animationDelay = (Math.random() * 15) + 's';
    const scale = 0.5 + Math.random() * 1.4;
    p.style.width = (3 * scale) + 'px';
    p.style.height = (3 * scale) + 'px';
    layer.appendChild(p);
  }
}

/* ============================================================
   ПЕЧАТАЮЩИЙСЯ ТЕКСТ
   ============================================================ */
function typeText(element, html, speed, callback) {
  const tokens = [];
  let i = 0;
  while (i < html.length) {
    if (html[i] === '<') {
      const end = html.indexOf('>', i);
      if (end === -1) { tokens.push(html[i]); i++; continue; }
      tokens.push(html.slice(i, end + 1));
      i = end + 1;
    } else { tokens.push(html[i]); i++; }
  }
  element.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'type-cursor';
  cursor.textContent = '▍';
  element.appendChild(cursor);

  let idx = 0;
  function step() {
    if (idx >= tokens.length) {
      cursor.remove();
      element.innerHTML = html;
      gameState.isTyping = false;
      if (callback) callback();
      return;
    }
    const t = tokens[idx++];
    cursor.insertAdjacentHTML('beforebegin', t);
    if (t.startsWith('<')) step();
    else gameState.typewriterTimer = setTimeout(step, speed);
  }
  step();
}

/* ============================================================
   ПЕРЕХОДЫ
   ============================================================ */
function advance() {
  const passage = PASSAGES[gameState.currentPassage];
  if (!passage || passage.isTitle) return;

  if (gameState.isTyping) {
    if (gameState.typewriterTimer) { clearTimeout(gameState.typewriterTimer); gameState.typewriterTimer = null; }
    const textEl = document.getElementById('dialogueText');
    if (textEl) textEl.innerHTML = passage.text || '';
    gameState.isTyping = false;
    return;
  }
  if (passage.choices && passage.choices.length > 0) return;
  if (passage.next) {
    if (passage.next === 'title') {
      renderPassage('title');
    } else {
      renderPassage(passage.next);
    }
  }
}

function renderPassage(id) {
  const passage = PASSAGES[id];
  if (!passage) { console.error('Пассаж не найден:', id); return; }

  if (gameState.typewriterTimer) { clearTimeout(gameState.typewriterTimer); gameState.typewriterTimer = null; }
  gameState.isTyping = false;
  gameState.currentPassage = id;

  if (passage.isTitle) { renderTitleScreen(); return; }

  if (passage.set) Object.assign(gameState.variables, passage.set);
  if (passage.ending) gameState.endings[passage.ending] = true;

  setBackground(passage.location);

  let navHTML = '';
  if (passage.choices && passage.choices.length > 0) {
    navHTML = '<div class="choice-box">' + passage.choices.map(c =>
      `<a data-to="${c.to}"><span>${c.text}</span></a>`
    ).join('') + '</div>';
  }

  const boxClass = passage.boxClass || 'narrator';
  const speaker = passage.speaker || '';

  const boxHTML = `
    <div class="dialogue-box ${boxClass}">
      ${speaker ? `<div class="speaker-name">${speaker}</div>` : ''}
      <div class="dialogue-text" id="dialogueText"></div>
      ${(!passage.choices || passage.choices.length === 0) && passage.next ? '<div class="next-hint">▼</div>' : ''}
    </div>
  `;

  const gameArea = document.getElementById('gameArea');
  gameArea.innerHTML = boxHTML + navHTML;

  gameArea.querySelectorAll('[data-to]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const to = btn.dataset.to;
      if (to === 'title') renderPassage('title');
      else renderPassage(to);
    });
  });

  const dialogueBox = gameArea.querySelector('.dialogue-box');
  if (dialogueBox) {
    dialogueBox.addEventListener('click', (e) => {
      if (e.target.closest('[data-to]')) return;
      e.stopPropagation();
      advance();
    });
  }

  const textEl = document.getElementById('dialogueText');
  const text = passage.text || '';
  gameState.isTyping = true;
  typeText(textEl, text, 35, () => { gameState.isTyping = false; });

  const clickLayer = document.getElementById('clickLayer');
  if (clickLayer) {
    if (passage.choices && passage.choices.length > 0) {
      clickLayer.style.display = 'none';
    } else {
      clickLayer.style.display = 'block';
    }
  }
}

/* ============================================================
   ТИТУЛЬНЫЙ ЭКРАН
   ============================================================ */
function renderTitleScreen() {
  gameState.currentPassage = 'title';
  setBackground('title');
  const clickLayer = document.getElementById('clickLayer');
  if (clickLayer) clickLayer.style.display = 'none';

  const gameArea = document.getElementById('gameArea');
  const endingsCount = Object.keys(gameState.endings).length;

  gameArea.innerHTML = `
    <div class="title-screen">
      <div class="title-logo">
        <h1 class="title-main">Песнь Августа</h1>
        <p class="title-sub">Интерактивная сказка</p>
      </div>
      <div class="title-menu">
        <button id="btnStart">▶ Начать историю</button>
        <button id="btnRestart">🔄 Сбросить прогресс</button>
      </div>
      <p class="title-footer">Верхний Шепот · Праздник Осенней Звезды</p>
    </div>
    <div class="title-endings">🏆 Концовок открыто: <b>${endingsCount} / 2</b></div>
  `;

  document.getElementById('btnStart').addEventListener('click', () => {
    gameState.variables = {};
    renderPassage('Start1');
  });
  document.getElementById('btnRestart').addEventListener('click', () => {
    if (confirm('Сбросить весь прогресс?')) {
      gameState.endings = {};
      gameState.variables = {};
      renderTitleScreen();
    }
  });
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
function init() {
  startMusic();
  initParticles();

  const clickLayerEl = document.getElementById('clickLayer');
  if (clickLayerEl) clickLayerEl.addEventListener('click', advance);

  document.addEventListener('keydown', ev => {
    if (ev.key === ' ' || ev.key === 'Enter') {
      ev.preventDefault();
      advance();
    }
  });

  setTimeout(() => {
    const loading = document.getElementById('loadingScreen');
    if (loading) loading.classList.add('hidden');
  }, 700);

  renderPassage('title');
}

document.addEventListener('DOMContentLoaded', init);
