<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Песнь Августа</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* ===== БАЗА ===== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:Georgia,serif;background:#0a0a14;color:#eee;user-select:none;-webkit-tap-highlight-color:transparent}

/* ===== ФОН ===== */
#bg{position:fixed;inset:0;background-size:cover;background-position:center;z-index:1;transition:opacity .8s ease,background-image .8s ease;opacity:1}
#bg.fade{opacity:0}

/* ===== СПРАЙТ ПЕРСОНАЖА ===== */
#sprite{position:fixed;left:5%;bottom:0;height:75vh;max-height:720px;z-index:5;pointer-events:none;filter:drop-shadow(0 8px 24px rgba(0,0,0,.7));transition:opacity .5s ease,transform .5s ease;opacity:0;transform:translateY(20px)}
#sprite.show{opacity:1;transform:translateY(0)}

/* ===== ВИНЬЕТКА ===== */
#vignette{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(0,0,0,.75) 100%)}

/* ===== ДИАЛОГ ===== */
#dialogue{position:fixed;left:50%;bottom:4vh;transform:translateX(-50%);width:min(1100px,92vw);max-height:38vh;background:linear-gradient(180deg,rgba(28,22,14,.94),rgba(14,10,6,.98));border:1px solid rgba(244,197,66,.6);border-radius:6px;padding:28px 36px 24px;z-index:100;box-shadow:0 20px 60px rgba(0,0,0,.8),0 0 60px rgba(255,200,80,.12),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(12px);cursor:pointer;animation:dialogueIn .5s cubic-bezier(.22,1,.36,1)}
@keyframes dialogueIn{from{opacity:0;transform:translateX(-50%) translateY(30px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

#speaker{position:absolute;top:-24px;left:32px;padding:9px 22px;background:linear-gradient(180deg,#d97706,#a04b0a);color:#FFF8E7;font-weight:bold;font-size:15px;letter-spacing:2px;border-radius:3px;border:1px solid rgba(244,197,66,.95);box-shadow:0 8px 22px rgba(0,0,0,.7),0 0 20px rgba(255,180,50,.3);text-shadow:1px 1px 3px rgba(0,0,0,.85)}
#speaker::after{content:'';position:absolute;bottom:-6px;left:20px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:7px solid #a04b0a}

#text{color:#f5ecd7;font-size:clamp(15px,1.15vw,18px);line-height:1.8;text-shadow:0 1px 3px rgba(0,0,0,.95);max-height:26vh;overflow-y:auto;letter-spacing:.2px}
#text b{color:#FFE9A8}
#text i,#text em{color:#d8c9a8;font-style:italic}
#text::-webkit-scrollbar{width:5px}
#text::-webkit-scrollbar-thumb{background:#FBBF24;border-radius:3px}

.cursor{display:inline-block;color:#FFD700;animation:blink .8s steps(2) infinite;font-weight:bold;margin-left:2px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

#next-hint{position:absolute;right:24px;bottom:14px;color:#FFD700;font-size:22px;opacity:.85;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(6px);opacity:1}}

/* ===== ВЫБОРЫ ===== */
#choices{position:fixed;left:50%;bottom:44vh;transform:translateX(-50%);width:min(720px,88vw);display:flex;flex-direction:column;gap:12px;z-index:101;animation:choicesIn .5s cubic-bezier(.22,1,.36,1)}
@keyframes choicesIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.choice{position:relative;padding:15px 24px 15px 54px;background:linear-gradient(180deg,rgba(28,22,14,.94),rgba(14,10,6,.97));color:#F5ECD7;border:1px solid rgba(244,197,66,.5);border-radius:4px;cursor:pointer;font-size:clamp(13px,1vw,15px);line-height:1.4;transition:all .3s cubic-bezier(.22,1,.36,1);box-shadow:0 8px 22px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(10px)}
.choice::before{content:'▸';position:absolute;left:20px;top:50%;transform:translateY(-50%);color:#FBBF24;font-size:17px;transition:all .3s}
.choice:hover{background:linear-gradient(180deg,rgba(244,197,66,.18),rgba(180,120,20,.12));border-color:#FBBF24;color:#FFF8E7;transform:translateX(6px);box-shadow:0 14px 34px rgba(0,0,0,.7),0 0 26px rgba(255,200,80,.3)}
.choice:hover::before{transform:translateY(-50%) translateX(4px);color:#FFD700}
.choice.locked{opacity:.45;cursor:not-allowed;border-style:dashed}
.choice.locked::before{content:'🔒'}
.choice .need{color:#e07b39;font-size:.85em;font-style:italic;margin-left:.3em}

/* ===== КНОПКИ УПРАВЛЕНИЯ ===== */
#nav{position:fixed;top:16px;left:16px;display:flex;gap:10px;z-index:200}
#menu{position:fixed;top:16px;right:16px;display:flex;gap:10px;z-index:200}

.btn{width:46px;height:46px;border-radius:50%;border:1px solid rgba(244,197,66,.7);background:linear-gradient(180deg,rgba(28,22,14,.9),rgba(14,10,6,.95));color:#FBBF24;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;box-shadow:0 6px 18px rgba(0,0,0,.6);backdrop-filter:blur(8px);font-family:Georgia,serif}
.btn:hover:not(:disabled){transform:translateY(-3px) scale(1.08);box-shadow:0 12px 28px rgba(0,0,0,.7),0 0 22px rgba(255,200,80,.5);border-color:#FBBF24;color:#FFD700}
.btn:disabled{opacity:.3;cursor:not-allowed}

/* ===== УВЕДОМЛЕНИЕ ===== */
#notify{position:fixed;top:80px;right:20px;padding:14px 22px;background:linear-gradient(180deg,rgba(217,119,6,.97),rgba(160,75,10,.97));color:#FFF8E7;border:1px solid rgba(244,197,66,.9);border-left:4px solid #FBBF24;border-radius:6px;font-size:14px;max-width:320px;z-index:400;opacity:0;transform:translateX(80px);transition:all .5s cubic-bezier(.22,1,.36,1);pointer-events:none;box-shadow:0 12px 34px rgba(0,0,0,.7),0 0 26px rgba(255,180,50,.4);backdrop-filter:blur(8px)}
#notify.show{opacity:1;transform:translateX(0)}
#notify b{color:#FFE9A8;display:block;margin-bottom:4px;font-size:11px;letter-spacing:2px;text-transform:uppercase}
#notify.warn{background:linear-gradient(180deg,rgba(180,60,30,.97),rgba(120,30,10,.97));border-left-color:#F87171}

/* ===== ПРЕДМЕТ ===== */
#item{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);padding:24px 36px;background:linear-gradient(180deg,rgba(28,22,14,.97),rgba(14,10,6,.99));border:2px solid rgba(244,197,66,.95);border-radius:10px;text-align:center;z-index:450;opacity:0;pointer-events:none;transition:all .5s cubic-bezier(.22,1,.36,1);box-shadow:0 30px 80px rgba(0,0,0,.85),0 0 60px rgba(255,200,80,.5);backdrop-filter:blur(10px)}
#item.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#item .icon{font-size:48px;margin-bottom:8px;filter:drop-shadow(0 0 18px rgba(255,200,80,.9))}
#item .label{color:#FBBF24;font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}
#item .name{color:#FFF8E7;font-size:19px;font-weight:bold;letter-spacing:1px}
#item .hint{color:#d8c9a8;font-size:13px;font-style:italic;margin-top:8px;max-width:300px}

/* ===== ТИТУЛЬНЫЙ ЭКРАН ===== */
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8vh 20px 6vh;z-index:300;background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,.15) 30%,rgba(0,0,0,.3) 65%,rgba(0,0,0,.85))}
#title h1{font-size:clamp(36px,6vw,72px);color:#FFF8E7;text-shadow:-3px -3px 0 #8B4513,3px -3px 0 #8B4513,-3px 3px 0 #8B4513,3px 3px 0 #8B4513,0 0 40px rgba(255,220,100,1),0 0 80px rgba(255,180,50,.7),6px 6px 30px rgba(0,0,0,.9);letter-spacing:8px;text-align:center;animation:glow 3.6s ease-in-out infinite}
@keyframes glow{0%,100%{text-shadow:-3px -3px 0 #8B4513,3px -3px 0 #8B4513,-3px 3px 0 #8B4513,3px 3px 0 #8B4513,0 0 40px rgba(255,220,100,1),0 0 80px rgba(255,180,50,.7),6px 6px 30px rgba(0,0,0,.9)}50%{text-shadow:-3px -3px 0 #8B4513,3px -3px 0 #8B4513,-3px 3px 0 #8B4513,3px 3px 0 #8B4513,0 0 65px rgba(255,240,150,1),0 0 120px rgba(255,200,80,.9),6px 6px 30px rgba(0,0,0,.9)}}
#title .sub{font-size:clamp(13px,1.1vw,17px);color:#FFF3C4;text-shadow:2px 2px 0 #8B4513,3px 3px 8px rgba(0,0,0,.95);font-style:italic;margin-top:12px;letter-spacing:6px;text-transform:uppercase;text-align:center}
#title .menu{display:flex;flex-direction:column;gap:12px;width:min(320px,80vw)}
#title button{padding:14px 24px;background:linear-gradient(180deg,rgba(28,22,14,.9),rgba(14,10,6,.95));color:#FFE9A8;border:1px solid rgba(244,197,66,.6);border-radius:4px;cursor:pointer;font-size:clamp(12px,1vw,15px);font-weight:bold;font-family:inherit;letter-spacing:2px;text-transform:uppercase;transition:all .3s;box-shadow:0 8px 22px rgba(0,0,0,.6)}
#title button:hover:not(:disabled){background:linear-gradient(180deg,rgba(244,197,66,.2),rgba(180,120,20,.15));color:#FFF8E7;transform:translateY(-3px);box-shadow:0 14px 36px rgba(0,0,0,.7),0 0 26px rgba(255,200,80,.5);border-color:#FBBF24}
#title button:disabled{opacity:.35;cursor:not-allowed}
#title .footer{font-size:12px;color:#FFF3C4;text-shadow:2px 2px 6px rgba(0,0,0,.95);letter-spacing:4px;font-style:italic;text-transform:uppercase;text-align:center}
#title .endings{position:absolute;left:50%;bottom:14vh;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#FFD700;padding:10px 28px;border:1px solid rgba(255,215,0,.9);border-radius:999px;font-size:13px;letter-spacing:2px;text-transform:uppercase;backdrop-filter:blur(8px)}

/* ===== МОДАЛКА ===== */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
#modal.hidden{display:none}
#modal .box{background:linear-gradient(180deg,#1a1410,#0d0a08);border:1px solid rgba(244,197,66,.6);max-width:620px;width:100%;max-height:84vh;overflow-y:auto;padding:28px;border-radius:6px;box-shadow:0 40px 100px rgba(0,0,0,.9),0 0 60px rgba(255,200,80,.15);animation:modalIn .4s cubic-bezier(.22,1,.36,1)}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
#modal h2{margin:0 0 20px;color:#FBBF24;text-transform:uppercase;font-size:17px;letter-spacing:3px;border-bottom:1px solid rgba(244,197,66,.25);padding-bottom:12px}
#modal h3{color:#FBBF24;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin:18px 0 10px}
#modal .item-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(244,197,66,.1)}
#modal .item-icon{font-size:24px}
#modal .item-name{color:#eee;font-weight:bold}
#modal .item-hint{color:#999;font-size:12px;font-style:italic;margin-top:3px}
#modal .status{padding:12px 16px;border-radius:6px;margin-bottom:8px;font-size:13px}
#modal .status.ready{background:rgba(139,171,122,.12);border:1px solid rgba(139,171,122,.4);color:#a8d49a}
#modal .status.locked{background:rgba(224,138,76,.08);border:1px solid rgba(224,138,76,.3);color:#c9c0a6}
#modal .need{font-size:12px;color:#e07b39;margin-top:4px;font-style:italic}
#modal button{margin-top:20px;padding:10px 22px;background:linear-gradient(180deg,rgba(60,100,180,.95),rgba(35,65,135,.95));color:#fff;border:1px solid rgba(100,140,220,.9);border-radius:4px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;transition:all .25s;float:right}
#modal button:hover{background:linear-gradient(180deg,rgba(80,130,220,1),rgba(45,85,165,1));transform:translateY(-2px)}

/* ===== АДАПТИВ ===== */
@media(max-width:768px){
  #dialogue{width:94vw;max-height:42vh;bottom:2vh;padding:24px 22px 20px}
  #speaker{top:-20px;left:20px;padding:7px 18px;font-size:13px}
  #text{font-size:15px;max-height:30vh;line-height:1.7}
  #choices{bottom:50vh;width:92vw;gap:10px}
  .choice{padding:12px 18px 12px 44px;font-size:13px}
  .btn{width:42px;height:42px;font-size:17px}
  #sprite{height:60vh;left:2%}
}
@media(max-width:480px){
  #title h1{font-size:30px;letter-spacing:4px}
  #title .sub{font-size:11px;letter-spacing:3px}
  #dialogue{padding:22px 18px 18px}
  #text{font-size:14px}
  .choice{padding:11px 14px 11px 38px;font-size:12.5px}
}
</style>
</head>
<body>

<!-- ФОН + СПРАЙТ + ВИНЬЕТКА -->
<div id="bg"></div>
<div id="sprite"></div>
<div id="vignette"></div>

<!-- АУДИО -->
<audio id="music" loop preload="auto" src="audio/main_theme.mp3"></audio>

<!-- УПРАВЛЕНИЕ -->
<div id="nav" style="display:none">
  <button class="btn" id="back" title="Назад">←</button>
  <button class="btn" id="forward" title="Вперёд">→</button>
</div>
<div id="menu" style="display:none">
  <button class="btn" id="journal" title="Журнал">📖</button>
  <button class="btn" id="home" title="Меню">🏠</button>
</div>

<!-- ИГРОВАЯ ЗОНА -->
<div id="game"></div>

<!-- УВЕДОМЛЕНИЕ И ПРЕДМЕТ -->
<div id="notify"></div>
<div id="item">
  <div class="icon" id="item-icon">✨</div>
  <div class="label">Получен предмет</div>
  <div class="name" id="item-name"></div>
  <div class="hint" id="item-hint"></div>
</div>

<!-- МОДАЛКА -->
<div id="modal" class="hidden"><div class="box" id="modal-box"></div></div>

<script>
/* ============================================================
   ПЕСНЬ АВГУСТА — лёгкая версия
   3 концовки · предметы · сохранение · катсцены
   ============================================================ */

/* ---------- НАСТРОЙКИ АССЕТОВ ---------- */
const BG = {
  title:      'images/bg_start.png',
  forest:     'images/bg_start.png',
  bridge:     'images/bg_bridge.png',
  tower:      'images/bg_tower.png',
  inside:     'images/bg_inside.png',
  final:      'images/cutscene_1.png'
};

const SPRITES = {
  mira:    'images/sprite_mira.png',
  bruno:   'images/sprite_bruno.png',
  august:  'images/sprite_august.png',
  corn:    'images/sprite_cornelius.png'
};

/* ---------- ПРЕДМЕТЫ ---------- */
const ITEMS = {
  feather: {icon:'🪶', name:'Перо Лазурной Сойки', hint:'Очищает трубки от пыли'},
  crystal: {icon:'💎', name:'Кристалл Кварца',     hint:'Фокусирует оптику маяка'},
  vial:    {icon:'🧪', name:'Флакон Селесты',      hint:'Пробуждает Августа'},
  key:     {icon:'🔑', name:'Латунный ключ',       hint:'Калибровка призм'},
  scheme:  {icon:'📜', name:'Схема Олвена',        hint:'Угол 45° к линзе'}
};

/* ---------- СОСТОЯНИЕ ИГРЫ ---------- */
const SAVE_KEY = 'pesn_augusta_v1';
let state = {
  passage: 'title',
  history: [],
  hi: -1,
  vars: {},
  endings: {},
  typing: false,
  timer: null
};

/* ---------- ПАССАЖИ (лёгкая версия — только ключевые сцены) ---------- */
const P = {

  /* ===== УТРО ===== */
  Start1: {
    bg:'forest',
    text:`Утро в Верхнем Шепоте пахло сушёными яблоками, речной мятой и смолой. Солнце только коснулось шпилей ремесленных гильдий, а вы уже затягивали ремешок дорожной сумки травника.`,
    next:'Start2'
  },
  Start2: {
    bg:'forest',
    speaker:'Рассказчик',
    text:`На столе лежало тяжёлое письмо от мастера Олвена. Сегодня — праздник Осенней Звезды, но Главный Маяк в роще Заблудших Светлячков погас.`,
    next:'Start3'
  },
  Start3: {
    bg:'forest', sprite:'mira',
    speaker:'Мира',
    text:`— Подъём, Хранитель трав и ветров! Мастер Олвен передал, что в маяке заклинило рунный резонатор. Я взяла отмычки, разводной ключ и банку графитовой смазки. А у тебя что в письме?`,
    choices:[
      {text:'Вскрыть письмо Олвена', to:'Letter'},
      {text:'Пошутить над Мирой', to:'Joke'},
      {text:'Сразу обсудить маршрут', to:'Route'}
    ]
  },
  Letter: {
    bg:'forest', sprite:'mira',
    speaker:'Мастер Олвен',
    text:`«Мой юный друг! Сердце маяка — живое существо, Звёздный Светляк Август. Он не переносит фальшивых нот. Ищите причину не в поломке металла, а в нарушении гармонии».`,
    set:{scheme:true},
    next:'Route'
  },
  Joke: {
    bg:'forest', sprite:'mira',
    speaker:'Вы',
    text:`— Ты собралась чинить маяк или перестраивать часовую башню столицы?`,
    next:'Joke2'
  },
  Joke2: {
    bg:'forest', sprite:'mira',
    speaker:'Мира',
    text:`— Настоящий механик готов ко всему! Ну так что пишет Олвен?`,
    next:'Letter'
  },
  Route: {
    bg:'forest', sprite:'mira',
    speaker:'Мира',
    text:`— Как пойдём к холму Светлячков?`,
    choices:[
      {text:'Через Старый каменный мост', to:'Bridge'},
      {text:'К травнице Селесте', to:'Selesta'}
    ]
  },

  /* ===== СЕЛЕСТА ===== */
  Selesta: {
    bg:'forest',
    speaker:'Бабушка Селеста',
    text:`— Батюшки, юные мастера! Возьмите-ка капли лунного зверобоя. Если Август закапризничает — пара капель вернут ему бодрость.`,
    set:{vial:true},
    next:'Bridge'
  },

  /* ===== МОСТ ===== */
  Bridge: {
    bg:'bridge', sprite:'bruno',
    speaker:'Бруно',
    text:`— Ба, знакомые лица! Куда путь держите? Слушайте загадку: «Не имеет крыльев, а летает; не имеет голоса, а воет».`,
    choices:[
      {text:'«Это горный ветер!»', to:'Wind'},
      {text:'«Это лесное эхо»', to:'Echo'},
      {text:'Угостить яблоком', to:'Treat'},
      {text:'Расспросить про башню', to:'Ask'}
    ]
  },
  Wind: {
    bg:'bridge', sprite:'bruno',
    speaker:'Бруно',
    text:`— В самую точку! Держи Перо Лазурной Сойки — оно смахивает пыль веков.`,
    set:{feather:true},
    next:'TowerOut'
  },
  Echo: {
    bg:'bridge', sprite:'bruno',
    speaker:'Бруно',
    text:`— Поэзии много, а физика хромает! Но за красивый слог пропускаю.`,
    next:'TowerOut'
  },
  Treat: {
    bg:'bridge', sprite:'bruno',
    speaker:'Бруно',
    text:`— Боги гранита, какая сладость! Держи Кристалл Кварца — в оптике маяка ему самое место.`,
    set:{crystal:true},
    next:'TowerOut'
  },
  Ask: {
    bg:'bridge', sprite:'bruno',
    speaker:'Бруно',
    text:`— Около полуночи с башни сорвался серебристый всполох. Ветер дул с Заброшенной Обсерватории.`,
    choices:[
      {text:'«Это горный ветер!»', to:'Wind'},
      {text:'Угостить яблоком', to:'Treat'}
    ]
  },

  /* ===== БАШНЯ СНАРУЖИ ===== */
  TowerOut: {
    bg:'tower',
    speaker:'Мира',
    text:`— Загадка гильдии: «Лишь союз тепла и движения пробудит спящий свет». Что крутить будем?`,
    choices:[
      {text:'Солнце и Ветер', to:'Inside'},
      {text:'Вода и Росток', to:'WrongDoor'},
      {text:'Осмотреть окрестности', to:'Observatory'}
    ]
  },
  WrongDoor: {
    bg:'tower',
    speaker:'Мира',
    text:`— Освежает! Но подсказка гласила: «Тепло и движение»!`,
    next:'Inside'
  },
  Observatory: {
    bg:'inside',
    speaker:'Рассказчик',
    text:`Вы поднялись в старую Обсерваторию. На столе спал заводной кот Тик-Так с латунным ключом на ошейнике.`,
    choices:[

/* ============================================================
   СОХРАНЕНИЕ
   ============================================================ */
function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({
    p:state.passage, h:state.history, hi:state.hi,
    v:state.vars, e:state.endings
  })); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const s = JSON.parse(raw);
    state.passage = s.p || 'title';
    state.history = s.h || [];
    state.hi = typeof s.hi === 'number' ? s.hi : -1;
    state.vars = s.v || {};
    state.endings = s.e || {};
    return true;
  }catch(e){ return false; }
}
function reset(){
  state = {passage:'title', history:[], hi:-1, vars:{}, endings:{}, typing:false, timer:null};
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
}
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function has(k){ return !!state.vars[k]; }

function setBG(key){
  const el = document.getElementById('bg');
  el.classList.add('fade');
  setTimeout(()=>{
    el.style.backgroundImage = BG[key] ? `url("${BG[key]}")` : 'none';
    el.classList.remove('fade');
  }, 400);
}

function setSprite(key){
  const el = document.getElementById('sprite');
  if(!key || !SPRITES[key]){ el.classList.remove('show'); return; }
  el.style.backgroundImage = `url("${SPRITES[key]}")`;
  el.style.backgroundSize = 'contain';
  el.style.backgroundRepeat = 'no-repeat';
  el.style.backgroundPosition = 'bottom left';
  el.classList.add('show');
}

let notifyTimer;
function notify(title, text, type){
  const el = document.getElementById('notify');
  el.innerHTML = `<b>${title}</b>${text}`;
  el.classList.toggle('warn', type==='warn');
  el.classList.add('show');
  clearTimeout(notifyTimer);
  notifyTimer = setTimeout(()=>el.classList.remove('show'), 3000);
}

let itemTimer;
function showItem(key){
  const it = ITEMS[key]; if(!it) return;
  document.getElementById('item-icon').textContent = it.icon;
  document.getElementById('item-name').textContent = it.name;
  document.getElementById('item-hint').textContent = it.hint;
  const el = document.getElementById('item');
  el.classList.add('show');
  clearTimeout(itemTimer);
  itemTimer = setTimeout(()=>el.classList.remove('show'), 2400);
}

/* ============================================================
   ПЕЧАТАЮЩИЙСЯ ТЕКСТ
   ============================================================ */
function typeText(el, html, cb){
  const tokens = [];
  let i = 0;
  while(i < html.length){
    if(html[i] === '<'){
      const end = html.indexOf('>', i);
      if(end === -1){ tokens.push(html[i]); i++; continue; }
      tokens.push(html.slice(i, end+1));
      i = end + 1;
    } else { tokens.push(html[i]); i++; }
  }
  el.innerHTML = '';
  const cur = document.createElement('span');
  cur.className = 'cursor'; cur.textContent = '▍';
  el.appendChild(cur);

  let idx = 0;
  function step(){
    if(idx >= tokens.length){
      cur.remove(); el.innerHTML = html;
      state.typing = false;
      if(cb) cb();
      return;
    }
    const t = tokens[idx++];
    cur.insertAdjacentHTML('beforebegin', t);
    if(t.startsWith('<')) step();
    else state.timer = setTimeout(step, 35);
  }
  step();
}

/* ============================================================
   РЕНДЕР
   ============================================================ */
function renderTitle(){
  state.passage = 'title';
  document.getElementById('nav').style.display = 'none';
  document.getElementById('menu').style.display = 'none';
  setBG('title');
  setSprite(null);
  document.getElementById('game').innerHTML = '';

  const count = ['harmony','mastery','nature'].filter(k=>state.endings[k]).length;
  const canLoad = hasSave();

  const el = document.createElement('div');
  el.id = 'title';
  el.innerHTML = `
    <div>
      <h1>Песнь Августа</h1>
      <p class="sub">Интерактивная сказка</p>
    </div>
    <div class="menu">
      <button id="t-start">▶ Начать историю</button>
      <button id="t-load" ${canLoad?'':'disabled'}>📂 Продолжить</button>
      <button id="t-reset" ${canLoad?'':'disabled'}>🗑 Сбросить прогресс</button>
    </div>
    <p class="footer">Верхний Шепот · Праздник Осенней Звезды</p>
    <div class="endings">🏆 Концовок открыто: <b>${count} / 3</b></div>
  `;
  document.body.appendChild(el);

  document.getElementById('t-start').onclick = ()=>{ reset(); render('Start1'); };
  document.getElementById('t-load').onclick = ()=>{ if(load()) render(state.passage==='title'?'Start1':state.passage, false); };
  document.getElementById('t-reset').onclick = ()=>{ if(confirm('Сбросить весь прогресс?')){ reset(); renderTitle(); } };
}

function render(id, addHistory = true){
  const p = P[id];
  if(!p){ renderTitle(); return; }

  document.querySelectorAll('#title').forEach(e=>e.remove());

  if(state.timer){ clearTimeout(state.timer); state.timer = null; }
  state.typing = false;
  state.passage = id;

  /* предметы */
  if(p.set){
    Object.keys(p.set).forEach(k=>{
      if(p.set[k] && !state.vars[k]){ showItem(k); }
    });
    Object.assign(state.vars, p.set);
  }

  /* концовка */
  if(p.ending){
    state.endings[p.ending] = true;
    save();
    notify('🏆 Концовка открыта', p.ending.toUpperCase());
  }

  /* история */
  if(addHistory){
    state.history = state.history.slice(0, state.hi+1);
    state.history.push(id);
    state.hi = state.history.length - 1;
  }

  save();

  /* фон и спрайт */
  if(p.bg) setBG(p.bg);
  setSprite(p.sprite || null);

  /* интерфейс */
  document.getElementById('nav').style.display = 'flex';
  document.getElementById('menu').style.display = 'flex';
  updateNav();

  /* строим диалог */
  const game = document.getElementById('game');
  const speakerHTML = p.speaker ? `<div id="speaker">${p.speaker}</div>` : '';
  const hintHTML = (!p.choices && p.next) ? '<div id="next-hint">▼</div>' : '';

  game.innerHTML = `
    <div id="dialogue">
      ${speakerHTML}
      <div id="text"></div>
      ${hintHTML}
    </div>
  `;

  /* выборы */
  if(p.choices){
    const box = document.createElement('div');
    box.id = 'choices';
    p.choices.forEach(c=>{
      const a = document.createElement('div');
      a.className = 'choice';
      let locked = false, needTxt = '';
      if(c.need){
        const missing = c.need.filter(k=>!has(k));
        if(missing.length){
          locked = true;
          needTxt = `<span class="need">(нужно: ${missing.map(k=>ITEMS[k].icon+' '+ITEMS[k].name).join(', ')})</span>`;
        }
      }
      if(locked) a.classList.add('locked');
      a.innerHTML = c.text + needTxt;
      a.onclick = ()=>{
        if(locked){
          const missing = c.need.filter(k=>!has(k));
          notify('⚠ Не хватает предметов', missing.map(k=>ITEMS[k].name).join(', '), 'warn');
          return;
        }
        render(c.to);
      };
      box.appendChild(a);
    });
    game.appendChild(box);
  }

  /* клик по диалогу = дальше */
  document.getElementById('dialogue').onclick = ()=>{
    if(state.typing){
      clearTimeout(state.timer);
      const t = document.getElementById('text');
      if(t) t.innerHTML = p.text || '';
      state.typing = false;
      return;
    }
    if(p.choices) return;
    if(p.next) render(p.next);
    else if(p.ending) showEndScreen(p.ending);
  };

  /* печать текста */
  const textEl = document.getElementById('text');
  state.typing = true;
  typeText(textEl, p.text || '', ()=>{ state.typing = false; });

  /* если концовка — через 5 сек показать экран */
  if(p.ending){
    setTimeout(()=>{ if(state.passage === id) showEndScreen(p.ending); }, 5500);
  }
}

/* ============================================================
   ЭКРАН КОНЦОВКИ
   ============================================================ */
function showEndScreen(key){
  document.getElementById('game').innerHTML = '';
  document.getElementById('nav').style.display = 'none';
  document.getElementById('menu').style.display = 'none';

  const data = {
    harmony:{title:'✨ Финал Гармонии', sub:'Природа, наука и тепло сердец', color:'#FBBF24'},
    mastery:{title:'⚙ Финал Мастерства', sub:'Точный расчёт и дружба', color:'#8bab7a'},
    nature: {title:'🌿 Финал Изобилия', sub:'Сытый дух — счастливая долина', color:'#a8d49a'}
  }[key] || {title:'Финал', sub:'', color:'#FBBF24'};

  const el = document.createElement('div');
  el.id = 'title';
  el.innerHTML = `
    <div>
      <h1 style="color:${data.color}">${data.title}</h1>
      <p class="sub" style="color:${data.color}">${data.sub}</p>
    </div>
    <div class="menu">
      <button id="e-again">🔄 Пройти заново</button>
      <button id="e-other">🎭 Другая концовка</button>
      <button id="e-home">🏠 В главное меню</button>
    </div>
    <p class="footer">Верхний Шепот · Праздник Осенней Звезды</p>
  `;
  document.body.appendChild(el);

  document.getElementById('e-again').onclick = ()=>{ reset(); render('Start1'); };
  document.getElementById('e-other').onclick = ()=>{ state.history=[]; state.hi=-1; render('Final', false); };
  document.getElementById('e-home').onclick = ()=>{ reset(); renderTitle(); };
}

/* ============================================================
   НАВИГАЦИЯ
   ============================================================ */
function updateNav(){
  document.getElementById('back').disabled = state.hi <= 0;
  document.getElementById('forward').disabled = state.hi >= state.history.length - 1;
}
function goBack(){
  if(state.hi <= 0) return;
  state.hi--;
  render(state.history[state.hi], false);
}
function goForward(){
  if(state.hi >= state.history.length - 1) return;
  state.hi++;
  render(state.history[state.hi], false);
}

/* ============================================================
   ЖУРНАЛ
   ============================================================ */
function openJournal(){
  const modal = document.getElementById('modal');
  const box = document.getElementById('modal-box');
  let html = '<h2>📖 Журнал</h2><h3>Предметы</h3>';
  const owned = Object.keys(ITEMS).filter(k=>has(k));
  if(!owned.length) html += '<p style="color:#888;font-style:italic">Пока ничего не найдено</p>';
  else owned.forEach(k=>{
    const it = ITEMS[k];
    html += `<div class="item-row"><div class="item-icon">${it.icon}</div><div><div class="item-name">${it.name}</div><div class="item-hint">${it.hint}</div></div></div>`;
  });
  html += '<h3>Доступные финалы</h3>';

  const checks = [
    {key:'harmony', name:'✨ Финал Гармонии', need:['vial','scheme']},
    {key:'mastery', name:'⚙ Финал Мастерства', need:['key']},
    {key:'nature',  name:'🌿 Финал Изобилия',  need:['vial']}
  ];
  checks.forEach(c=>{
    const missing = c.need.filter(k=>!has(k));
    const ready = missing.length === 0;
    html += `<div class="status ${ready?'ready':'locked'}">
      <div>${ready?'✅':'🔒'} ${c.name}</div>
      ${ready?'':`<div class="need">Нужно: ${missing.map(k=>ITEMS[k].name).join(', ')}</div>`}
    </div>`;
  });
  html += '<button id="m-close">Закрыть</button>';
  box.innerHTML = html;
  modal.classList.remove('hidden');
  document.getElementById('m-close').onclick = ()=>modal.classList.add('hidden');
}

/* ============================================================
   МУЗЫКА
   ============================================================ */
let musicStarted = false;
function startMusic(){
  const m = document.getElementById('music');
  if(!m || musicStarted) return;
  m.volume = 0.5;
  m.play().then(()=>musicStarted=true).catch(()=>{
    const kick = ()=>{ m.play().then(()=>{musicStarted=true; document.removeEventListener('click',kick);}).catch(()=>{}); };
    document.addEventListener('click', kick);
  });
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
function init(){
  load();
  startMusic();

  document.getElementById('back').onclick = goBack;
  document.getElementById('forward').onclick = goForward;
  document.getElementById('journal').onclick = openJournal;
  document.getElementById('home').onclick = ()=>{
    if(confirm('Вернуться в главное меню?')){ state.history=[]; state.hi=-1; renderTitle(); }
  };

  document.getElementById('modal').addEventListener('click', e=>{
    if(e.target.id === 'modal') e.target.classList.add('hidden');
  });

  document.addEventListener('keydown', e=>{
    if(e.key === 'ArrowLeft') goBack();
    if(e.key === 'ArrowRight') goForward();
    if(e.key === ' ' || e.key === 'Enter'){
      const d = document.getElementById('dialogue');
      if(d) d.click();
    }
    if(e.key === 'Escape'){
      document.getElementById('modal').classList.add('hidden');
    }
  });

  if(state.passage && state.passage !== 'title'){
    render(state.passage, false);
  } else {
    renderTitle();
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
