<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Песнь Августа — упрощённая версия</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: 'Georgia', 'Times New Roman', serif;
  background: #0a0a14; color: #eee;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* === ФОН И СЦЕНЫ === */
.bg-layer {
  position: fixed; inset: 0;
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-color: #0a0a14;
  z-index: 1; pointer-events: none;
  opacity: 1;
  transition: opacity 0.8s ease-in-out;
  animation: kenBurns 28s ease-in-out infinite alternate;
}
@keyframes kenBurns {
  0%   { transform: scale(1)    translate(0, 0); }
  100% { transform: scale(1.08) translate(-1.2%, -1%); }
}

/* === СЛОЙ СЦЕНЫ (картинка действия) === */
.scene-layer {
  position: fixed; inset: 0;
  z-index: 60;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.7s ease, visibility 0.7s ease;
  background-color: #000;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
.scene-layer.active {
  opacity: 1;
  visibility: visible;
  animation: sceneZoom 5s ease-out forwards;
}
@keyframes sceneZoom {
  from { transform: scale(1); }
  to   { transform: scale(1.06); }
}

/* === ВИНЬЕТКА === */
.vignette-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 4;
  background:
    radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,0.7) 100%),
    linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 25%, transparent 65%, rgba(0,0,0,0.7) 100%);
}

/* === ЗАГРУЗКА === */
.loading-screen {
  position: fixed; inset: 0; z-index: 5000;
  background: radial-gradient(ellipse at center, #14101e 0%, #0a0a14 100%);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 24px;
  transition: opacity 0.8s ease;
}
.loading-screen.hidden { opacity: 0; pointer-events: none; }
.loading-spinner {
  width: 72px; height: 72px;
  border: 3px solid rgba(251,191,36,0.12);
  border-top-color: #FBBF24;
  border-right-color: rgba(251,191,36,0.5);
  border-radius: 50%;
  animation: spin 1.1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
  box-shadow: 0 0 40px rgba(251,191,36,0.35), inset 0 0 20px rgba(251,191,36,0.15);
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  color: #FBBF24; font-size: 14px;
  letter-spacing: 6px; text-transform: uppercase;
  animation: pulse 1.8s ease-in-out infinite;
  text-shadow: 0 0 16px rgba(251,191,36,0.7);
}
@keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

/* === КЛИК-СЛОЙ === */
.click-layer {
  position: fixed; inset: 0; z-index: 90;
  background: transparent; cursor: pointer; display: none;
}
.click-layer.enabled { display: block; }

/* === ДИАЛОГОВОЕ ОКНО (только для персонажей) === */
.dialogue-box {
  position: fixed; left: 50%; bottom: 3vh;
  transform: translateX(-50%);
  width: min(1000px, 92vw);
  max-height: 30vh;
  background: linear-gradient(180deg, rgba(28,22,14,0.94) 0%, rgba(14,10,6,0.97) 100%);
  border: 1px solid rgba(244,197,66,0.6);
  border-radius: 4px;
  box-shadow:
    0 -40px 80px rgba(0,0,0,0.7),
    0 24px 70px rgba(0,0,0,0.8),
    0 0 60px rgba(255,200,80,0.1),
    inset 0 1px 0 rgba(255,255,255,0.08);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  z-index: 100;
  display: flex; flex-direction: column;
  animation: dialogueIn 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  cursor: pointer;
}
.dialogue-box::before, .dialogue-box::after {
  content: ''; position: absolute;
  width: 28px; height: 28px;
  border: 2px solid rgba(244,197,66,0.85);
  pointer-events: none; z-index: 3;
}
.dialogue-box::before {
  top: -2px; left: -2px;
  border-right: none; border-bottom: none;
  border-radius: 4px 0 0 0;
}
.dialogue-box::after {
  bottom: -2px; right: -2px;
  border-left: none; border-top: none;
  border-radius: 0 0 4px 0;
}
@keyframes dialogueIn {
  from { opacity: 0; transform: translateX(-50%) translateY(40px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.speaker-name {
  position: absolute; top: -26px; left: 34px;
  min-width: 150px; max-width: 360px;
  padding: 10px 26px 9px;
  background: linear-gradient(180deg, rgba(217,119,6,1) 0%, rgba(160,75,10,1) 100%);
  color: #FFF8E7;
  font-size: clamp(14px, 1.2vw, 18px);
  font-weight: bold; border-radius: 3px;
  border: 1px solid rgba(244,197,66,0.95);
  box-shadow:
    0 10px 28px rgba(0,0,0,0.7),
    0 0 24px rgba(255,180,50,0.35),
    inset 0 1px 0 rgba(255,255,255,0.3);
  text-shadow: 1px 1px 4px rgba(0,0,0,0.85);
  letter-spacing: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  z-index: 4;
}
.speaker-name::after {
  content: ''; position: absolute;
  bottom: -6px; left: 22px;
  width: 0; height: 0;
  border-left: 7px solid transparent;
  border-right: 7px solid transparent;
  border-top: 7px solid rgba(160,75,10,1);
}
.dialogue-text {
  width: 100%; flex: 1;
  min-height: 10vh; max-height: 22vh;
  color: #f5ecd7;
  font-size: clamp(15px, 1.2vw, 19px);
  line-height: 1.75;
  text-shadow: 0 1px 3px rgba(0,0,0,0.95);
  padding: 34px 44px 30px;
  overflow-y: auto;
  letter-spacing: 0.2px;
}
.dialogue-text b { color: #FFE9A8; font-weight: bold; }
.dialogue-text i { color: #d8c9a8; font-style: italic; }
.type-cursor {
  display: inline-block; color: #FFD700;
  animation: cursorBlink 0.8s steps(2, start) infinite;
  font-weight: bold; margin-left: 2px;
}
@keyframes cursorBlink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
.next-hint {
  position: absolute; right: 26px; bottom: 16px;
  color: #FFD700;
  font-size: clamp(18px, 1.5vw, 24px);
  opacity: 0.85;
  animation: nextPulse 1.5s ease-in-out infinite;
  pointer-events: none;
  text-shadow: 0 0 14px rgba(255,215,0,0.9);
}
@keyframes nextPulse {
  0%,100% { transform: translateY(0); opacity: 0.4; }
  50%     { transform: translateY(6px); opacity: 1; }
}

/* === КЛАССЫ ПЕРСОНАЖЕЙ === */
.dialogue-box.mira { border-color: rgba(230,126,34,0.85); }
.dialogue-box.mira .speaker-name { background: linear-gradient(180deg, rgba(230,126,34,1) 0%, rgba(190,90,15,1) 100%); }
.dialogue-box.mira .speaker-name::after { border-top-color: rgba(190,90,15,1); }
.dialogue-box.bruno { border-color: rgba(170,170,170,0.8); }
.dialogue-box.bruno .speaker-name { background: linear-gradient(180deg, rgba(120,120,120,1) 0%, rgba(70,70,70,1) 100%); color: #F5F5F5; }
.dialogue-box.bruno .speaker-name::after { border-top-color: rgba(70,70,70,1); }
.dialogue-box.shustik { border-color: rgba(80,200,100,0.85); }
.dialogue-box.shustik .speaker-name { background: linear-gradient(180deg, rgba(60,160,80,1) 0%, rgba(35,110,55,1) 100%); }
.dialogue-box.shustik .speaker-name::after { border-top-color: rgba(35,110,55,1); }
.dialogue-box.selesta { border-color: rgba(160,120,210,0.85); }
.dialogue-box.selesta .speaker-name { background: linear-gradient(180deg, rgba(130,90,180,1) 0%, rgba(95,65,135,1) 100%); }
.dialogue-box.selesta .speaker-name::after { border-top-color: rgba(95,65,135,1); }
.dialogue-box.cornelius { border-color: rgba(80,120,210,0.85); }
.dialogue-box.cornelius .speaker-name { background: linear-gradient(180deg, rgba(60,100,180,1) 0%, rgba(35,65,135,1) 100%); }
.dialogue-box.cornelius .speaker-name::after { border-top-color: rgba(35,65,135,1); }
.dialogue-box.august {
  border-color: rgba(255,210,70,1);
  box-shadow: 0 0 70px rgba(255,200,50,0.45), inset 0 1px 0 rgba(255,220,100,0.4);
}
.dialogue-box.august .speaker-name { background: linear-gradient(180deg, rgba(255,210,70,1) 0%, rgba(220,160,20,1) 100%); color: #2A1500; }
.dialogue-box.august .speaker-name::after { border-top-color: rgba(220,160,20,1); }
.dialogue-box.olven { border-style: dashed; border-color: rgba(170,130,70,0.9); background: linear-gradient(180deg, rgba(50,38,22,0.94) 0%, rgba(28,20,10,0.97) 100%); }
.dialogue-box.olven .speaker-name { background: linear-gradient(180deg, rgba(150,110,55,1) 0%, rgba(100,70,30,1) 100%); }
.dialogue-box.olven .speaker-name::after { border-top-color: rgba(100,70,30,1); }
.dialogue-box.olven .dialogue-text { font-style: italic; color: #f0e3c8; }
.dialogue-box.player { border-color: rgba(100,200,255,0.85); }
.dialogue-box.player .speaker-name { background: linear-gradient(180deg, rgba(60,140,200,1) 0%, rgba(35,90,150,1) 100%); color: #F0F8FF; }
.dialogue-box.player .speaker-name::after { border-top-color: rgba(35,90,150,1); }
.dialogue-box.final-box {
  border-color: rgba(255,215,0,1);
  box-shadow: 0 0 80px rgba(255,215,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
}
.dialogue-box.final-box .speaker-name { background: linear-gradient(180deg, rgba(255,215,0,1) 0%, rgba(200,150,20,1) 100%); color: #2A1500; }
.dialogue-box.final-box .speaker-name::after { border-top-color: rgba(200,150,20,1); }

/* === ВЫБОРЫ === */
.choice-box {
  position: fixed; left: 50%; bottom: 38vh;
  transform: translateX(-50%); z-index: 101;
  display: flex; flex-direction: column; gap: 14px;
  width: min(720px, 88vw);
  animation: choicesIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.2s backwards;
}
@keyframes choicesIn {
  from { opacity: 0; transform: translateX(-50%) translateY(24px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.choice-box a {
  position: relative;
  width: 100%; display: block; text-align: left;
  padding: 16px 26px 16px 60px;
  background: linear-gradient(180deg, rgba(28,22,14,0.94) 0%, rgba(14,10,6,0.97) 100%);
  color: #F5ECD7;
  border: 1px solid rgba(244,197,66,0.5);
  border-radius: 4px;
  text-decoration: none;
  font-size: clamp(13px, 1.05vw, 16px);
  line-height: 1.4;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 8px 24px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
  letter-spacing: 0.4px; overflow: hidden;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.choice-box a::before {
  content: '▸'; position: absolute;
  left: 22px; top: 50%;
  transform: translateY(-50%);
  color: #FBBF24; font-size: 18px;
  transition: all 0.3s ease;
}
.choice-box a:hover {
  background: linear-gradient(180deg, rgba(244,197,66,0.18) 0%, rgba(180,120,20,0.12) 100%);
  border-color: rgba(244,197,66,0.95);
  color: #FFF8E7;
  transform: translateX(6px);
  box-shadow: 0 14px 38px rgba(0,0,0,0.7), 0 0 30px rgba(255,200,80,0.3);
}
.choice-box a:hover::before { color: #FFD700; transform: translateY(-50%) translateX(4px); }

/* === КНОПКИ ИГРЫ === */
.game-menu {
  position: fixed; top: 18px; right: 18px;
  display: flex; gap: 12px; z-index: 300;
}
.game-menu button {
  width: 50px; height: 50px;
  border-radius: 50%;
  border: 1px solid rgba(244,197,66,0.7);
  background: linear-gradient(180deg, rgba(28,22,14,0.9) 0%, rgba(14,10,6,0.95) 100%);
  color: #FBBF24;
  font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 6px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.game-menu button:hover {
  transform: translateY(-3px) scale(1.08);
  box-shadow: 0 12px 30px rgba(0,0,0,0.7), 0 0 24px rgba(255,200,80,0.5);
  border-color: rgba(244,197,66,1);
  color: #FFD700;
}

/* === НАЗАД/ВПЕРЁД === */
.history-controls {
  position: fixed; top: 18px; left: 18px;
  display: flex; gap: 12px; z-index: 300;
}
.history-btn {
  width: 50px; height: 50px;
  border-radius: 50%;
  border: 1px solid rgba(244,197,66,0.7);
  background: linear-gradient(180deg, rgba(28,22,14,0.9) 0%, rgba(14,10,6,0.95) 100%);
  color: #FBBF24;
  font-size: 22px; font-weight: bold;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.3s ease;
  box-shadow: 0 6px 20px rgba(0,0,0,0.6);
  font-family: 'Georgia', serif;
}
.history-btn:hover:not(:disabled) {
  transform: translateY(-3px) scale(1.08);
  box-shadow: 0 12px 30px rgba(0,0,0,0.7), 0 0 24px rgba(255,200,80,0.5);
  color: #FFD700;
}
.history-btn:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(0.8); }

/* === УВЕДОМЛЕНИЯ === */
.notification {
  position: fixed; top: 90px; right: 24px;
  background: linear-gradient(180deg, rgba(217,119,6,0.97) 0%, rgba(160,75,10,0.97) 100%);
  color: #FFF8E7;
  padding: 16px 26px 16px 30px;
  border: 1px solid rgba(244,197,66,0.9);
  border-left: 4px solid #FBBF24;
  border-radius: 6px;
  box-shadow: 0 14px 40px rgba(0,0,0,0.7), 0 0 30px rgba(255,180,50,0.4);
  font-size: 14px;
  z-index: 400;
  opacity: 0;
  transform: translateX(80px);
  transition: all 0.55s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
  max-width: 340px;
}
.notification.show { opacity: 1; transform: translateX(0); }
.notification b { color: #FFE9A8; display: block; margin-bottom: 5px; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; }

/* === ТИТУЛЬНИК === */
.title-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: space-between;
  padding: 8vh 20px 6vh; z-index: 200;
  background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.15) 30%, rgba(0,0,0,0.3) 65%, rgba(0,0,0,0.85) 100%);
}
.title-logo { text-align: center; animation: titleFadeIn 1.3s ease-out; }
@keyframes titleFadeIn {
  from { opacity: 0; transform: translateY(-30px); }
  to   { opacity: 1; transform: translateY(0); }
}
.title-main {
  font-size: clamp(38px, 6vw, 76px);
  color: #FFF8E7;
  text-shadow:
    -3px -3px 0 #8B4513, 3px -3px 0 #8B4513,
    -3px 3px 0 #8B4513, 3px 3px 0 #8B4513,
     0 0 40px rgba(255, 220, 100, 1),
     0 0 80px rgba(255, 180, 50, 0.7);
  letter-spacing: 8px; margin: 0; font-weight: bold;
  animation: titleGlow 3.6s ease-in-out infinite;
}
@keyframes titleGlow {
  0%,100% { text-shadow: -3px -3px 0 #8B4513, 3px -3px 0 #8B4513, -3px 3px 0 #8B4513, 3px 3px 0 #8B4513, 0 0 40px rgba(255,220,100,1), 0 0 80px rgba(255,180,50,0.7); }
  50%     { text-shadow: -3px -3px 0 #8B4513, 3px -3px 0 #8B4513, -3px 3px 0 #8B4513, 3px 3px 0 #8B4513, 0 0 65px rgba(255,240,150,1), 0 0 120px rgba(255,200,80,0.9); }
}
.title-sub {
  font-size: clamp(14px, 1.2vw, 19px);
  color: #FFF3C4;
  text-shadow: 2px 2px 0 #8B4513, 3px 3px 8px rgba(0,0,0,0.95);
  font-style: italic; margin-top: 14px; letter-spacing: 6px;
  text-transform: uppercase;
}
.title-menu {
  display: flex; flex-direction: column; gap: 14px;
  width: min(340px, 80vw);
}
.title-menu button {
  background: linear-gradient(180deg, rgba(28,22,14,0.9) 0%, rgba(14,10,6,0.95) 100%);
  color: #FFE9A8;
  padding: 15px 26px;
  border-radius: 4px;
  border: 1px solid rgba(244,197,66,0.6);
  cursor: pointer;
  font-size: clamp(13px, 1.05vw, 16px);
  font-weight: bold; font-family: inherit; text-align: center;
  letter-spacing: 2.5px; text-transform: uppercase;
  transition: all 0.3s ease;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
}
.title-menu button:hover:not(:disabled) {
  background: linear-gradient(180deg, rgba(244,197,66,0.2) 0%, rgba(180,120,20,0.15) 100%);
  color: #FFF8E7;
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 16px 40px rgba(0,0,0,0.7), 0 0 30px rgba(255,200,80,0.5);
  border-color: rgba(244,197,66,1);
}
.title-menu button:disabled { opacity: 0.35; cursor: not-allowed; filter: grayscale(0.7); }
.title-footer {
  font-size: clamp(11px, 0.9vw, 13px);
  color: #FFF3C4;
  letter-spacing: 4px; font-style: italic; opacity: 0.9; margin: 0;
  text-transform: uppercase;
}
.title-endings {
  position: fixed; left: 50%; bottom: 12vh;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.82);
  color: #FFD700;
  padding: 12px 32px;
  border: 1px solid rgba(255,215,0,0.9);
  border-radius: 999px;
  font-size: clamp(12px, 1vw, 15px);
  letter-spacing: 2px;
  box-shadow: 0 8px 32px rgba(255,215,0,0.35);
  z-index: 210;
  text-transform: uppercase;
  backdrop-filter: blur(8px);
}

/* === МОДАЛКИ === */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  backdrop-filter: blur(6px);
}
.modal-overlay.hidden { display: none; }
.modal {
  background: linear-gradient(180deg, #1a1410 0%, #0d0a08 100%);
  border: 1px solid rgba(244,197,66,0.6);
  max-width: 620px; width: 100%; max-height: 84vh;
  overflow-y: auto; padding: 30px;
  border-radius: 6px;
  box-shadow: 0 40px 100px rgba(0,0,0,0.9), 0 0 60px rgba(255,200,80,0.15);
  animation: modalIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(20px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.modal h2 {
  margin: 0 0 22px; color: #FBBF24;
  text-transform: uppercase; font-size: 18px; letter-spacing: 3px;
  border-bottom: 1px solid rgba(244,197,66,0.25);
  padding-bottom: 14px;
}
.modal .row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 0; border-bottom: 1px solid rgba(244,197,66,0.12);
  gap: 12px; flex-wrap: wrap;
}
.modal .row:last-of-type { border-bottom: none; }
.modal label { color: #ddd; }
.modal select, .modal input[type=range] {
  background: #1c1813; color: #eee;
  border: 1px solid #4a3f2f;
  padding: 8px 12px; border-radius: 4px;
  font-family: inherit; font-size: 14px;
}
.modal .buttons { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; flex-wrap: wrap; }
.modal button {
  background: linear-gradient(180deg, rgba(60,100,180,0.95) 0%, rgba(35,65,135,0.95) 100%);
  color: #fff; border: 1px solid rgba(100,140,220,0.9);
  padding: 11px 24px; border-radius: 4px;
  cursor: pointer; font-family: inherit; font-size: 14px;
  font-weight: bold; letter-spacing: 1.5px;
  text-transform: uppercase;
}
.modal button:hover {
  background: linear-gradient(180deg, rgba(80,130,220,1) 0%, rgba(45,85,165,1) 100%);
  transform: translateY(-2px);
}
.modal .ach-list { display: flex; flex-direction: column; gap: 10px; }
.modal .ach {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px; border-radius: 6px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(244,197,66,0.15);
}
.modal .ach.locked { opacity: 0.35; filter: grayscale(1); }
.modal .ach .icon { font-size: 26px; }

const SAVE_KEY = 'pesn_augusta_simple_save';
const ENDINGS_KEY = 'pesn_augusta_simple_endings';
const ACHIEVEMENTS_KEY = 'pesn_augusta_simple_ach';

const gameState = {
  currentPassage: 'title',
  history: [], historyIndex: -1,
  variables: {}, endings: {}, achievements: {},
  isTyping: false, typewriterTimer: null,
  sceneTimer: null, sceneTimer2: null,
  settings: { textSpeed: 40, typewriter: 'on' }
};

function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      currentPassage: gameState.currentPassage,
      history: gameState.history,
      historyIndex: gameState.historyIndex,
      variables: gameState.variables,
      endings: gameState.endings,
      achievements: gameState.achievements
    }));
    return true;
  } catch (e) { return false; }
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || !s.currentPassage) return false;
    gameState.currentPassage = s.currentPassage;
    gameState.history = s.history || [];
    gameState.historyIndex = typeof s.historyIndex === 'number' ? s.historyIndex : gameState.history.length - 1;
    gameState.variables = s.variables || {};
    gameState.endings = Object.assign({}, gameState.endings, s.endings || {});
    gameState.achievements = Object.assign({}, gameState.achievements, s.achievements || {});
    return true;
  } catch (e) { return false; }
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function loadEndings() { try { const s = localStorage.getItem(ENDINGS_KEY); if (s) gameState.endings = Object.assign({}, JSON.parse(s), gameState.endings); } catch (e) {} }
function saveEndings() { try { localStorage.setItem(ENDINGS_KEY, JSON.stringify(gameState.endings)); } catch (e) {} }
function loadAchievements() { try { const s = localStorage.getItem(ACHIEVEMENTS_KEY); if (s) gameState.achievements = Object.assign({}, JSON.parse(s), gameState.achievements); } catch (e) {} }
function saveAchievements() { try { localStorage.setItem(ACHIEVEMENTS_KEY, JSON.stringify(gameState.achievements)); } catch (e) {} }
function countEndings() { return ['harmony','mastery','science','unity'].filter(k => gameState.endings[k]).length; }
function resetAll() {
  gameState.endings = {}; gameState.achievements = {}; gameState.variables = {};
  gameState.history = []; gameState.historyIndex = -1;
  try { localStorage.removeItem(SAVE_KEY); localStorage.removeItem(ENDINGS_KEY); localStorage.removeItem(ACHIEVEMENTS_KEY); } catch (e) {}
}
function unlockAchievement(key) {
  if (gameState.achievements[key]) return;
  gameState.achievements[key] = true;
  saveAchievements();
  const a = ACHIEVEMENTS[key];
  if (a) showNotification('🏆 Достижение', `${a.icon} ${a.title}`);
}

/* ============================================================
   УВЕДОМЛЕНИЯ
   ============================================================ */
let notifyTimer = null;
function showNotification(title, text) {
  const el = document.getElementById('notification');
  if (!el) return;
  el.innerHTML = `<b>${title}</b>${text}`;
  el.classList.add('show');
  if (notifyTimer) clearTimeout(notifyTimer);
  notifyTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

/* ============================================================
   ФОН И СЦЕНЫ
   ============================================================ */
let bgTimer = null;
function setBackground(locationKey) {
  const bg = document.getElementById('bgLayer');
  const url = LOCATION_BG[locationKey];
  if (!url) return;
  if (bgTimer) { clearTimeout(bgTimer); bgTimer = null; }
  bg.style.opacity = '0';
  bgTimer = setTimeout(() => {
    bg.style.backgroundImage = `url("${url}")`;
    bg.style.opacity = '1';
    bgTimer = null;
  }, 400);
}

function showScene(imgUrl, duration, callback) {
  const layer = document.getElementById('sceneLayer');
  if (!layer) return;
  if (gameState.sceneTimer) { clearTimeout(gameState.sceneTimer); gameState.sceneTimer = null; }
  if (gameState.sceneTimer2) { clearTimeout(gameState.sceneTimer2); gameState.sceneTimer2 = null; }
  layer.style.backgroundImage = `url("${imgUrl}")`;
  layer.classList.remove('active');
  void layer.offsetWidth;
  layer.classList.add('active');
  gameState.sceneTimer = setTimeout(() => {
    layer.classList.remove('active');
    gameState.sceneTimer2 = setTimeout(() => {
      layer.style.backgroundImage = '';
      gameState.sceneTimer2 = null;
    }, 700);
    gameState.sceneTimer = null;
    if (callback) callback();
  }, duration);
}

/* ============================================================
   ПЕЧАТАЮЩИЙСЯ ТЕКСТ
   ============================================================ */
function typeText(element, html, speed, callback) {
  const tokens = [];
  let i = 0;
  while (i < html.length) {
    if (html[i] === '<') {
      const end = html.indexOf('>', i);
      if (end === -1) { tokens.push(html[i]); i++; continue; }
      tokens.push(html.slice(i, end + 1));
      i = end + 1;
    } else { tokens.push(html[i]); i++; }
  }
  element.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'type-cursor';
  cursor.textContent = '▍';
  element.appendChild(cursor);
  let idx = 0;
  function step() {
    if (idx >= tokens.length) {
      cursor.remove();
      element.innerHTML = html;
      gameState.isTyping = false;
      if (callback) callback();
      return;
    }
    const t = tokens[idx++];
    cursor.insertAdjacentHTML('beforebegin', t);
    if (t.startsWith('<')) step();
    else gameState.typewriterTimer = setTimeout(step, speed);
  }
  step();
}

/* ============================================================
   ПЕРЕХОДЫ
   ============================================================ */
function goTo(id, addToHistory = true) {
  const p = PASSAGES[id];
  if (!p) { console.error('Пассаж не найден:', id); return; }

  if (gameState.typewriterTimer) { clearTimeout(gameState.typewriterTimer); gameState.typewriterTimer = null; }
  if (gameState.sceneTimer) { clearTimeout(gameState.sceneTimer); gameState.sceneTimer = null; }
  if (gameState.sceneTimer2) { clearTimeout(gameState.sceneTimer2); gameState.sceneTimer2 = null; }
  gameState.isTyping = false;
  gameState.currentPassage = id;

  // Титульник
  if (p.isTitle) { renderTitle(); return; }

  // Установка переменных
  if (p.set) {
    Object.assign(gameState.variables, p.set);
    const map = {
      has_feather: 'feather', has_crystal: 'crystal', has_pollen: 'pollen',
      has_selesta_vial: 'vial', has_key: 'key', has_secret_door: 'secret',
      has_scheme: 'scheme'
    };
    for (const [k, a] of Object.entries(map)) {
      if (p.set[k]) unlockAchievement(a);
    }
  }
  if (p.ending) {
    gameState.endings[p.ending] = true;
    saveEndings();
    if (countEndings() >= 4) unlockAchievement('allEndings');
  }
  if (addToHistory) {
    gameState.history = gameState.history.slice(0, gameState.historyIndex + 1);
    gameState.history.push(id);
    gameState.historyIndex = gameState.history.length - 1;
  }
  if (p.location) setBackground(p.location);

  // === СЦЕНА (картинка действия) ===
  if (p.type === 'scene' && p.scene) {
    showScene(p.scene, p.duration || 2200, () => {
      if (p.next) goTo(p.next);
    });
    return;
  }

  // === ДИАЛОГ И ВЫБОР ===
  renderDialogue(id, p);
}

function renderDialogue(id, p) {
  const gameArea = document.getElementById('gameArea');
  const boxClass = p.boxClass || 'narrator';
  const speaker = p.speaker || '';

  let navHTML = '';
  if (p.type === 'choice' && p.choices) {
    navHTML = '<div class="choice-box">' + p.choices.map(c =>
      `<a data-to="${c.to}"><span>${c.text}</span></a>`
    ).join('') + '</div>';
  }

  const menuHTML = `
    <div class="game-menu">
      <button id="btnSave" title="Сохранить">💾</button>
      <button id="btnMenu" title="Меню">🏠</button>
    </div>
  `;

  const boxHTML = `
    <div class="dialogue-box ${boxClass}">
      ${speaker ? `<div class="speaker-name">${speaker}</div>` : ''}
      <div class="dialogue-text" id="dialogueText"></div>
      ${p.type === 'dialogue' && p.next ? '<div class="next-hint">▼</div>' : ''}
    </div>
  `;

  gameArea.innerHTML = boxHTML + navHTML + menuHTML;

  // Выборы
  gameArea.querySelectorAll('[data-to]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const to = btn.dataset.to;
      saveGame();
      if (to === 'title') { gameState.history = []; gameState.historyIndex = -1; goTo('title', false); }
      else goTo(to);
    });
  });

  // Клик по диалогу
  const box = gameArea.querySelector('.dialogue-box');
  if (box) {
    box.addEventListener('click', (e) => {
      if (e.target.closest('[data-to]')) return;
      if (e.target.closest('.game-menu')) return;
      e.stopPropagation();
      advanceDialogue();
    });
  }

  // Кнопки
  const saveBtn = document.getElementById('btnSave');
  if (saveBtn) saveBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (saveGame()) { saveBtn.textContent = '✅'; showNotification('💾', 'Игра сохранена'); setTimeout(() => saveBtn.textContent = '💾', 1000); }
  });
  const menuBtn = document.getElementById('btnMenu');
  if (menuBtn) menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (confirm('В главное меню?')) { gameState.history = []; gameState.historyIndex = -1; goTo('title', false); }
  });

  // Текст
  const textEl = document.getElementById('dialogueText');
  if (gameState.settings.typewriter === 'on') {
    gameState.isTyping = true;
    typeText(textEl, p.text || '', gameState.settings.textSpeed, () => { gameState.isTyping = false; });
  } else {
    textEl.innerHTML = p.text || '';
  }

  // Клик-слой
  const clickLayer = document.getElementById('clickLayer');
  if (clickLayer) {
    if (p.type === 'choice') clickLayer.classList.remove('enabled');
    else clickLayer.classList.add('enabled');
  }

  updateHistoryButtons();
}

function advanceDialogue() {
  const p = PASSAGES[gameState.currentPassage];
  if (!p) return;
  if (gameState.isTyping) {
    if (gameState.typewriterTimer) { clearTimeout(gameState.typewriterTimer); gameState.typewriterTimer = null; }
    const textEl = document.getElementById('dialogueText');
    if (textEl) textEl.innerHTML = p.text || '';
    gameState.isTyping = false;
    return;
  }
  if (p.type === 'choice') return;
  if (p.next) {
    if (p.next === 'title') { gameState.history = []; gameState.historyIndex = -1; goTo('title', false); }
    else goTo(p.next);
  }
}

/* ============================================================
   ТИТУЛЬНИК
   ============================================================ */
function renderTitle() {
  gameState.currentPassage = 'title';
  setBackground('title');
  const clickLayer = document.getElementById('clickLayer');
  if (clickLayer) clickLayer.classList.remove('enabled');

  const gameArea = document.getElementById('gameArea');
  const count = countEndings();
  const canLoad = hasSave();

  gameArea.innerHTML = `
    <div class="title-screen">
      <div class="title-logo">
        <h1 class="title-main">Песнь Августа</h1>
        <p class="title-sub">Упрощённая сказка</p>
      </div>
      <div class="title-menu">
        <button id="btnStart">▶ Начать</button>
        <button id="btnLoad" ${canLoad ? '' : 'disabled'}>📂 Загрузить</button>
        <button id="btnAchievements">🏆 Достижения</button>
        <button id="btnReset">🔄 Сбросить</button>
      </div>
      <p class="title-footer">Верхний Шепот · Праздник Осенней Звезды</p>
    </div>
    <div class="title-endings">🏆 Концовок: <b>${count} / 4</b></div>
  `;

  document.getElementById('btnStart').addEventListener('click', () => {
    gameState.history = []; gameState.historyIndex = -1;
    gameState.variables = {};
    goTo('S1');
  });
  document.getElementById('btnLoad').addEventListener('click', () => {
    if (loadGame()) goTo(gameState.currentPassage, false);
    else showNotification('⚠', 'Сохранение не найдено');
  });
  document.getElementById('btnAchievements').addEventListener('click', openAchievements);
  document.getElementById('btnReset').addEventListener('click', () => {
    if (confirm('Сбросить весь прогресс?')) { resetAll(); renderTitle(); }
  });
  updateHistoryButtons();
}

function updateHistoryButtons() {
  const back = document.getElementById('btnBack');
  const fwd = document.getElementById('btnForward');
  const controls = document.getElementById('historyControls');
  if (gameState.currentPassage === 'title') { controls.style.display = 'none'; return; }
  controls.style.display = 'flex';
  back.disabled = gameState.historyIndex <= 0;
  fwd.disabled = gameState.historyIndex >= gameState.history.length - 1;
}
function goBack() {
  if (gameState.historyIndex <= 0) return;
  gameState.historyIndex--;
  goTo(gameState.history[gameState.historyIndex], false);
}
function goForward() {
  if (gameState.historyIndex >= gameState.history.length - 1) return;
  gameState.historyIndex++;
  goTo(gameState.history[gameState.historyIndex], false);
}

/* ============================================================
   ДОСТИЖЕНИЯ
   ============================================================ */
function openAchievements() {
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  let html = '<h2>🏆 Достижения</h2><div class="ach-list">';
  for (const [key, a] of Object.entries(ACHIEVEMENTS)) {
    const unlocked = !!gameState.achievements[key];
    html += `
      <div class="ach ${unlocked ? '' : 'locked'}">
        <div class="icon">${unlocked ? a.icon : '🔒'}</div>
        <div class="info">
          <div class="title">${a.title}</div>
          <div class="desc">${a.desc}</div>
        </div>
      </div>
    `;
  }
  html += '</div><div class="buttons"><button id="achClose">Закрыть</button></div>';
  content.innerHTML = html;
  overlay.classList.remove('hidden');
  document.getElementById('achClose').addEventListener('click', () => overlay.classList.add('hidden'));
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
function init() {
  loadEndings();
  loadAchievements();

  document.getElementById('btnBack').addEventListener('click', goBack);
  document.getElementById('btnForward').addEventListener('click', goForward);

  const clickLayer = document.getElementById('clickLayer');
  if (clickLayer) clickLayer.addEventListener('click', advanceDialogue);

  document.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); goBack(); }
    else if (ev.key === 'ArrowRight') { ev.preventDefault(); goForward(); }
    else if (ev.key === ' ' || ev.key === 'Enter') {
      ev.preventDefault();
      advanceDialogue();
    }
    else if (ev.key === 'Escape') {
      const overlay = document.getElementById('modalOverlay');
      if (!overlay.classList.contains('hidden')) overlay.classList.add('hidden');
    }
  });

  document.getElementById('modalOverlay').addEventListener('click', ev => {
    if (ev.target.id === 'modalOverlay') ev.target.classList.add('hidden');
  });

  setTimeout(() => {
    const loading = document.getElementById('loadingScreen');
    if (loading) loading.classList.add('hidden');
  }, 700);

  goTo('title', false);
}

document.addEventListener('DOMContentLoaded', init);
</script>
